# Gitleaks configuration for Nuotao AI OS
# See https://github.com/gitleaks/gitleaks
#
# Default rules are extended (useDefault = true). The allowlist below
# suppresses false positives that match legitimate, non-secret values.
[extend]
useDefault = true

[allowlist]
description = "Legitimate 1688 product detail URLs and public sample identifiers (not credentials)"
regexes = [
    '''detail\.1688\.com''',
]
