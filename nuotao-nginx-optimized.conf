# ============================================================
# Nuotao AI OS - Nginx 优化配置
# 优化项：HTTP/2、安全头、Gzip、keepalive、open_file_cache、限流、SSL
# ============================================================

# 限流区域定义（在 http 块中）
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
# limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

server {
    server_name admin.nuotaooutdoor.com;

    # 前端静态文件根目录
    root /var/www/nuotao;
    index index.html;

    # 日志
    access_log /var/log/nginx/nuotao_access.log;
    error_log /var/log/nginx/nuotao_error.log warn;

    # ============================================================
    # Gzip 压缩优化
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ============================================================
    # 安全头
    # ============================================================
    # HSTS - 强制 HTTPS（1 年，包含子域名，允许预加载）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 权限策略（禁用不必要的 API）
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # XSS 保护（现代浏览器已内置，但保留兼容）
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================================
    # 连接优化
    # ============================================================
    keepalive_timeout 65;
    keepalive_requests 1000;
    send_timeout 30s;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ============================================================
    # 静态文件缓存
    # ============================================================
    # 带哈希的资源文件 - 长期缓存（1 年，不可变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 字体文件 - 长期缓存
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 图片文件 - 中期缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============================================================
    # API 反向代理到后端 FastAPI
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 上游连接复用
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # API 文档反向代理
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
    }

    # 健康检查（不记录日志）
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================================
    # 前端路由（React SPA）- 所有未匹配的路径返回 index.html
    # HTML 不缓存（确保更新立即可见）
    # ============================================================
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================================
    # SSL 配置（Certbot 管理）
    # ============================================================
    listen 443 ssl; # managed by Certbot
    http2 on; # 启用 HTTP/2（Nginx 1.25.1+ 新语法）
    ssl_certificate /etc/letsencrypt/live/admin.nuotaooutdoor.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.nuotaooutdoor.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot（含 ssl_session_cache/timeout/tickets/protocols/ciphers）
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # OCSP Stapling（letsencrypt 配置中不含）
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
}

# HTTP 重定向到 HTTPS
server {
    if ($host = admin.nuotaooutdoor.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admin.nuotaooutdoor.com;
    return 404; # managed by Certbot
}
