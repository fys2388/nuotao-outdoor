global:
  resolve_timeout: 5m

route:
  receiver: 'feishu-webhook'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: 'feishu-webhook'
      repeat_interval: 30m
    - matchers:
        - severity="warning"
      receiver: 'feishu-webhook'
      repeat_interval: 2h

receivers:
  - name: 'feishu-webhook'
    webhook_configs:
      - url: 'http://127.0.0.1:8060/webhook'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance']
