# /etc/nginx/sites-available/nuotao-console
# AI OS 控制台（React SPA）——独立端口 8081，与 WordPress 主站分离

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/nuotao;
    index index.html;

    # SPA fallback：所有路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
