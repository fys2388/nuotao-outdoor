# /etc/nginx/sites-available/nuotao-console
# Nuotao AI OS 控制台（React SPA）— 独立端口 8081，与 WordPress 主站分离
# 此文件为版本管理模板，由 deploy.yml 安装到服务器，禁止在服务器上手工修改。
# 修改请走 PR → 评审 → 合并 main → 部署。

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/nuotao;
    index index.html;

    # SPA fallback：所有路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
