# ============================================
# Nuotao AI OS - Nginx CDN & Cache 配置
# ============================================
# 功能：
#   1. 静态资源 CDN 缓存（1年）
#   2. API 响应缓存（可配置）
#   3. Gzip/Brotli 压缩
#   4. 浏览器缓存控制
#   5. 安全头
# ============================================

# 上游后端服务
upstream nuotao_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 缓存区域定义
proxy_cache_path /var/cache/nginx/nuotao_api
    levels=1:2
    keys_zone=nuotao_api_cache:10m
    max_size=100m
    inactive=60m
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/nuotao_static
    levels=1:2
    keys_zone=nuotao_static_cache:20m
    max_size=500m
    inactive=7d
    use_temp_path=off;

server {
    listen 80;
    server_name nuotaooutdoor.com www.nuotaooutdoor.com;

    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nuotaooutdoor.com www.nuotaooutdoor.com;

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/nuotaooutdoor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuotaooutdoor.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Brotli 压缩（需要 ngx_brotli 模块）
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ============================================
    # 前端静态资源（CDN 缓存 1 年）
    # ============================================
    location /assets/ {
        alias /opt/nuotao-ai-os/frontend/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status "HIT";

        # 静态资源缓存
        proxy_cache nuotao_static_cache;
        proxy_cache_valid 200 1y;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
    }

    # 前端其他静态文件
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /opt/nuotao-ai-os/frontend/dist;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # API 响应缓存（只读接口）
    # ============================================
    location ~ ^/api/v1/(products|analytics|reports)(/|$) {
        proxy_pass http://nuotao_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 缓存
        proxy_cache nuotao_api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";

        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=300";
    }

    # ============================================
    # 其他 API 请求（不缓存）
    # ============================================
    location /api/ {
        proxy_pass http://nuotao_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # 健康检查端点
    # ============================================
    location /healthz {
        proxy_pass http://nuotao_backend/health;
        access_log off;
    }

    # ============================================
    # 前端 SPA 路由（history 模式）
    # ============================================
    location / {
        root /opt/nuotao-ai-os/frontend/dist;
        try_files $uri $uri/ /index.html;

        # index.html 不缓存（确保更新立即生效）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
