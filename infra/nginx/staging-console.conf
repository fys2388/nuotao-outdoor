# Staging 控制台 Nginx 配置（独立端口 8082）
# 用法：cp infra/nginx/staging-console.conf /etc/nginx/sites-available/nuotao-staging
#       ln -s /etc/nginx/sites-available/nuotao-staging /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

server {
    listen 8082;
    server_name _;

    root /var/www/nuotao-staging;
    index index.html;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 代理（staging 后端端口 8001）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查
    location /healthz {
        proxy_pass http://127.0.0.1:8001/api/v1/healthz;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
