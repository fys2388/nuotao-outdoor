# ============================================
# Prometheus Configuration for Nuotao AI OS
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "nuotao-ai-os"
    environment: "production"

# ============================================
# Alerting Configuration
# ============================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

# ============================================
# Rule Files
# ============================================
rule_files:
  - "alerts.yml"

# ============================================
# Scrape Configurations
# ============================================
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s
    scrape_timeout: 10s

  # Nuotao AI OS API Service
  - job_name: "nuotao-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true

    # Relabel to add service metadata
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "nuotao-api"

  # PostgreSQL Exporter (if deployed)
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "postgresql"

  # Redis Exporter (if deployed)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "redis"

  # Node Exporter (host metrics)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "host"

  # cAdvisor (container metrics)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "containers"

  # Nginx Exporter (if deployed)
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "nginx"
