name: Configure Feishu Env Vars

on:
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
  FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
  FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}

jobs:
  configure-env:
    name: Configure Feishu environment variables on server
    runs-on: ubuntu-latest
    steps:
      - name: Configure .env and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nuotao/backend

            echo "=== 1. Backing up .env ==="
            cp .env .env.bak.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true

            echo "=== 2. Removing old Feishu vars from .env ==="
            sed -i '/^FEISHU_APP_ID=/d' .env
            sed -i '/^FEISHU_APP_SECRET=/d' .env
            sed -i '/^FEISHU_CHAT_ID=/d' .env
            sed -i '/^FEISHU_WEBHOOK_URL=/d' .env
            sed -i '/^FEISHU_CALLBACK_BASE_URL=/d' .env

            echo "=== 3. Adding new Feishu vars to .env ==="
            cat >> .env << EOF

            # Feishu Integration
            FEISHU_APP_ID=${FEISHU_APP_ID}
            FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
            FEISHU_CHAT_ID=${FEISHU_CHAT_ID}
            FEISHU_WEBHOOK_URL=https://open.feishu.cn/open-apis/bot/v2/hook/1035e5f2-8984-44d1-83f4-9fb60f274371
            FEISHU_CALLBACK_BASE_URL=https://admin.nuotaooutdoor.com/api/v1/feishu/card-callback
            EOF

            echo "=== 4. Verifying .env (masking secrets) ==="
            grep -E "^FEISHU_" .env | sed 's/APP_SECRET=.*/APP_SECRET=***MASKED***/'

            echo "=== 5. Restarting backend service ==="
            systemctl restart nuotao-backend 2>/dev/null || {
              echo "nuotao-backend service not found, trying other names..."
              systemctl list-units --type=service | grep -i nuotao || true
            }

            echo "=== 6. Restarting scheduler service ==="
            systemctl restart nuotao-agent-scheduler 2>/dev/null || echo "scheduler service not found"

            echo "=== 7. Waiting for services to start ==="
            sleep 5

            echo "=== 8. Checking service status ==="
            systemctl is-active nuotao-backend 2>/dev/null || echo "nuotao-backend status unknown"
            systemctl is-active nuotao-agent-scheduler 2>/dev/null || echo "scheduler status unknown"

            echo "=== 9. Checking backend health ==="
            curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs || echo "health check failed"

            echo ""
            echo "=== DONE: Feishu env vars configured and services restarted ==="
