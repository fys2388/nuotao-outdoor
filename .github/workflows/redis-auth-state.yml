name: Diagnose Redis Current Auth State

on:
  workflow_dispatch:

jobs:
  diag:
    name: Check redis password state & backend conn (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose redis auth state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            echo "=== redis container started time & cmdline ==="
            docker inspect nuotao-ai-os-redis-1 --format 'StartedAt={{.State.StartedAt}}' 2>&1
            docker inspect nuotao-ai-os-redis-1 --format 'Cmd={{.Config.Cmd}}' 2>&1
            echo ""
            echo "=== redis auth: ping WITHOUT password ==="
            docker exec nuotao-ai-os-redis-1 redis-cli ping 2>&1 | tail -2
            echo "=== redis auth: ping with saved password ==="
            LATEST=$(ls -t /root/redis-backup/redis_password_*.txt 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              docker exec nuotao-ai-os-redis-1 redis-cli -a "$(cat $LATEST)" ping 2>&1 | tail -2
            else
              echo "(no saved password file)"
            fi
            echo ""
            echo "=== scheduler container REDIS_URL (current) ==="
            docker inspect nuotao-ai-os-scheduler-1 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -E '^REDIS_URL=' | sed -E 's#(redis://:[^@ ]*@)#redis://:***REDACTED***@#g'
            echo ""
            echo "=== backend redis conn & env ==="
            BPID=$(pgrep -f uvicorn | head -1)
            tr '\0' '\n' < /proc/$BPID/environ 2>/dev/null | grep -E '^REDIS_URL=' | sed -E 's#(redis://:[^@ ]*@)#redis://:***REDACTED***@#' || echo "(no REDIS_URL)"
            ss -tnp 2>/dev/null | grep 6379 | grep -E 'python' | head -5 || echo "(no python->6379 conn)"
            echo ""
            echo "=== backend journal redis errors (last 15 min) ==="
            journalctl -u nuotao-backend --since "15 min ago" --no-pager 2>/dev/null | grep -iE 'NOAUTH|WRONGPASS|AuthenticationError|redis.*error|connection.*refused|redis.exceptions' | tail -15 || echo "(no redis errors)"
            echo ""
            echo "=== scheduler journal/container redis errors ==="
            docker logs --tail 20 nuotao-ai-os-scheduler-1 2>&1 | grep -iE 'NOAUTH|WRONGPASS|AuthenticationError|redis|error' | tail -10 || echo "(none)"
            echo ""
            echo "=== is /opt/nuotao-ai-os a git repo? (deploy might overwrite compose) ==="
            git -C /opt/nuotao-ai-os rev-parse --is-inside-work-tree 2>&1 || echo "(not a git repo)"
            git -C /opt/nuotao-ai-os log --oneline -3 -- docker-compose.yml 2>&1 || echo "(no git history)"