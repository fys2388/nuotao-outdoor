name: Deploy wc-clickback fix and verify

on:
  workflow_dispatch:

jobs:
  deploy-verify:
    name: Deploy fix + verify wc-clickback returns 401 (not 500)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy fix and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/nuotao-ai-os
            echo "=== 1. Pull fix (checkout wc_clickback.py) ==="
            git fetch origin 2>&1 | tail -1
            git checkout origin/main -- backend/app/api/v1/endpoints/wc_clickback.py
            grep -n "get_trace_id()" backend/app/api/v1/endpoints/wc_clickback.py | head -2
            echo ""
            echo "=== 2. Restart backend ==="
            systemctl restart nuotao-backend
            sleep 5
            systemctl is-active nuotao-backend
            echo ""
            echo "=== 3. Re-test wc-clickback no-signature (expect 401, NOT 500) ==="
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:8000/api/v1/wc-clickback/webhook" -H "Content-Type: application/json" -d '{"product_id":"00000000-0000-0000-0000-000000000001","event_type":"click"}' --max-time 8)
            echo "wc-clickback no-sig => HTTP $code (expect 401)"
            echo ""
            echo "=== 4. Re-test wrong signature (expect 401) ==="
            code2=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:8000/api/v1/wc-clickback/webhook" -H "Content-Type: application/json" -H "X-WC-Webhook-Signature: invalid" -d '{"product_id":"00000000-0000-0000-0000-000000000001","event_type":"click"}' --max-time 8)
            echo "wc-clickback wrong-sig => HTTP $code2 (expect 401)"
            echo ""
            echo "=== 5. backend healthy ==="
            systemctl is-active nuotao-backend
