name: Fix Ops Dashboard Nginx (sed approach)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Nginx config with sed
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            NGINX_CONF="/etc/nginx/sites-available/nuotao"
            
            echo "=== 1. 备份配置 ==="
            cp "$NGINX_CONF" "${NGINX_CONF}.bak.$(date +%Y%m%d%H%M%S)"
            
            echo "=== 2. 删除所有旧的 ops-dashboard location 块 ==="
            # 删除从 # Ops Dashboard 注释到 } 的块
            sed -i '/#.*[Oo]ps.*[Dd]ashboard/,/^    }/d' "$NGINX_CONF"
            # 删除单独的 location ^~ /ops-dashboard/ 块
            sed -i '/location \^~ \/ops-dashboard\//,/^    }/d' "$NGINX_CONF"
            
            echo "=== 3. 查找第一个 location / 的行号 ==="
            LOCATION_LINE=$(grep -n "location / {" "$NGINX_CONF" | head -1 | cut -d: -f1)
            echo "第一个 location / { 在第 $LOCATION_LINE 行"
            
            if [ -z "$LOCATION_LINE" ]; then
                echo "❌ 未找到 location / {"
                exit 1
            fi
            
            echo "=== 4. 在 location / { 之前插入 ops-dashboard 配置 ==="
            INSERT_LINE=$((LOCATION_LINE - 1))
            sed -i "${INSERT_LINE}a\\    # ============================================\\n    # Ops Dashboard 静态文件（优先匹配）\\n    # ============================================\\n    location ^~ /ops-dashboard/ {\\n        alias /opt/nuotao/ops-dashboard/;\\n        index index.html;\\n        try_files \$uri \$uri/ /ops-dashboard/index.html;\\n    }\\n" "$NGINX_CONF"
            
            echo "=== 5. 验证配置 ==="
            grep -n -A 8 "ops-dashboard" "$NGINX_CONF" | head -20
            
            echo "=== 6. 测试 Nginx ==="
            nginx -t
            
            echo "=== 7. 重载 Nginx ==="
            systemctl reload nginx
            
            echo "=== 8. 测试访问 ==="
            sleep 3
            curl -s -o /tmp/test_dash.html -w "HTTP: %{http_code}, Size: %{size_download}\n" http://localhost:80/ops-dashboard/
            echo "前3行:"
            head -3 /tmp/test_dash.html
            if grep -q "运营监控中心" /tmp/test_dash.html; then
                echo "✅✅✅ 成功! 返回 ops-dashboard 页面!"
            else
                echo "❌ 失败: 返回的不是 ops-dashboard 页面"
                echo "完整内容:"
                cat /tmp/test_dash.html
            fi
            
            echo "=== 完成 ==="
