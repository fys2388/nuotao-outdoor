name: Fix Nginx Config

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix nginx config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. 备份配置 ==="
            cp /etc/nginx/sites-available/nuotao /etc/nginx/sites-available/nuotao.bak2
            
            echo "=== 2. 检查文件 ==="
            ls -la /opt/nuotao/ops-dashboard/
            
            echo "=== 3. 用 Python 重写 ops-dashboard 配置 ==="
            python3 << 'PYEOF'
            conf_path = "/etc/nginx/sites-available/nuotao"
            with open(conf_path, 'r') as f:
                content = f.read()
            
            # 删除所有现有的 ops-dashboard location 块
            import re
            # 匹配从 # Ops Dashboard 注释到下一个 } 的块
            pattern = r'\n?\s*#.*Ops Dashboard.*?\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}'
            content = re.sub(pattern, '', content, flags=re.DOTALL)
            
            # 也删除可能残留的单独 location 块
            pattern2 = r'\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}'
            content = re.sub(pattern2, '', content, flags=re.DOTALL)
            
            # 在第一个 server { 之后插入新配置
            new_config = '''
    # ============================================
    # Ops Dashboard 静态文件
    # ============================================
    location ^~ /ops-dashboard/ {
        alias /opt/nuotao/ops-dashboard/;
        index index.html;
        try_files $uri $uri/ /ops-dashboard/index.html;
    }
'''
            
            # 找到 server { 的位置
            server_pos = content.find('server {')
            if server_pos == -1:
                server_pos = content.find('server{')
            
            if server_pos != -1:
                # 在 server { 之后的第一个换行插入
                insert_pos = content.find('\n', server_pos) + 1
                content = content[:insert_pos] + new_config + content[insert_pos:]
                print("✅ 已在 server 块开头插入 ops-dashboard 配置")
            else:
                print("❌ 未找到 server {")
            
            with open(conf_path, 'w') as f:
                f.write(content)
            
            print("✅ 配置文件已写入")
            PYEOF
            
            echo ""
            echo "=== 4. 验证配置 ==="
            grep -A 6 "ops-dashboard" /etc/nginx/sites-available/nuotao | head -20
            
            echo ""
            echo "=== 5. 测试 Nginx ==="
            nginx -t
            
            echo ""
            echo "=== 6. 重载 Nginx ==="
            systemctl reload nginx
            
            echo ""
            echo "=== 7. 测试访问 ==="
            sleep 2
            curl -s -o /tmp/test.html -w "HTTP: %{http_code}, Size: %{size_download}\n" http://localhost:80/ops-dashboard/
            echo "前5行:"
            head -5 /tmp/test.html
            echo "..."
            if grep -q "运营监控中心" /tmp/test.html; then
                echo "✅✅✅ 成功: 返回 ops-dashboard 页面!"
            else
                echo "❌ 失败: 返回错误页面"
                echo "完整内容:"
                cat /tmp/test.html
            fi
