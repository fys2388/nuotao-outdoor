name: Hotdeploy Seedream5 I2I Listing Images (one-off)

# TEMPORARY diagnostic variant: retrieve the authoritative server-side 0052
# migration as base64 (the DB was migrated with it; it is not in git) and show
# alembic heads/current. Does NOT deploy anything.
on:
  workflow_dispatch:

jobs:
  hotdeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch server 0052 migration (base64)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -eo pipefail
            F=/opt/nuotao/backend/alembic/versions/0052_agent_suggestion_dispatch.py
            echo "=== file meta ==="
            ls -l "$F"; wc -c "$F"; sha256sum "$F"
            echo "=====0052_B64_BEGIN====="
            base64 -w0 "$F"
            echo ""
            echo "=====0052_B64_END====="
            echo "=== heads ==="
            cd /opt/nuotao/backend
            .venv/bin/alembic heads 2>&1 | tail -5 || true
            echo "=== current ==="
            .venv/bin/alembic current 2>&1 | tail -3 || true
