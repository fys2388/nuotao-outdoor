name: Check System Status

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因'
        required: false
        default: 'manual check'

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  check-status:
    name: Check system running status
    runs-on: ubuntu-latest
    steps:
      - name: Check all services and data
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. 后端服务状态 ==="
            systemctl is-active nuotao-backend 2>/dev/null || echo "unknown"
            systemctl status nuotao-backend --no-pager -n 3 2>/dev/null | head -8

            echo ""
            echo "=== 2. 调度器服务状态 ==="
            systemctl is-active nuotao-agent-scheduler 2>/dev/null || echo "unknown"
            systemctl status nuotao-agent-scheduler --no-pager -n 5 2>/dev/null | head -10

            echo ""
            echo "=== 3. 调度器最近日志（今天的任务执行情况）==="
            journalctl -u nuotao-agent-scheduler --since "today" --no-pager -n 50 2>/dev/null | tail -30 || echo "无日志"

            echo ""
            echo "=== 4. 后端最近错误日志 ==="
            journalctl -u nuotao-backend --since "today" --no-pager -n 100 2>/dev/null | grep -i "error\|exception\|traceback" | tail -20 || echo "无错误日志"

            echo ""
            echo "=== 5. 数据库建议统计 ==="
            cd /opt/nuotao/backend
            source .venv/bin/activate
            python3 -c "
import asyncio
from app.core.database import async_session_factory
from app.models.agent_suggestion import AgentSuggestion
from sqlalchemy import select, func

async def main():
    async with async_session_factory() as session:
        # 总数
        total = await session.scalar(select(func.count()).select_from(AgentSuggestion))
        print(f'建议总数: {total}')

        # 按状态统计
        from sqlalchemy import group_by
        result = await session.execute(
            select(AgentSuggestion.status, func.count()).group_by(AgentSuggestion.status)
        )
        print('按状态统计:')
        for status, count in result.all():
            print(f'  {status}: {count}')

        # 按类型统计
        result2 = await session.execute(
            select(AgentSuggestion.suggestion_type, func.count()).group_by(AgentSuggestion.suggestion_type)
        )
        print('按类型统计:')
        for stype, count in result2.all():
            print(f'  {stype}: {count}')

        # 最近5条建议
        result3 = await session.execute(
            select(AgentSuggestion).order_by(AgentSuggestion.created_at.desc()).limit(5)
        )
        print('最近5条建议:')
        for s in result3.scalars().all():
            print(f'  ID:{s.id} 标题:{s.title[:30]} 类型:{s.suggestion_type} 状态:{s.status} 创建:{s.created_at}')

asyncio.run(main())
" 2>&1 || echo "数据库查询失败"

            echo ""
            echo "=== 6. 后端健康检查 ==="
            curl -s -o /dev/null -w "HTTP状态码: %{http_code}\n" http://localhost:8000/docs || echo "健康检查失败"

            echo ""
            echo "=== 检查完成 ==="
