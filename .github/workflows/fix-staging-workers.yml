name: Fix Staging Workers

on:
  workflow_dispatch:

jobs:
  fix:
    name: Fix staging workers to 1
    runs-on: ubuntu-latest
    steps:
      - name: Fix staging workers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Stop staging service ==="
            systemctl stop nuotao-backend-staging
            sleep 2

            echo ""
            echo "=== 2. Kill all processes on 8001 ==="
            PIDS=$(ss -tlnp | grep ':8001' | grep -oP 'pid=\K[0-9]+' | sort -u)
            if [ -n "$PIDS" ]; then
                echo "Killing PIDs: $PIDS"
                for PID in $PIDS; do kill -9 $PID 2>/dev/null || true; done
            fi
            sleep 2

            echo ""
            echo "=== 3. Update service to use 1 worker ==="
            sed -i 's/--workers 2/--workers 1/g' /etc/systemd/system/nuotao-backend-staging.service
            systemctl daemon-reload
            grep "ExecStart" /etc/systemd/system/nuotao-backend-staging.service

            echo ""
            echo "=== 4. Clear pycache again ==="
            find /opt/nuotao/staging/backend/app -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
            find /opt/nuotao/staging/backend -name "*.pyc" -delete 2>/dev/null

            echo ""
            echo "=== 5. Start staging service ==="
            systemctl start nuotao-backend-staging
            sleep 10

            echo ""
            echo "=== 6. Service status ==="
            systemctl status nuotao-backend-staging --no-pager | head -8

            echo ""
            echo "=== 7. Test endpoints ==="
            for path in /api/v1/readyz /api/v1/healthz; do
                RESULT=$(curl -s -w " HTTP %{http_code}" --max-time 5 "http://127.0.0.1:8001$path" || echo " FAILED")
                echo "  $path -> $RESULT"
            done

            echo ""
            echo "=== 8. Openapi paths count ==="
            curl -s --max-time 5 http://127.0.0.1:8001/openapi.json | /opt/nuotao/staging/backend/.venv/bin/python -c "
            import sys, json
            d = json.load(sys.stdin)
            paths = list(d.get('paths', {}).keys())
            print(f'Total paths: {len(paths)}')
            " 2>&1
