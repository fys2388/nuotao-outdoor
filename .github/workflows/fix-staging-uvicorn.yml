name: Fix Staging Uvicorn

on:
  workflow_dispatch:

jobs:
  fix:
    name: Downgrade uvicorn and test staging
    runs-on: ubuntu-latest
    steps:
      - name: Fix staging uvicorn
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Stop staging service and kill all 8001 processes ==="
            systemctl stop nuotao-backend-staging
            sleep 2
            PIDS=$(ss -tlnp | grep ':8001' | grep -oP 'pid=\K[0-9]+' | sort -u)
            if [ -n "$PIDS" ]; then
                for PID in $PIDS; do kill -9 $PID 2>/dev/null || true; done
            fi
            sleep 2
            ss -tlnp | grep ':8001' || echo "Port 8001 is FREE"

            echo ""
            echo "=== 2. Clear pycache ==="
            find /opt/nuotao/staging/backend/app -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
            find /opt/nuotao/staging/backend -name "*.pyc" -delete 2>/dev/null

            echo ""
            echo "=== 3. Current uvicorn version ==="
            cd /opt/nuotao/staging/backend
            .venv/bin/uvicorn --version

            echo ""
            echo "=== 4. Downgrade uvicorn to 0.30.6 ==="
            .venv/bin/pip install 'uvicorn==0.30.6' --quiet 2>&1 | tail -3
            echo "Uvicorn downgraded"

            echo ""
            echo "=== 5. New uvicorn version ==="
            .venv/bin/uvicorn --version

            echo ""
            echo "=== 6. Start uvicorn directly (foreground, 12 seconds) ==="
            cd /opt/nuotao/staging/backend
            timeout 12 .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 1 2>&1 &
            sleep 8

            echo ""
            echo "=== 7. Test endpoints ==="
            curl -s -w " HTTP %{http_code}\n" --max-time 3 http://127.0.0.1:8001/api/v1/readyz
            curl -s --max-time 3 http://127.0.0.1:8001/openapi.json | .venv/bin/python -c "
            import sys, json
            try:
                d = json.load(sys.stdin)
                paths = list(d.get('paths', {}).keys())
                print(f'Paths: {len(paths)}')
                health = [p for p in paths if 'health' in p.lower() or 'ready' in p.lower()]
                print(f'Health: {health}')
            except Exception as e:
                print(f'Error: {e}')
            " 2>&1

            echo ""
            echo "=== 8. Cleanup ==="
            PIDS=$(ss -tlnp | grep ':8001' | grep -oP 'pid=\K[0-9]+' | sort -u)
            if [ -n "$PIDS" ]; then
                for PID in $PIDS; do kill -9 $PID 2>/dev/null || true; done
            fi
            echo "Cleanup done"

            echo ""
            echo "=== 9. Start staging service ==="
            systemctl start nuotao-backend-staging
            sleep 8

            echo ""
            echo "=== 10. Service status ==="
            systemctl status nuotao-backend-staging --no-pager | head -6

            echo ""
            echo "=== 11. Final readyz test ==="
            curl -s -w " HTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8001/api/v1/readyz
            curl -s --max-time 5 http://127.0.0.1:8001/openapi.json | .venv/bin/python -c "
            import sys, json
            try:
                d = json.load(sys.stdin)
                paths = list(d.get('paths', {}).keys())
                print(f'Final paths: {len(paths)}')
            except Exception as e:
                print(f'Error: {e}')
            " 2>&1
