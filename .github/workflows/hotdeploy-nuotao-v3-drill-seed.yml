name: Nuotao V3 Drill Seed Sample Candidate (one-off)

# Makes ONE existing candidate data-complete so the V3 8->3->1-2 loop can be
# exercised end-to-end on production via the real HTTP API. Data-only: no code
# change, no migration, no restart. Roll back with MODE=cleanup (workflow_dispatch
# edit env below, or run the script manually on the server).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "seed | cleanup"
        required: true
        default: "seed"
      target_product_id:
        description: "Product UUID to complete / clean"
        required: true
        default: "3cb1849b-79f6-4dea-9984-83210c50b0dc"
  push:
    branches: [hotfix/product-soft-delete]
    paths:
      - '.github/workflows/hotdeploy-nuotao-v3-drill-seed.yml'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package seed script
        run: |
          tar -czf v3drill.tgz scripts/nuotao_seed_sample_candidate.py
          tar -tzf v3drill.tgz

      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: v3drill.tgz
          target: /tmp

      - name: Run seed/cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 6m
          script: |
            set -eo pipefail
            MODE="${{ github.event.inputs.mode || 'seed' }}"
            TARGET="${{ github.event.inputs.target_product_id || '3cb1849b-79f6-4dea-9984-83210c50b0dc' }}"
            echo "MODE=$MODE TARGET=$TARGET"
            cd /opt/nuotao
            tar -xzf /tmp/v3drill.tgz -C /opt/nuotao
            rm -f /tmp/v3drill.tgz
            cd /opt/nuotao/backend
            .venv/bin/python -m py_compile /opt/nuotao/scripts/nuotao_seed_sample_candidate.py && echo compile-ok
            TARGET_PRODUCT_ID="$TARGET" MODE="$MODE" PYTHONPATH=/opt/nuotao/backend .venv/bin/python /opt/nuotao/scripts/nuotao_seed_sample_candidate.py
            echo "=== backend health ==="
            curl -s -o /dev/null -w 'readyz=%{http_code}\n' http://127.0.0.1:8000/api/v1/readyz
            echo DONE
