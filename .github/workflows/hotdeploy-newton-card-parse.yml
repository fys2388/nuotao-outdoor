name: Hotdeploy Newton Product-Card Parse (one-off)

# Newton search returned products only inside the AI summary as
# ```product-card blocks while structured products stayed empty, so the UI
# had no selectable items. Backend now parses those blocks (with fallback
# score/reason) and normalizes minOrderQuantity/supplierName; frontend card
# shows the main image. Ships:
#   backend/app/services/newton_agent_service.py (restart required)
#   frontend/src/pages/NewtonSourcing.tsx (rebuild)
on:
  workflow_dispatch:
  push:
    branches: [hotfix/product-soft-delete]
    paths:
      - '.github/workflows/hotdeploy-newton-card-parse.yml'

jobs:
  hotdeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package files
        run: |
          tar -czf nscard.tgz \
            backend/app/services/newton_agent_service.py \
            frontend/src/pages/NewtonSourcing.tsx
          tar -tzf nscard.tgz

      - name: Upload package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: nscard.tgz
          target: /tmp

      - name: Apply, restart backend, build frontend, deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            set -eo pipefail
            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            BK=/opt/nuotao/backups/newton-card-$STAMP
            mkdir -p "$BK"
            cd /opt/nuotao
            tar -czf "$BK/before.tgz" \
              backend/app/services/newton_agent_service.py \
              frontend/src/pages/NewtonSourcing.tsx 2>/dev/null || true
            tar -xzf /tmp/nscard.tgz -C /opt/nuotao
            rm -f /tmp/nscard.tgz

            echo "=== backend compile + restart ==="
            cd /opt/nuotao/backend
            .venv/bin/python -m compileall -q app && echo compile-ok
            systemctl restart nuotao-backend
            ready=000
            for i in $(seq 1 25); do
              ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/readyz || true)
              echo "attempt $i readyz=$ready"
              [ "$ready" = "200" ] && break
              sleep 3
            done
            systemctl is-active nuotao-backend
            [ "$ready" = "200" ] || { echo "ERROR backend not ready"; journalctl -u nuotao-backend -n 40 --no-pager || true; exit 1; }

            echo "=== frontend build + deploy ==="
            cd /opt/nuotao/frontend
            npm install --no-audit --no-fund 2>&1 | tail -4
            set +e; npm run build > /tmp/fe-card.log 2>&1; BRC=$?; set -e
            tail -10 /tmp/fe-card.log
            [ "$BRC" -eq 0 ] || { grep -nE "Could not resolve|error TS|Error" /tmp/fe-card.log | head -40; exit 1; }
            rm -rf /var/www/nuotao && mkdir -p /var/www/nuotao
            cp -a dist/. /var/www/nuotao/
            chown -R www-data:www-data /var/www/nuotao

            bcode=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/readyz || true)
            ccode=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            echo "backend=$bcode console=$ccode"
            [ "$bcode" = "200" ] && [ "$ccode" = "200" ] || exit 1
            echo "DONE; backup=$BK"
