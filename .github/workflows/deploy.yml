name: Deploy to Production (staging-gated)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  ci-gate:
    name: Pre-deploy check (syntax + imports + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q app
      - name: App internal import integrity
        run: python scripts/check_app_imports.py
      - name: FastAPI app smoke
        run: python -c "import app.main as m; assert m.app is not None; assert m.settings is not None; print('SMOKE OK')"
      - name: Ruff lint
        run: |
          ruff check app tests --select F821,F811,E9  # critical: undefined name, redefinition, syntax error
          ruff check app tests --exit-zero  # full report (non-blocking)
      - name: Unit tests (SQLite in-memory)
        run: pytest tests/ --ignore=tests/integration -q --no-header -p no:warnings
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit -q
          pip-audit --desc on || true

  stage-validate:
    name: Staging validation (server-side dry-run)
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Stage-validate on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            STAGE=/opt/nuotao/staging
            echo "=== [staging] syncing code to $STAGE ==="
            mkdir -p "$STAGE"

            # Pull latest code from GitHub first (staging must validate new code, not old production)
            cd /opt/nuotao
            git fetch --prune origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            echo "[staging] pulled latest code: $(git log -1 --format='%h %s')"

            cd /opt/nuotao
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude .git --exclude backend/.env --exclude backend/.venv \
                --exclude frontend/node_modules --exclude backend/alembic/versions/*.pyc \
                --exclude '/staging' \
                ./ "$STAGE/"
              echo "[staging] synced via rsync"
            else
              echo "[staging] rsync not available, using tar pipe fallback"
              rm -rf "$STAGE"/*
              tar --exclude='./.git' --exclude='./backend/.env' --exclude='./backend/.venv' \
                  --exclude='./frontend/node_modules' --exclude='./staging' \
                  -cf - . | tar -xf - -C "$STAGE/"
              echo "[staging] synced via tar pipe"
            fi
            if [ ! -f "$STAGE/backend/pyproject.toml" ]; then
              echo "ERROR: staging code sync failed 鈥?pyproject.toml not found"
              exit 1
            fi

            echo "=== [staging] backend syntax check ==="
            cd "$STAGE/backend"
            python3 -m venv .venv
            . "$STAGE/backend/.venv/bin/activate"
            pip install -e . --quiet 2>/dev/null || pip install -r requirements.txt --quiet
            python -m compileall -q app
            echo "[staging] syntax OK"

            echo "=== [staging] migration dry-run (SQL only, not applied) ==="
            if alembic upgrade head --sql > /tmp/nuotao_migration_dryrun.sql 2>/tmp/nuotao_migration_err.txt; then
              LINES=$(wc -l < /tmp/nuotao_migration_dryrun.sql)
              echo "[staging] migration dry-run OK ($LINES lines SQL generated)"
            else
              echo "ERROR: migration dry-run failed:"
              cat /tmp/nuotao_migration_err.txt
              exit 1
            fi

            echo "=== [staging] frontend build validation ==="
            cd "$STAGE/frontend"
            npm install --silent
            npm run build
            echo "[staging] frontend build OK"

            echo "=== [staging] nginx template syntax check ==="
            if [ -f "$STAGE/infra/nginx/console.conf" ]; then
              cp "$STAGE/infra/nginx/console.conf" /tmp/nuotao-console.conf
              nginx -t -c /etc/nginx/nginx.conf 2>&1 | head -3 || true
              echo "[staging] nginx template present and copied"
            else
              echo "WARN: infra/nginx/console.conf 涓嶅瓨鍦紙娌跨敤鐢熶骇鏃㈡湁閰嶇疆锛?
            fi
            echo "=== STAGING VALIDATION PASSED ==="

  deploy-production:
    name: Deploy to Production
    needs: [ci-gate, stage-validate]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deployment info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deploying to: ${{ env.SERVER_HOST }}"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nuotao

            echo "=== 0. Pre-deploy backup (code + db + frontend) ==="
            chmod +x /opt/nuotao/infra/deploy-rollback.sh 2>/dev/null || true
            if [ -f /opt/nuotao/infra/deploy-rollback.sh ]; then
              BACKUP_DIR=$(/opt/nuotao/infra/deploy-rollback.sh backup)
              echo "Backup created: $BACKUP_DIR"
              echo "$BACKUP_DIR" > /tmp/nuotao_last_backup
            else
              echo "WARN: deploy-rollback.sh not found, skipping backup"
            fi

            echo "=== 1. Pulling latest code ==="
            git fetch --prune origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd backend/alembic/versions/ 2>/dev/null || true
            echo "[git] cleaned untracked migration files"

            echo "=== 2. Installing backend dependencies ==="
            cd /opt/nuotao/backend
            source .venv/bin/activate
            pip install -e . --quiet 2>/dev/null || pip install -r requirements.txt --quiet || { echo "ERROR: Python 渚濊禆瀹夎澶辫触锛岃妫€鏌?pip 婧愪笌 requirements.txt"; exit 1; }

            echo "=== 2.5 .env variable drift check ==="
            ENV_FILE=/opt/nuotao/backend/.env
            TEMPLATE=/opt/nuotao/backend/.env.production.template
            if [ -f "$TEMPLATE" ] && [ -f "$ENV_FILE" ]; then
              MISSING=0
              while IFS='=' read -r key _; do
                case "$key" in
                  \#*|'') continue ;;
                esac
                if ! grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                  echo "  [MISSING] $key"
                  MISSING=$((MISSING+1))
                fi
              done < "$TEMPLATE"
              if [ "$MISSING" -gt 0 ]; then
                echo "WARNING: $MISSING variable(s) in template missing from server .env"
                echo "  Fix: ssh to server and add missing vars to /opt/nuotao/backend/.env"
              else
                echo "[env] all template variables present in server .env"
              fi
            else
              echo "[env] template or .env not found, skipping drift check"
            fi

            echo "=== 3. Running database migrations ==="
            if DBURL=$(grep '^DATABASE_URL=' /opt/nuotao/backend/.env 2>/dev/null | sed -E 's#(://[^:]+:)[^@]+@#\1***@#'); then
              echo "[db] 杩炴帴閰嶇疆(瀵嗙爜宸查殣钘?: $DBURL"
            else
              echo "[db] 璀﹀憡: 鏈湪 /opt/nuotao/backend/.env 鎵惧埌 DATABASE_URL"
            fi
            echo "[db] 鎵ц鏁版嵁搴撹縼绉?.."
            if ! alembic upgrade head; then
              echo "ERROR: 鏁版嵁搴撹縼绉诲け璐ワ紝璇风櫥褰曟湇鍔″櫒鎺掓煡:"
              echo "  1) 瀵规瘮涓婇潰 [db] 杩炴帴閰嶇疆 涓?PostgreSQL 瀹為檯瀵嗙爜鏄惁涓€鑷?
              echo "  2) 纭鏁版嵁搴撳凡鍚姩: systemctl status postgresql"
              echo "  3) 瀵嗙爜涓嶇鏃堕噸缃? sudo -u postgres psql -c \"ALTER USER nuotao WITH PASSWORD '<姝ｇ‘瀵嗙爜>';\""
              exit 1
            fi
            echo "[db] ensure all model tables exist (create_all idempotent)..."
            python3 /opt/nuotao/infra/ensure_tables.py 2>&1 || echo "[db] table check skipped (script failed, non-blocking)"
            echo "[db] table check done"

            echo "=== 3.6 Seeding agent config (idempotent) ==="
            # 瑙勮寖 ID 娉ㄥ唽 5 涓?Agent + 宸ュ叿鐧藉悕鍗曪紙handler_name 瀵归綈鐪熷疄娉ㄥ唽鍚嶏級
            # + 鎴愭湰鎶ゆ爮 + 瀹℃壒 SLA銆倁psert 璇箟锛屼笉鎵ц DELETE銆?            # 鍙栦唬 scripts/configure_agent_roles.sql锛坔yphen ID 涓?runtime 鍐茬獊锛屽凡鍒犻櫎锛夈€?            # 璇﹁ docs/agent_team_workflow_refactor.md
            python3 /opt/nuotao/backend/scripts/seed_agent_config.py 2>&1 || echo "[seed] agent config seed failed (non-blocking, check logs)"
            echo "[seed] agent config seed done"

            echo "=== 3.4 Ensure nuotao system user and permissions ==="
            id nuotao >/dev/null 2>&1 || useradd -r -s /bin/false nuotao
            mkdir -p /opt/nuotao/backend/data /opt/nuotao/backend/logs /opt/nuotao/backend/app/data /opt/nuotao/backend/app/logs
            chown -R nuotao:nuotao /opt/nuotao/backend
            echo "[user] nuotao user ready, backend dir owned by nuotao"

            echo "=== 3.5 Installing backend systemd from versioned template ==="
            BACKEND_SERVICE=/etc/systemd/system/nuotao-backend.service
            BACKEND_TEMPLATE=/opt/nuotao/infra/systemd/nuotao-backend.service
            if [ -f "$BACKEND_TEMPLATE" ]; then
              cp "$BACKEND_TEMPLATE" "$BACKEND_SERVICE"
              chmod 644 "$BACKEND_SERVICE"
              echo "[backend] installed versioned template -> $BACKEND_SERVICE"
            elif [ ! -f "$BACKEND_SERVICE" ]; then
              {
                echo '[Unit]'
                echo 'Description=Nuotao AI OS Backend API Server'
                echo 'After=network.target postgresql.service redis.service'
                echo 'Wants=postgresql.service redis.service'
                echo ''
                echo '[Service]'
                echo 'Type=simple'
                echo 'User=nuotao'
                echo 'Group=nuotao'
                echo 'WorkingDirectory=/opt/nuotao/backend'
                echo 'Environment="PATH=/opt/nuotao/backend/.venv/bin"'
                echo 'EnvironmentFile=/opt/nuotao/.env'
                echo 'ExecStart=/opt/nuotao/backend/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 4'
                echo 'Restart=always'
                echo 'RestartSec=5'
                echo 'StandardOutput=journal'
                echo 'StandardError=journal'
                echo ''
                echo '[Install]'
                echo 'WantedBy=multi-user.target'
              } > "$BACKEND_SERVICE"
              echo "[backend] template missing, generated inline fallback"
            else
              echo "[backend] template missing, keeping existing $BACKEND_SERVICE"
              sed -i 's|/opt/nuotao-ai-os/|/opt/nuotao/|g' "$BACKEND_SERVICE"
            fi
            systemctl daemon-reload
            systemctl enable nuotao-backend 2>/dev/null || true

            echo "=== 4. Restarting backend service ==="
            systemctl restart nuotao-backend
            sleep 3
            systemctl status nuotao-backend --no-pager

            echo "=== 5. Building frontend ==="
            cd /opt/nuotao/frontend
            npm install --silent
            npm run build

            echo "=== 6. Deploying frontend ==="
            rm -rf /var/www/nuotao/*
            cp -r dist/* /var/www/nuotao/
            chown -R www-data:www-data /var/www/nuotao

            echo "=== 6.5 Installing nginx from versioned template (infra/nginx/console.conf) ==="
            NGINX_CONF=/etc/nginx/sites-available/nuotao-console
            TEMPLATE=/opt/nuotao/infra/nginx/console.conf
            if [ -f "$TEMPLATE" ]; then
              cp "$TEMPLATE" "$NGINX_CONF"
              echo "[nginx] installed versioned template -> $NGINX_CONF"
            elif [ ! -f "$NGINX_CONF" ]; then
              echo "ERROR: 妯℃澘涓嶅瓨鍦ㄤ笖鏃犳棦鏈夐厤缃紝鏃犳硶瀹夎 nginx 閰嶇疆"
              exit 1
            else
              echo "[nginx] template missing, keeping existing $NGINX_CONF"
            fi
            ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/nuotao-console
            nginx -t && systemctl reload nginx
            echo "[nginx] console :8081 ready"

            echo "=== 6.6 nginx server_name conflict check ==="
            grep -rn "admin.nuotaooutdoor.com" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || echo "(no admin.nuotaooutdoor.com references)"

            echo "=== 6.7 cleaning stale nginx site backups ==="
            CLEANED=0
            for f in /etc/nginx/sites-enabled/nuotao.bak.*; do
              [ -e "$f" ] || continue
              mv "$f" /etc/nginx/sites-available/
              echo "[nginx] moved $f -> sites-available"
              CLEANED=1
            done
            if [ "$CLEANED" = "1" ]; then
              nginx -t && systemctl reload nginx
              echo "[nginx] reloaded after cleanup"
            else
              echo "[nginx] no stale backups, nothing to do"
            fi

            echo "=== 7. Health check ==="
            sleep 5
            BACKEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/readyz || true)
            FRONTEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/ || true)
            echo "Backend API: $BACKEND_CODE"
            echo "Frontend: $FRONTEND_CODE"
            if [ "$BACKEND_CODE" != "200" ]; then
              echo "=== backend diagnostics ==="
              echo "-- is-active:"; systemctl is-active nuotao-backend || true
              echo "-- status:"; systemctl status nuotao-backend --no-pager | head -15 || true
              echo "-- journal:"; journalctl -u nuotao-backend -n 25 --no-pager || true
              echo "-- listeners:"; ss -tlnp 2>/dev/null | grep -E ':8000|:5432' || echo "(none on 8000/5432)"
              echo "-- postgres:"; systemctl status postgresql --no-pager | head -6 || true
              echo "ERROR: 鍚庣鍋ュ悍妫€鏌ュけ璐?(HTTP $BACKEND_CODE)"
              echo "=== AUTO ROLLBACK ==="
              if [ -f /tmp/nuotao_last_backup ] && [ -f /opt/nuotao/infra/deploy-rollback.sh ]; then
                BACKUP_DIR=$(cat /tmp/nuotao_last_backup)
                echo "Rolling back to: $BACKUP_DIR"
                /opt/nuotao/infra/deploy-rollback.sh rollback "$BACKUP_DIR" || echo "ROLLBACK FAILED - manual intervention required"
              else
                echo "No backup found, cannot auto-rollback"
              fi
              exit 1
            fi
            if [ "$FRONTEND_CODE" != "200" ]; then
              echo "ERROR: 鍓嶇鍋ュ悍妫€鏌ュけ璐?(HTTP $FRONTEND_CODE)"
              echo "=== AUTO ROLLBACK ==="
              if [ -f /tmp/nuotao_last_backup ] && [ -f /opt/nuotao/infra/deploy-rollback.sh ]; then
                BACKUP_DIR=$(cat /tmp/nuotao_last_backup)
                /opt/nuotao/infra/deploy-rollback.sh rollback "$BACKUP_DIR" || echo "ROLLBACK FAILED"
              fi
              exit 1
            fi

            echo "=== 7.4 Deploy monitoring configs (prometheus/grafana/alertmanager) ==="
            if [ -d /etc/prometheus ]; then
              cp /opt/nuotao/infra/monitoring/prometheus.yml /etc/prometheus/prometheus.yml 2>/dev/null || true
              cp /opt/nuotao/infra/monitoring/alerts.yml /etc/prometheus/alerts.yml 2>/dev/null || true
              systemctl reload prometheus 2>/dev/null || systemctl restart prometheus 2>/dev/null || echo "[monitoring] prometheus reload skipped"
              echo "[monitoring] prometheus config deployed"
            else
              echo "[monitoring] prometheus not installed, skipping"
            fi
            if [ -d /etc/grafana/provisioning ]; then
              cp -r /opt/nuotao/infra/grafana/provisioning/* /etc/grafana/provisioning/ 2>/dev/null || true
              systemctl restart grafana-server 2>/dev/null || echo "[monitoring] grafana restart skipped"
              echo "[monitoring] grafana provisioning deployed"
            else
              echo "[monitoring] grafana not installed, skipping"
            fi
            if [ -d /etc/alertmanager ] && [ -f /opt/nuotao/infra/monitoring/alertmanager.yml ]; then
              cp /opt/nuotao/infra/monitoring/alertmanager.yml /etc/alertmanager/alertmanager.yml 2>/dev/null || true
              systemctl reload alertmanager 2>/dev/null || systemctl restart alertmanager 2>/dev/null || true
              echo "[monitoring] alertmanager config deployed"
            fi

            echo "=== 7.5 Configuring AI Agent Scheduler ==="
            SCHEDULER_SERVICE=/etc/systemd/system/nuotao-agent-scheduler.service
            SCHEDULER_TEMPLATE=/opt/nuotao/infra/systemd/nuotao-agent-scheduler.service
            if [ -f "$SCHEDULER_TEMPLATE" ]; then
              # 妯℃澘浼樺厛锛氫互浠撳簱鐗堟湰鍖栨ā鏉夸负鍑嗭紙docs/agent_scheduler_deployment.md锛?              cp "$SCHEDULER_TEMPLATE" "$SCHEDULER_SERVICE"
              chmod 644 "$SCHEDULER_SERVICE"
              echo "[scheduler] installed versioned template -> $SCHEDULER_SERVICE"
            elif [ ! -f "$SCHEDULER_SERVICE" ]; then
              # 鍏滃簳锛氭ā鏉跨己澶变笖鏈嶅姟涓嶅瓨鍦ㄦ椂鍐呰仈鐢熸垚
              {
                echo '[Unit]'
                echo 'Description=Nuotao AI Agent Scheduler'
                echo 'After=network.target postgresql.service'
                echo ''
                echo '[Service]'
                echo 'Type=simple'
                echo 'User=nuotao'
                echo 'Group=nuotao'
                echo 'WorkingDirectory=/opt/nuotao/backend'
                echo 'Environment="PATH=/opt/nuotao/backend/.venv/bin:/usr/local/bin:/usr/bin:/bin"'
                echo 'ExecStart=/opt/nuotao/backend/.venv/bin/python -m app.services.agent_scheduler'
                echo 'Restart=always'
                echo 'RestartSec=10'
                echo 'StandardOutput=journal'
                echo 'StandardError=journal'
                echo ''
                echo '[Install]'
                echo 'WantedBy=multi-user.target'
              } > "$SCHEDULER_SERVICE"
              echo "[scheduler] template missing, generated inline fallback"
            else
              echo "[scheduler] template missing, keeping existing $SCHEDULER_SERVICE"
              sed -i 's|^ExecStart=.*|ExecStart=/opt/nuotao/backend/.venv/bin/python -m app.services.agent_scheduler|' "$SCHEDULER_SERVICE"
            fi
            systemctl daemon-reload
            systemctl enable nuotao-agent-scheduler 2>/dev/null || true
            systemctl restart nuotao-agent-scheduler
            sleep 3
            systemctl status nuotao-agent-scheduler --no-pager | head -8 || echo "[scheduler] status check failed"
            echo "[scheduler] AI Agent Scheduler configured and started"

            echo "=== 7.6 Configuring AI Agent Worker ==="
            # 姝ゅ墠鏃犱换浣?systemd 鍗曞厓锛歅OST /api/v1/agent-tasks 鍏ラ槦鍚庢棤浜烘秷璐癸紝
            # 浠诲姟姘镐箙 pending銆侀槦鍒楁寔缁爢绉€傝瑙?docs/agent_team_workflow_refactor.md
            WORKER_SERVICE=/etc/systemd/system/nuotao-agent-worker.service
            WORKER_TEMPLATE=/opt/nuotao/infra/systemd/nuotao-agent-worker.service
            if [ -f "$WORKER_TEMPLATE" ]; then
              cp "$WORKER_TEMPLATE" "$WORKER_SERVICE"
              chmod 644 "$WORKER_SERVICE"
              echo "[worker] installed versioned template -> $WORKER_SERVICE"
            elif [ ! -f "$WORKER_SERVICE" ]; then
              {
                echo '[Unit]'
                echo 'Description=Nuotao AI Agent Worker (Redis Streams consumer)'
                echo 'After=network.target postgresql.service redis.service'
                echo 'Wants=postgresql.service redis.service'
                echo ''
                echo '[Service]'
                echo 'Type=simple'
                echo 'User=nuotao'
                echo 'Group=nuotao'
                echo 'WorkingDirectory=/opt/nuotao/backend'
                echo 'Environment="PATH=/opt/nuotao/backend/.venv/bin:/usr/local/bin:/usr/bin:/bin"'
                echo 'EnvironmentFile=/opt/nuotao/backend/.env'
                echo 'ExecStart=/opt/nuotao/backend/.venv/bin/python -m app.worker'
                echo 'Restart=always'
                echo 'RestartSec=10'
                echo 'StandardOutput=journal'
                echo 'StandardError=journal'
                echo ''
                echo '[Install]'
                echo 'WantedBy=multi-user.target'
              } > "$WORKER_SERVICE"
              echo "[worker] template missing, generated inline fallback"
            else
              echo "[worker] template missing, keeping existing $WORKER_SERVICE"
              sed -i 's|^ExecStart=.*|ExecStart=/opt/nuotao/backend/.venv/bin/python -m app.worker|' "$WORKER_SERVICE"
            fi
            systemctl daemon-reload
            systemctl enable nuotao-agent-worker 2>/dev/null || true
            systemctl restart nuotao-agent-worker
            sleep 3
            if systemctl is-active --quiet nuotao-agent-worker; then
              echo "[worker] nuotao-agent-worker is active"
            else
              echo "[worker] WARNING: nuotao-agent-worker is NOT active; scheduling agent tasks will pile up in Redis"
              journalctl -u nuotao-agent-worker -n 20 --no-pager || true
            fi
            systemctl status nuotao-agent-worker --no-pager | head -8 || echo "[worker] status check failed"
            echo "[worker] AI Agent Worker configured"

            echo "=== 7.7 Single-process check (scheduler + worker) ==="
            echo "[procs] agent_scheduler: $(pgrep -fc 'app.services.agent_scheduler' || echo 0) (鏈熸湜 1)"
            echo "[procs] agent_worker:    $(pgrep -fc 'app.worker' || echo 0) (鏈熸湜 1)"
            redis-cli --raw KEYS 'nuotao:agent-worker:*' 2>/dev/null | head -5 || echo "[redis] not available, skipping worker registry check"

            echo "=== Deployment completed successfully ==="





