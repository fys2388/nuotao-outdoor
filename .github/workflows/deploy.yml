name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  deploy:
    name: Deploy to Hetzner Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deploying to: ${{ env.SERVER_HOST }}"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nuotao

            echo "=== 1. Pulling latest code ==="
            git fetch --prune origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "=== 2. Installing backend dependencies ==="
            cd /opt/nuotao/backend
            source .venv/bin/activate
            pip install -e . --quiet 2>/dev/null || pip install -r requirements.txt --quiet || { echo "ERROR: Python 依赖安装失败，请检查 pip 源与 requirements.txt"; exit 1; }

            echo "=== 3. Running database migrations ==="
            if DBURL=$(grep '^DATABASE_URL=' /opt/nuotao/backend/.env 2>/dev/null | sed -E 's#(://[^:]+:)[^@]+@#\1***@#'); then
              echo "[db] 连接配置(密码已隐藏): $DBURL"
            else
              echo "[db] 警告: 未在 /opt/nuotao/backend/.env 找到 DATABASE_URL"
            fi
            if ! alembic upgrade head; then
              echo "ERROR: 数据库迁移失败，请登录服务器排查:"
              echo "  1) 对比上面 [db] 连接配置 与 PostgreSQL 实际密码是否一致"
              echo "  2) 确认数据库已启动: systemctl status postgresql"
              echo "  3) 密码不符时重置: sudo -u postgres psql -c \"ALTER USER nuotao WITH PASSWORD '<正确密码>';\""
              exit 1
            fi

            echo "=== 4. Restarting backend service ==="
            systemctl restart nuotao-backend
            sleep 3
            systemctl status nuotao-backend --no-pager

            echo "=== 5. Building frontend ==="
            cd /opt/nuotao/frontend
            npm install --silent
            npm run build

            echo "=== 6. Deploying frontend ==="
            rm -rf /var/www/nuotao/*
            cp -r dist/* /var/www/nuotao/
            chown -R www-data:www-data /var/www/nuotao

            echo "=== 7. Health check ==="
            sleep 5
            BACKEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/docs)
            FRONTEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/)
            echo "Backend API: $BACKEND_CODE"
            echo "Frontend: $FRONTEND_CODE"
            [ "$BACKEND_CODE" = "200" ] || { echo "ERROR: 后端健康检查失败 (HTTP $BACKEND_CODE)"; exit 1; }
            [ "$FRONTEND_CODE" = "200" ] || { echo "ERROR: 前端健康检查失败 (HTTP $FRONTEND_CODE)"; exit 1; }

            echo "=== Deployment completed successfully ==="
