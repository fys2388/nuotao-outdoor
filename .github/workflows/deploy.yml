              echo "[hotfix] === proc/port/journal end ==="
            else
              echo "[hotfix] FATAL: could not recover DATABASE_URL anywhere"
            fi

  deploy-production:
    name: Deploy to Production
    needs: [ci-gate, stage-validate]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deployment info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deploying to: ${{ env.SERVER_HOST }}"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nuotao-ai-os

            # Pull latest code first (the deploy script itself is part of the repo)
            git fetch --prune origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Make deploy script executable and run it
            chmod +x infra/deploy-production.sh
            bash infra/deploy-production.sh