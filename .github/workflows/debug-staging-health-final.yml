name: Debug Staging Health Final

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug staging health final check
    runs-on: ubuntu-latest
    steps:
      - name: Debug staging health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/nuotao/staging/backend

            echo "=== 1. router.py health lines ==="
            grep -n "health" app/api/v1/router.py

            echo ""
            echo "=== 2. main.py include_router line ==="
            grep -n "include_router\|api_prefix" app/main.py

            echo ""
            echo "=== 3. settings.api_prefix ==="
            cat > /tmp/check_prefix.py << 'PYEOF'
            import sys
            sys.path.insert(0, '/opt/nuotao/staging/backend')
            from app.core.config import get_settings
            s = get_settings()
            print(f'api_prefix: {repr(s.api_prefix)}')
            print(f'is_production: {s.is_production}')
            print(f'environment: {s.environment}')
            PYEOF
            .venv/bin/python /tmp/check_prefix.py 2>&1

            echo ""
            echo "=== 4. Actual running app routes (via openapi) ==="
            curl -s --max-time 5 http://127.0.0.1:8001/openapi.json | .venv/bin/python -c "
            import sys, json
            d = json.load(sys.stdin)
            paths = list(d.get('paths', {}).keys())
            print(f'Total openapi paths: {len(paths)}')
            health = [p for p in paths if 'health' in p.lower() or 'ready' in p.lower()]
            print(f'Health paths in openapi: {health}')
            # Show first 5 and last 5 paths
            print('First 5 paths:')
            for p in paths[:5]: print(f'  {p}')
            print('Last 5 paths:')
            for p in paths[-5:]: print(f'  {p}')
            " 2>&1

            echo ""
            echo "=== 5. Compare with production ==="
            echo "Production readyz:"
            curl -s -w " HTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8000/api/v1/readyz
            echo "Staging readyz:"
            curl -s -w " HTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8001/api/v1/readyz

            echo ""
            echo "=== 6. Production main.py include_router line ==="
            grep -n "include_router\|api_prefix" /opt/nuotao/backend/app/main.py
