name: Fix Nginx 404

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix 404 error
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. 检查完整的 ops-dashboard 配置 ==="
            grep -n "ops-dashboard" /etc/nginx/sites-available/nuotao
            
            echo ""
            echo "=== 2. 检查文件是否存在 ==="
            ls -la /opt/nuotao/ops-dashboard/
            file /opt/nuotao/ops-dashboard/index.html
            
            echo ""
            echo "=== 3. 检查文件权限 ==="
            namei -l /opt/nuotao/ops-dashboard/index.html
            
            echo ""
            echo "=== 4. 用 Python 重写配置，确保只有一个 ops-dashboard location ==="
            python3 << 'PYEOF'
            conf_path = "/etc/nginx/sites-available/nuotao"
            with open(conf_path, 'r') as f:
                lines = f.readlines()
            
            # 找到所有 ops-dashboard 相关的行
            ops_lines = []
            for i, line in enumerate(lines):
                if 'ops-dashboard' in line:
                    ops_lines.append((i, line.rstrip()))
            
            print(f"找到 {len(ops_lines)} 行包含 ops-dashboard:")
            for i, line in ops_lines:
                print(f"  行 {i+1}: {line}")
            
            # 简单方案：在第一个 server 块的开头插入正确的配置
            # 先找到 server { 的位置
            server_start = None
            for i, line in enumerate(lines):
                if 'server {' in line or line.strip().startswith('server {'):
                    server_start = i
                    break
            
            if server_start is not None:
                print(f"\n在行 {server_start+1} 找到 server {{")
                
                # 新的配置块
                new_config = '''
    # ============================================
    # Ops Dashboard 静态文件（优先匹配）
    # ============================================
    location ^~ /ops-dashboard/ {
        alias /opt/nuotao/ops-dashboard/;
        index index.html;
        try_files $uri $uri/ /ops-dashboard/index.html;
    }

'''
                # 在 server { 之后插入
                lines.insert(server_start + 1, new_config)
                
                with open(conf_path, 'w') as f:
                    f.writelines(lines)
                
                print("✅ 已在 server 块开头插入 ops-dashboard 配置")
            else:
                print("❌ 未找到 server {")
            PYEOF
            
            echo ""
            echo "=== 5. 测试 Nginx 配置 ==="
            nginx -t
            
            echo ""
            echo "=== 6. 重载 Nginx ==="
            systemctl reload nginx
            
            echo ""
            echo "=== 7. 测试访问（带斜杠）==="
            sleep 2
            curl -s -o /tmp/test1.html -w "HTTP: %{http_code}, Size: %{size_download}\n" http://localhost:80/ops-dashboard/
            head -3 /tmp/test1.html
            echo "..."
            grep -c "运营监控中心" /tmp/test1.html && echo "✅ 成功: 返回 ops-dashboard 页面" || echo "❌ 失败: 返回错误页面"
            
            echo ""
            echo "=== 8. 测试访问（不带斜杠）==="
            curl -s -o /tmp/test2.html -w "HTTP: %{http_code}, Size: %{size_download}\n" -L http://localhost:80/ops-dashboard
            grep -c "运营监控中心" /tmp/test2.html && echo "✅ 成功" || echo "❌ 失败"
