name: Debug Nginx Config

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Output Nginx config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "=== Nginx 配置文件完整内容 ==="
            cat /etc/nginx/sites-available/nuotao
            echo ""
            echo "=== Nginx 配置文件行数 ==="
            wc -l /etc/nginx/sites-available/nuotao
            echo ""
            echo "=== 所有 server 块的位置 ==="
            grep -n "server {" /etc/nginx/sites-available/nuotao
            echo ""
            echo "=== 所有 server_name ==="
            grep -n "server_name" /etc/nginx/sites-available/nuotao
            echo ""
            echo "=== 所有 listen ==="
            grep -n "listen" /etc/nginx/sites-available/nuotao
