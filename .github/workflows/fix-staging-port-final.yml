name: Fix Staging Port Final

on:
  workflow_dispatch:

jobs:
  fix:
    name: Fix staging port and restart
    runs-on: ubuntu-latest
    steps:
      - name: Fix staging port
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Stop staging service ==="
            systemctl stop nuotao-backend-staging
            sleep 2

            echo ""
            echo "=== 2. Kill all processes on port 8001 ==="
            PIDS=$(ss -tlnp | grep ':8001' | grep -oP 'pid=\K[0-9]+' | sort -u)
            if [ -n "$PIDS" ]; then
                echo "Killing PIDs: $PIDS"
                for PID in $PIDS; do
                    kill -9 $PID 2>/dev/null || true
                done
                sleep 2
            else
                echo "No processes on port 8001"
            fi

            echo ""
            echo "=== 3. Verify port 8001 is free ==="
            ss -tlnp | grep ':8001' || echo "Port 8001 is free"

            echo ""
            echo "=== 4. Start staging service ==="
            systemctl start nuotao-backend-staging
            sleep 8

            echo ""
            echo "=== 5. Service status ==="
            systemctl status nuotao-backend-staging --no-pager | head -10

            echo ""
            echo "=== 6. Test endpoints ==="
            for path in /api/v1/readyz /api/v1/healthz /docs; do
                RESULT=$(curl -s -w " HTTP %{http_code}" --max-time 5 "http://127.0.0.1:8001$path" || echo " FAILED")
                echo "  $path -> $RESULT"
            done

            echo ""
            echo "=== 7. Readyz full response ==="
            curl -s --max-time 5 http://127.0.0.1:8001/api/v1/readyz
            echo ""
