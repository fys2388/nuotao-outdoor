name: Debug Staging Routes

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug staging routes and logs
    runs-on: ubuntu-latest
    steps:
      - name: Debug staging routes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Staging service status ==="
            systemctl status nuotao-backend-staging --no-pager | head -8

            echo ""
            echo "=== 2. Staging service logs (last 40) ==="
            journalctl -u nuotao-backend-staging --no-pager -n 40

            echo ""
            echo "=== 3. Test various endpoints ==="
            for path in /api/v1/readyz /api/v1/healthz /healthz /readyz /docs /openapi.json /api/v1/docs; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "http://127.0.0.1:8001$path" || echo "000")
                echo "  $path -> HTTP $CODE"
            done

            echo ""
            echo "=== 4. Check API prefix setting ==="
            grep -i 'api_prefix\|API_PREFIX' /opt/nuotao/staging/backend/.env || echo "(not set in .env)"

            echo ""
            echo "=== 5. Check if health module imports correctly ==="
            cd /opt/nuotao/staging/backend
            .venv/bin/python -c "from app.api.v1.endpoints.health import router; print('health router OK, routes:', [r.path for r in router.routes])" 2>&1

            echo ""
            echo "=== 6. Check api_router includes health ==="
            .venv/bin/python -c "from app.api.v1.router import api_router; routes = [r.path for r in api_router.routes]; print('health routes:', [r for r in routes if 'health' in r or 'ready' in r])" 2>&1
