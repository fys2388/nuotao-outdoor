name: Enable UFW Firewall

on:
  workflow_dispatch:

jobs:
  ufw:
    name: Enable ufw - deny incoming, allow 22/80/443
    runs-on: ubuntu-latest
    steps:
      - name: Enable ufw safely
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            echo "### 1. current public listening ports (0.0.0.0) ###"
            ss -tlnp 2>/dev/null | grep -E '0\.0\.0\.0:|\[::\]' | grep -vE '127\.0\.0\.1' | head -20 || echo "(none)"
            echo ""
            echo "### 2. ufw current status ###"
            ufw status verbose 2>&1 | head -10
            echo ""
            echo "### 3. backup current rules ###"
            TS=$(date +%Y%m%dT%H%M%SZ)
            ufw status numbered > /root/ufw_rules_backup_$TS.txt 2>&1
            echo "backup: /root/ufw_rules_backup_$TS.txt"
            echo ""
            echo "### 4. allow 22/80/443 (BEFORE enable, prevents SSH lockout) ###"
            ufw allow 22/tcp 2>&1
            ufw allow 80/tcp 2>&1
            ufw allow 443/tcp 2>&1
            echo ""
            echo "### 5. default deny incoming + enable (non-interactive) ###"
            ufw default deny incoming 2>&1
            ufw --force enable 2>&1
            echo ""
            echo "### 6. ufw status after enable ###"
            sleep 3
            ufw status verbose 2>&1 | head -25
            echo ""
            echo "### 7. verify container-internal comm (docker network unaffected?) ###"
            sleep 5
            docker exec nuotao-ai-os-scheduler-1 sh -c 'redis-cli -u "$REDIS_URL" ping 2>&1' 2>/dev/null || docker exec nuotao-ai-os-redis-1 redis-cli ping 2>&1 | tail -1
            echo "--- scheduler->postgres ---"
            docker exec nuotao-ai-os-scheduler-1 sh -c 'echo $DATABASE_URL' 2>/dev/null | sed -E 's#(://[^:/]+:)[^@]*@#\1***@#' || echo "(no)"
            echo ""
            echo "### 8. verify site & backend still reachable ###"
            systemctl is-active nuotao-backend nuotao-agent-worker nuotao-agent-scheduler 2>&1
            curl -sk -o /dev/null -w 'admin=%{http_code}\n' https://admin.nuotaooutdoor.com/ 2>&1 || echo "admin failed"
            curl -sk -o /dev/null -w 'b2b=%{http_code}\n' https://b2b.nuotaooutdoor.com/ 2>&1 || echo "b2b failed"
            echo ""
            echo "### 9. backend still connected to redis (127.0.0.1 loopback) ###"
            ss -tnp 2>/dev/null | grep 6379 | grep -E '127\.0\.0\.1' | head -5 || echo "(no loopback 6379 conn - check)"