name: Debug Staging Api Router

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug staging api_router
    runs-on: ubuntu-latest
    steps:
      - name: Debug api_router
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/nuotao/staging/backend

            cat > /tmp/debug_api_router.py << 'PYEOF'
            import sys
            sys.path.insert(0, '.')

            # Check settings
            from app.core.config import get_settings
            settings = get_settings()
            print(f'api_prefix: {repr(settings.api_prefix)}')
            print(f'app_name: {settings.app_name}')
            print(f'is_production: {settings.is_production}')

            # Check api_router
            from app.api.v1.router import api_router
            print(f'api_router type: {type(api_router)}')
            print(f'api_router routes count: {len(api_router.routes)}')

            # Try to get routes from api_router (may be nested)
            def count_routes(router, prefix=""):
                count = 0
                for route in router.routes:
                    if hasattr(route, 'path'):
                        count += 1
                        if count <= 10:
                            print(f'  {prefix}{route.path}')
                    if hasattr(route, 'routes'):
                        count += count_routes(route, prefix + "  ")
                return count

            print('First 10 api_router routes:')
            total = count_routes(api_router)
            print(f'Total api_router routes (including nested): {total}')

            # Check if include_router works
            from fastapi import FastAPI
            test_app = FastAPI()
            test_app.include_router(api_router, prefix=settings.api_prefix)
            print(f'Test app routes after include: {len(test_app.routes)}')
            for r in test_app.routes[:5]:
                if hasattr(r, 'path'):
                    print(f'  {r.path}')
            PYEOF

            echo "=== Running debug ==="
            .venv/bin/python /tmp/debug_api_router.py 2>&1
