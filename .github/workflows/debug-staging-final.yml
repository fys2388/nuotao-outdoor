name: Debug Staging Final

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug staging final check
    runs-on: ubuntu-latest
    steps:
      - name: Debug staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Staging service status ==="
            systemctl status nuotao-backend-staging --no-pager | head -12

            echo ""
            echo "=== 2. Staging logs (last 30) ==="
            journalctl -u nuotao-backend-staging --no-pager -n 30

            echo ""
            echo "=== 3. Check port 8001 ==="
            ss -tlnp | grep ':8001' || echo "Port 8001 not listening"

            echo ""
            echo "=== 4. Test endpoints ==="
            for path in /api/v1/readyz /api/v1/healthz /docs /openapi.json; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:8001$path" || echo "000")
                echo "  $path -> HTTP $CODE"
            done

            echo ""
            echo "=== 5. Try restart ==="
            systemctl restart nuotao-backend-staging
            sleep 8
            systemctl status nuotao-backend-staging --no-pager | head -8

            echo ""
            echo "=== 6. Test after restart ==="
            for path in /api/v1/readyz /api/v1/healthz; do
                RESULT=$(curl -s -w " HTTP %{http_code}" --max-time 5 "http://127.0.0.1:8001$path" || echo " FAILED")
                echo "  $path -> $RESULT"
            done
