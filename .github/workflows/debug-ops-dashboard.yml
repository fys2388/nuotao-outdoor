name: Debug Ops Dashboard

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and verify ops-dashboard
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. 备份配置 ==="
            cp /etc/nginx/sites-available/nuotao /etc/nginx/sites-available/nuotao.bak3
            
            echo "=== 2. 检查文件 ==="
            ls -la /opt/nuotao/ops-dashboard/
            wc -c /opt/nuotao/ops-dashboard/index.html
            
            echo "=== 3. 用 Python 重写配置 ==="
            python3 << 'PYEOF'
            import re
            conf_path = "/etc/nginx/sites-available/nuotao"
            with open(conf_path, 'r') as f:
                content = f.read()
            
            # 删除所有现有的 ops-dashboard 相关块
            # 匹配注释 + location 块
            pattern = r'\n?\s*#.*[Oo]ps.*[Dd]ashboard.*?\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}'
            content = re.sub(pattern, '', content, flags=re.DOTALL)
            
            # 也删除单独的 location 块
            pattern2 = r'\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}'
            content = re.sub(pattern2, '', content, flags=re.DOTALL)
            
            # 新配置
            new_config = '''
    # Ops Dashboard 静态文件
    location ^~ /ops-dashboard/ {
        alias /opt/nuotao/ops-dashboard/;
        index index.html;
        try_files $uri $uri/ /ops-dashboard/index.html;
    }
'''
            
            # 在第一个 server { 后插入
            server_match = re.search(r'server\s*\{', content)
            if server_match:
                insert_pos = server_match.end()
                # 找到后面的第一个换行
                newline_pos = content.find('\n', insert_pos)
                if newline_pos != -1:
                    insert_pos = newline_pos + 1
                content = content[:insert_pos] + new_config + content[insert_pos:]
                print("✅ 已插入配置")
            else:
                print("❌ 未找到 server {")
            
            with open(conf_path, 'w') as f:
                f.write(content)
            PYEOF
            
            echo ""
            echo "=== 4. 验证配置 ==="
            grep -n -A 6 "ops-dashboard" /etc/nginx/sites-available/nuotao | head -20
            
            echo ""
            echo "=== 5. 测试并重载 Nginx ==="
            nginx -t && systemctl reload nginx
            
            echo ""
            echo "=== 6. 测试访问 ==="
            sleep 3
            curl -s -o /tmp/test.html -w "HTTP: %{http_code}, Size: %{size_download}\n" http://localhost:80/ops-dashboard/
            echo "前3行:"
            head -3 /tmp/test.html
            if grep -q "运营监控中心" /tmp/test.html; then
                echo "✅✅✅ 成功! 返回 ops-dashboard 页面"
            else
                echo "❌ 失败"
                cat /tmp/test.html
            fi
