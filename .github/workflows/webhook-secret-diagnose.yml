name: Webhook Secret Deep Diagnosis

on:
  workflow_dispatch:

jobs:
  diag:
    name: Diagnose webhook secret variable (length only)
    runs-on: ubuntu-latest
    steps:
      - name: Find actual webhook secret variable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/nuotao-ai-os
            echo "=== 1. .env lines containing SECRET (names only) ==="
            grep -iE "secret" backend/.env | sed 's/=.*/=<redacted>/' 2>/dev/null
            echo ""
            echo "=== 2. config.py webhook_secret definition ==="
            grep -n -A2 "webhook_secret" backend/app/core/config.py | head -30
            echo ""
            echo "=== 3. all secret-like env vars: name + length (NO plaintext) ==="
            /opt/nuotao-ai-os/backend/.venv/bin/python -c "
            import os
            from dotenv import load_dotenv
            load_dotenv('backend/.env')
            for k,v in os.environ.items():
                if 'SECRET' in k.upper() or 'WEBHOOK' in k.upper():
                    print(f'{k}: len={len(v) if v else 0} empty={not v}')
            "
            echo ""
            echo "=== 4. is fail-closed triggering? check runtime webhook_secret value ==="
            /opt/nuotao-ai-os/backend/.venv/bin/python -c "
            import sys; sys.path.insert(0, '/opt/nuotao-ai-os/backend')
            from app.core.config import settings
            ws = getattr(settings, 'webhook_secret', None)
            insecure = getattr(settings, 'webhook_secret_is_insecure', None)
            print(f'webhook_secret_len={len(ws) if ws else 0}')
            print(f'webhook_secret_empty={not ws}')
            print(f'webhook_secret_is_insecure={insecure}')
            "
