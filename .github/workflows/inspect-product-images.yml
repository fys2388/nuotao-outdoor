name: Inspect B2B Showcase Product Image Sources (temporary)

# Read-only inspection: dump every key under products.meta / products.attributes
# that could hold an image URL for the enabled B2B showcase products, plus
# source / source_url / sku, so we can point the portal at real imagery
# (WooCommerce-synced / 1688) instead of placeholders.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect image sources
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            source .venv/bin/activate
            cat > /tmp/inspect_images.py << 'PYEOF'
            import asyncio, json
            from sqlalchemy import text
            from sqlalchemy.ext.asyncio import create_async_engine
            from app.core.config import get_settings

            def img_keys(obj):
                if not isinstance(obj, dict):
                    return {}
                out = {}
                for k, v in obj.items():
                    if "image" in k.lower() or "img" in k.lower() or "photo" in k.lower():
                        if isinstance(v, str):
                            out[k] = v[:90]
                        elif isinstance(v, list):
                            out[k] = [str(x)[:60] for x in v[:3]]
                        else:
                            out[k] = type(v).__name__
                return out

            async def main():
                engine = create_async_engine(get_settings().database_url)
                try:
                    async with engine.connect() as conn:
                        rows = (await conn.execute(
                            text("SELECT id, name, sku, source, source_url, meta, attributes FROM products WHERE b2b_showcase_enabled = true AND deleted_at IS NULL ORDER BY created_at")
                        )).fetchall()
                        print("products:", len(rows))
                        for r in rows:
                            pid, name, sku, source, src_url, meta, attrs = r
                            print("=" * 70)
                            print(f"name={name[:36]!r} sku={sku[:20]!r} source={source!r}")
                            print(f"  source_url={str(src_url)[:70]!r}")
                            print(f"  meta image keys: {json.dumps(img_keys(meta), ensure_ascii=False)}")
                            print(f"  attrs image keys: {json.dumps(img_keys(attrs), ensure_ascii=False)}")
                finally:
                    await engine.dispose()

            asyncio.run(main())
            PYEOF
            python3 /tmp/inspect_images.py 2>&1 | tail -80
            rm -f /tmp/inspect_images.py
