name: Fix Ops Dashboard Nginx (all locations)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Nginx config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            NGINX_CONF="/etc/nginx/sites-available/nuotao"
            
            echo "=== 1. 备份配置 ==="
            cp "$NGINX_CONF" "${NGINX_CONF}.bak.$(date +%Y%m%d%H%M%S)"
            
            echo "=== 2. 删除所有旧的 ops-dashboard 配置 ==="
            python3 << 'PYEOF'
            import re
            with open("/etc/nginx/sites-available/nuotao", "r") as f:
                content = f.read()
            
            # 删除所有 ops-dashboard 相关的注释和 location 块
            pattern = r'\n?\s*#\s*=+\s*\n\s*#\s*Ops Dashboard.*?\n\s*#\s*=+\s*\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}'
            content = re.sub(pattern, '', content, flags=re.DOTALL)
            
            # 也删除单独的 location 块
            pattern2 = r'\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}'
            content = re.sub(pattern2, '', content, flags=re.DOTALL)
            
            with open("/etc/nginx/sites-available/nuotao", "w") as f:
                f.write(content)
            print("✅ 已删除所有旧的 ops-dashboard 配置")
            PYEOF
            
            echo "=== 3. 在所有 location / 之前插入 ops-dashboard 配置 ==="
            # 使用 Python 在每个 location / { 之前插入
            python3 << 'PYEOF'
            with open("/etc/nginx/sites-available/nuotao", "r") as f:
                content = f.read()
            
            new_config = '''
    # ============================================
    # Ops Dashboard 静态文件（优先匹配）
    # ============================================
    location ^~ /ops-dashboard/ {
        alias /opt/nuotao/ops-dashboard/;
        index index.html;
        try_files $uri $uri/ /ops-dashboard/index.html;
    }
'''
            
            # 在每个 "location / {" 之前插入
            count = content.count("location / {")
            content = content.replace("location / {", new_config + "    location / {")
            print(f"✅ 已在 {count} 个 location / 之前插入 ops-dashboard 配置")
            
            with open("/etc/nginx/sites-available/nuotao", "w") as f:
                f.write(content)
            PYEOF
            
            echo "=== 4. 验证配置 ==="
            grep -c "ops-dashboard" "$NGINX_CONF"
            grep -n "location \^~ /ops-dashboard/" "$NGINX_CONF"
            
            echo "=== 5. 测试 Nginx ==="
            nginx -t
            
            echo "=== 6. 重载 Nginx ==="
            systemctl reload nginx
            
            echo "=== 7. 测试访问 ==="
            sleep 3
            curl -s -o /tmp/test_dash.html -w "HTTP: %{http_code}, Size: %{size_download}\n" http://localhost:80/ops-dashboard/
            if grep -q "运营监控中心" /tmp/test_dash.html; then
                echo "✅✅✅ 成功! 返回 ops-dashboard 页面!"
            else
                echo "❌ 失败: 返回的不是 ops-dashboard 页面"
                head -5 /tmp/test_dash.html
            fi
            
            echo "=== 完成 ==="
