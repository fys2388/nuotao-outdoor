name: Verify Prod Readyz

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify production readyz endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Verify readyz
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== Production readyz ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8000/api/v1/readyz 2>&1

            echo ""
            echo "=== Production healthz ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8000/api/v1/healthz 2>&1

            echo ""
            echo "=== Production /healthz (root) ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8000/healthz 2>&1

            echo ""
            echo "=== Production openapi.json paths (first 20) ==="
            curl -s --max-time 5 http://127.0.0.1:8000/openapi.json | .venv/bin/python -c "import sys,json; d=json.load(sys.stdin); paths=list(d.get('paths',{}).keys()); print(f'Total paths: {len(paths)}'); [print(f'  {p}') for p in paths[:20]]" 2>&1 || echo "(failed to parse)"

            echo ""
            echo "=== Staging readyz ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8001/api/v1/readyz 2>&1
