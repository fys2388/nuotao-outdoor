name: Hotdeploy ProductPipeline Crash Fix (one-off)

# /products/pipeline crashed at runtime with "useEffect is not defined":
# the committed file only imported useState while calling useEffect, and
# also used Switch + the legacy Steps <Step> children API. The fixed working
# copy (useEffect+Switch import, Steps items API) was never committed, so the
# production bundle stayed broken. Pure frontend rebuild, no backend restart.
on:
  workflow_dispatch:
  push:
    branches: [hotfix/product-soft-delete]
    paths:
      - '.github/workflows/hotdeploy-product-pipeline-fix.yml'

jobs:
  hotdeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package files
        run: |
          tar -czf ppfix.tgz frontend/src/pages/ProductPipeline.tsx
          tar -tzf ppfix.tgz

      - name: Upload package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: ppfix.tgz
          target: /tmp

      - name: Apply, build frontend, deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -eo pipefail
            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            BK=/opt/nuotao/backups/pipeline-fix-$STAMP
            mkdir -p "$BK"
            cd /opt/nuotao
            tar -czf "$BK/before.tgz" frontend/src/pages/ProductPipeline.tsx 2>/dev/null || true
            tar -xzf /tmp/ppfix.tgz -C /opt/nuotao
            rm -f /tmp/ppfix.tgz

            echo "=== frontend build + deploy ==="
            cd /opt/nuotao/frontend
            npm install --no-audit --no-fund 2>&1 | tail -4
            set +e; npm run build > /tmp/fe-pp.log 2>&1; BRC=$?; set -e
            tail -10 /tmp/fe-pp.log
            [ "$BRC" -eq 0 ] || { grep -nE "Could not resolve|error TS|Error" /tmp/fe-pp.log | head -40; exit 1; }
            rm -rf /var/www/nuotao && mkdir -p /var/www/nuotao
            cp -a dist/. /var/www/nuotao/
            chown -R www-data:www-data /var/www/nuotao

            ccode=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            echo "console=$ccode"
            [ "$ccode" = "200" ] || exit 1
            echo "DONE; backup=$BK"
