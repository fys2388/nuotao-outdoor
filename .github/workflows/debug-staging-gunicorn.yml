name: Debug Staging Gunicorn

on:
  workflow_dispatch:

jobs:
  debug:
    name: Test staging with gunicorn instead of uvicorn
    runs-on: ubuntu-latest
    steps:
      - name: Debug staging gunicorn
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Stop staging service and kill all 8001 processes ==="
            systemctl stop nuotao-backend-staging
            sleep 2
            PIDS=$(ss -tlnp | grep ':8001' | grep -oP 'pid=\K[0-9]+' | sort -u)
            if [ -n "$PIDS" ]; then
                for PID in $PIDS; do kill -9 $PID 2>/dev/null || true; done
            fi
            sleep 2
            ss -tlnp | grep ':8001' || echo "Port 8001 is FREE"

            echo ""
            echo "=== 2. Clear pycache ==="
            find /opt/nuotao/staging/backend/app -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
            find /opt/nuotao/staging/backend -name "*.pyc" -delete 2>/dev/null

            echo ""
            echo "=== 3. Install gunicorn ==="
            cd /opt/nuotao/staging/backend
            .venv/bin/pip install gunicorn --quiet 2>&1 | tail -3
            echo "Gunicorn installed"

            echo ""
            echo "=== 4. Start gunicorn (foreground, 12 seconds) ==="
            cd /opt/nuotao/staging/backend
            timeout 12 .venv/bin/gunicorn app.main:app --bind 127.0.0.1:8001 --workers 1 --worker-class uvicorn.workers.UvicornWorker 2>&1 &
            sleep 8

            echo ""
            echo "=== 5. Test endpoints with gunicorn ==="
            curl -s -w " HTTP %{http_code}\n" --max-time 3 http://127.0.0.1:8001/api/v1/readyz
            curl -s --max-time 3 http://127.0.0.1:8001/openapi.json | .venv/bin/python -c "
            import sys, json
            try:
                d = json.load(sys.stdin)
                paths = list(d.get('paths', {}).keys())
                print(f'Gunicorn paths: {len(paths)}')
                health = [p for p in paths if 'health' in p.lower() or 'ready' in p.lower()]
                print(f'Health paths: {health}')
            except Exception as e:
                print(f'Error: {e}')
            " 2>&1

            echo ""
            echo "=== 6. Check gunicorn process ==="
            ps aux | grep gunicorn | grep -v grep

            echo ""
            echo "=== 7. Cleanup ==="
            PIDS=$(ss -tlnp | grep ':8001' | grep -oP 'pid=\K[0-9]+' | sort -u)
            if [ -n "$PIDS" ]; then
                for PID in $PIDS; do kill -9 $PID 2>/dev/null || true; done
            fi
            echo "Cleanup done"

            echo ""
            echo "=== 8. Compare: direct import routes ==="
            cd /opt/nuotao/staging/backend
            .venv/bin/python -c "
            import sys
            sys.path.insert(0, '.')
            from app.main import app
            routes = [r.path for r in app.routes if hasattr(r, 'path')]
            print(f'Direct import routes: {len(routes)}')
            " 2>&1 | tail -3
