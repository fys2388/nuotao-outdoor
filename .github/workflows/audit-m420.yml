name: M420 B2B Audit (read-only)

# M420-01: 只读前置审计。绝不读取、复制或打印任何真实凭证。
# 只输出：服务名、EnvironmentFile 路径、变量名、长度/是否占位符；数据库结构；映射现状。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-m420.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run read-only audit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            source .venv/bin/activate
            cat > /tmp/m420_audit.py << 'PYEOF'
            import asyncio, json, os, re, subprocess
            from sqlalchemy import text
            from sqlalchemy.ext.asyncio import create_async_engine
            from app.core.config import get_settings

            OUT = "/opt/nuotao-ai-os/backend/_m420_audit.txt"

            def sh(cmd):
                try:
                    r = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=60)
                    return (r.stdout or "") + (r.stderr or "")
                except Exception as e:
                    return "ERR: " + str(e)

            lines = []
            def w(s=""):
                lines.append(s)

            w("=" * 70)
            w("M420-01 只读审计报告")
            w("注意：本报告不含任何凭证值；凭证仅以“存在/长度/是否占位符”形式呈现。")
            w("=" * 70)

            # ---------- 1. 配置占位符检测 ----------
            w("\n[1] settings 读取到的 WC 配置形态（不打印值）")
            s = get_settings()
            for attr in ("woocommerce_base_url", "woocommerce_consumer_key", "woocommerce_consumer_secret"):
                v = getattr(s, attr, None)
                if v is None:
                    w(f"  {attr}: <None>")
                else:
                    v = str(v)
                    placeholder = bool(re.search(r'[\$\\{]', v))
                    w(f"  {attr}: len={len(v)} placeholder={placeholder} starts={v[:1]!r}")

            # ---------- 2. systemd ----------
            w("\n[2] systemd 服务发现")
            for pat in ("nuotao", "backend", "uvicorn", "api"):
                out = sh(f"systemctl list-units --type=service --no-pager --no-legend | grep -i {pat} | awk '{{print $1}}' | head -10")
                for ln in out.strip().splitlines():
                    if ln.strip():
                        w(f"  [{pat}] {ln.strip()}")
            w("\n  单元文件（名称；不读取内容中的值）：")
            for pat in ("nuotao",):
                out = sh(f"ls /etc/systemd/system/*{pat}* /usr/lib/systemd/system/*{pat}* 2>/dev/null")
                for ln in out.strip().splitlines():
                    if ln.strip():
                        w(f"    {ln.strip()}")

            # ---------- 3. EnvironmentFile 与变量名（只报变量名/文件路径）----------
            w("\n[3] 环境变量注入来源（仅路径与变量名）")
            out = sh("grep -rIl 'WOOCOMMERCE_' /etc/systemd/system /usr/lib/systemd/system /etc/default /opt/nuotao-ai-os 2>/dev/null | grep -v '\\.pyc' | head -30")
            for ln in out.strip().splitlines():
                if ln.strip():
                    w(f"  FILE: {ln.strip()}")

            # 对每个候选文件，只列出含 WOOCOMMERCE_ 的行中的“变量名”，以及值是否占位符
            for f in out.strip().splitlines():
                f = f.strip()
                if not f or f.endswith(".pyc"):
                    continue
                content = sh(f"cat {f} 2>/dev/null") or ""
                for raw in content.splitlines():
                    line = raw.strip()
                    if not line.startswith("WOOCOMMERCE_"):
                        continue
                    name = line.split("=")[0].strip()
                    val = line.split("=", 1)[1].strip() if "=" in line else ""
                    ph = bool(re.search(r'[\${]', val))
                    w(f"  {f} :: {name} len={len(val)} placeholder={ph}")

            # .env 中 WOOCOMMERCE_ 变量名 + 占位符判定
            w("\n[4] /opt/nuotao-ai-os/backend/.env 中 WOOCOMMERCE_ 变量名（不打印值）")
            env = sh("cat /opt/nuotao-ai-os/backend/.env 2>/dev/null") or ""
            for raw in env.splitlines():
                line = raw.strip()
                if line.startswith("WOOCOMMERCE_"):
                    name = line.split("=")[0].strip()
                    val = line.split("=", 1)[1].strip() if "=" in line else ""
                    ph = bool(re.search(r'[\${]', val))
                    w(f"  {name} len={len(val)} placeholder={ph}")

            # ---------- 5. 数据库：启用产品与映射 ----------
            async def db():
                engine = create_async_engine(s.database_url)
                w("\n[5] 数据库只读核对")
                async with engine.connect() as conn:
                    rows = (await conn.execute(text(
                        "SELECT id, sku, name, category, source_offer_id, "
                        "CASE WHEN meta IS NULL THEN 'null' ELSE COALESCE(meta::text,'') END AS meta_txt "
                        "FROM products WHERE b2b_showcase_enabled = true AND deleted_at IS NULL "
                        "ORDER BY id"
                    ))).fetchall()
                    w(f"  启用产品数: {len(rows)}")
                    for r in rows:
                        pid, sku, name, cat, offer, meta_txt = r
                        has_imgs = bool(re.search(r'"image', meta_txt or ""))
                        n_imgs = (meta_txt or "").count("uploads/")
                        w(f"  id={pid} sku={sku} offer_id={offer} cat={cat}")
                        w(f"      name={name}")
                        w(f"      meta_len={len(meta_txt or '')} has_image_key={has_imgs} uploads_refs={n_imgs}")
                    w("\n  product_mappings 现状：")
                    mrows = (await conn.execute(text(
                        "SELECT COUNT(*) FROM product_mappings"
                    ))).fetchone()
                    w(f"    总行数: {mrows[0]}")
                    krows = (await conn.execute(text(
                        "SELECT COUNT(*) FROM product_mappings pm "
                        "JOIN products p ON pm.nuotao_product_id = p.id "
                        "WHERE p.b2b_showcase_enabled = true"
                    ))).fetchone()
                    w(f"    启用产品已映射行数: {krows[0]}")
                    cats = (await conn.execute(text(
                        "SELECT category, COUNT(*) c FROM products "
                        "WHERE b2b_showcase_enabled = true AND deleted_at IS NULL "
                        "GROUP BY category ORDER BY c DESC"
                    ))).fetchall()
                    w("\n  类别分布（启用产品）：")
                    for c in cats:
                        w(f"    {c[0]!r} -> {c[1]}")
                await engine.dispose()

            asyncio.run(db())

            with open(OUT, "w", encoding="utf-8") as fh:
                fh.write("\n".join(lines))
            print("AUDIT_WRITTEN", OUT, "lines=", len(lines))
            PYEOF
            python3 /tmp/m420_audit.py
            echo "===== AUDIT REPORT BEGIN ====="
            cat /opt/nuotao-ai-os/backend/_m420_audit.txt
            echo "===== AUDIT REPORT END ====="
            rm -f /opt/nuotao-ai-os/backend/_m420_audit.txt /tmp/m420_audit.py
        env:
          SSH_PORT: "22"
