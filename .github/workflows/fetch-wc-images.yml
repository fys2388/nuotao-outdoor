name: Fetch WooCommerce Images for B2B Showcase (temporary)

# One-off: the enabled B2B showcase products are WooCommerce-synced listings
# that already carry real imagery on the WC side, but products.meta has no
# images key (and product_mappings is empty for them). Match each product by
# source_offer_id -> WC SKU (NT-<offer_id>) and pull the WC product's images,
# writing them into products.meta -> images. Falls back to the internal SKU.

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch WC images and write to products.meta
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            source .venv/bin/activate
            cat > /tmp/fetch_wc_images.py << 'PYEOF'
            import asyncio, json
            import requests
            from sqlalchemy import text
            from sqlalchemy.ext.asyncio import create_async_engine
            from app.core.config import get_settings

            async def main():
                s = get_settings()
                wc_base = (s.woocommerce_base_url or "").rstrip("/")
                # Server .env stores a literal '\$WOOCOMMERCE_BASE_URL' placeholder
                # (real value is injected by the service manager); the placeholder is
                # not a valid URL, so fall back to the known WC host.
                if not wc_base or "\$" in wc_base or wc_base.startswith("\\"):
                    wc_base = "https://nuotaooutdoor.com"
                key, secret = s.woocommerce_consumer_key, s.woocommerce_consumer_secret
                print("wc base:", wc_base, "| key set:", bool(key), "| secret set:", bool(secret))
                engine = create_async_engine(s.database_url)
                try:
                    async with engine.connect() as conn:
                        rows = (await conn.execute(text(
                            "SELECT id, name, sku, source_offer_id FROM products "
                            "WHERE b2b_showcase_enabled = true AND deleted_at IS NULL "
                            "ORDER BY created_at"
                        ))).fetchall()
                        print("showcase products:", len(rows))
                        ok = noimg = http_err = 0
                        for pid, name, sku, offer_id in rows:
                            # WC SKU convention: NT-<1688 offer id>; fall back to internal SKU.
                            wc_sku = f"NT-{offer_id}" if offer_id else sku
                            try:
                                r = requests.get(
                                    f"{wc_base}/wp-json/wc/v3/products",
                                    params={"sku": wc_sku, "per_page": 1},
                                    auth=(key, secret),
                                    timeout=25,
                                )
                                if r.status_code == 200:
                                    data = r.json()
                                    if data:
                                        imgs = [im.get("src") for im in data[0].get("images", []) if im.get("src")]
                                        if imgs:
                                            await conn.execute(
                                                text("UPDATE products SET meta = jsonb_set(meta, '{images}', :imgs::jsonb) WHERE id = :id"),
                                                {"imgs": json.dumps(imgs[:5]), "id": pid},
                                            )
                                            print(f"  OK   {name[:24]:24s} sku={wc_sku[:24]} imgs={len(imgs)} {imgs[0][:55]}")
                                            ok += 1
                                        else:
                                            print(f"  NIMG {name[:24]:24s} sku={wc_sku[:24]} (no images)")
                                            noimg += 1
                                    else:
                                        print(f"  NFND {name[:24]:24s} sku={wc_sku[:24]} (no WC product)")
                                        http_err += 1
                                else:
                                    print(f"  HTTP {r.status_code}  {name[:24]:24s} sku={wc_sku[:24]}")
                                    http_err += 1
                            except Exception as e:
                                print(f"  ERR  {name[:24]:24s} sku={wc_sku[:24]}: {e}")
                                http_err += 1
                        await conn.commit()
                        print("summary: ok =", ok, "noimg =", noimg, "errors =", http_err)
                finally:
                    await engine.dispose()

            asyncio.run(main())
            PYEOF
            python3 /tmp/fetch_wc_images.py 2>&1 | tail -30
            rm -f /tmp/fetch_wc_images.py
