name: Fix Staging Gunicorn Service

on:
  workflow_dispatch:

jobs:
  fix:
    name: Switch staging service to gunicorn
    runs-on: ubuntu-latest
    steps:
      - name: Fix staging gunicorn service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Stop staging service and kill all 8001 processes ==="
            systemctl stop nuotao-backend-staging
            sleep 2
            PIDS=$(ss -tlnp | grep ':8001' | grep -oP 'pid=\K[0-9]+' | sort -u)
            if [ -n "$PIDS" ]; then
                for PID in $PIDS; do kill -9 $PID 2>/dev/null || true; done
            fi
            sleep 2
            ss -tlnp | grep ':8001' || echo "Port 8001 is FREE"

            echo ""
            echo "=== 2. Ensure gunicorn is installed ==="
            cd /opt/nuotao/staging/backend
            .venv/bin/pip install gunicorn --quiet 2>&1 | tail -2
            .venv/bin/gunicorn --version

            echo ""
            echo "=== 3. Update systemd service to use gunicorn ==="
            cat > /etc/systemd/system/nuotao-backend-staging.service << 'EOF'
            [Unit]
            Description=Nuotao AI OS Backend API Server (Staging)
            After=network.target postgresql.service redis.service

            [Service]
            User=nuotao
            Group=nuotao
            WorkingDirectory=/opt/nuotao/staging/backend
            EnvironmentFile=/opt/nuotao/staging/backend/.env
            ExecStart=/opt/nuotao/staging/backend/.venv/bin/gunicorn app.main:app --bind 127.0.0.1:8001 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120
            Restart=always
            RestartSec=5
            ProtectSystem=full
            ProtectHome=true
            ReadWritePaths=/opt/nuotao/staging/backend/data /opt/nuotao/staging/backend/logs /opt/nuotao/staging/backend/app/data /opt/nuotao/staging/backend/app/logs

            [Install]
            WantedBy=multi-user.target
            EOF

            echo "Service file updated"
            systemctl daemon-reload

            echo ""
            echo "=== 4. Clear pycache ==="
            find /opt/nuotao/staging/backend/app -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
            find /opt/nuotao/staging/backend -name "*.pyc" -delete 2>/dev/null

            echo ""
            echo "=== 5. Start staging service ==="
            systemctl start nuotao-backend-staging
            sleep 10

            echo ""
            echo "=== 6. Service status ==="
            systemctl status nuotao-backend-staging --no-pager | head -10

            echo ""
            echo "=== 7. Test endpoints ==="
            for path in /api/v1/readyz /api/v1/healthz /docs; do
                RESULT=$(curl -s -w " HTTP %{http_code}" --max-time 5 "http://127.0.0.1:8001$path" || echo " FAILED")
                echo "  $path -> $RESULT"
            done

            echo ""
            echo "=== 8. Openapi paths count ==="
            curl -s --max-time 5 http://127.0.0.1:8001/openapi.json | /opt/nuotao/staging/backend/.venv/bin/python -c "
            import sys, json
            d = json.load(sys.stdin)
            paths = list(d.get('paths', {}).keys())
            print(f'Total paths: {len(paths)}')
            health = [p for p in paths if 'health' in p.lower() or 'ready' in p.lower()]
            print(f'Health paths: {health}')
            " 2>&1

            echo ""
            echo "=== 9. Readyz full response ==="
            curl -s --max-time 5 http://127.0.0.1:8001/api/v1/readyz
            echo ""
