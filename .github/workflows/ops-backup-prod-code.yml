name: Ops - Backup Production Code

# Purpose: before any hotfix deploy, snapshot the LIVE production code into a
# repo branch so we can diff against it and avoid clobbering uncommitted
# server-side changes (rsync --delete in deploy.yml would destroy them).
#
# Server-side backup (rollback) goes to /opt/nuotao/backups/.
# Repo copy lands on branch: backup/prod-code
#
# Trigger: push to branch ops/backup-prod

on:
  workflow_dispatch:
  push:
    branches: [ops/backup-prod]

permissions:
  contents: write

jobs:
  backup:
    name: Snapshot live production code
    runs-on: ubuntu-latest
    steps:
      - name: Backup on server + push to backup branch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -eo pipefail
            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            BK=/opt/nuotao/backups/listing-gate-$STAMP
            mkdir -p "$BK"
            cd /opt/nuotao

            echo "===== 0. server identity ====="
            uname -a; ls -ld /opt/nuotao/backend /opt/nuotao/frontend

            echo "===== 1. server-side rollback backup (targz) ====="
            ( cd backend && tar -czf "$BK/backend-before.tgz" \
                app/api/v1/endpoints/products.py \
                app/api/v1/endpoints/product_intelligence.py \
                app/services/woocommerce_sync_service.py \
                app/services/product_copy_service.py \
                app/services/product_intelligence.py \
                app/api/v1/router.py \
                app/main.py 2>/dev/null || true )
            ( cd frontend && tar -czf "$BK/frontend-before.tgz" \
                src/pages/ProductPublish.tsx src/api/client.ts 2>/dev/null || true )
            ls -la "$BK"

            echo "===== 2. git state of live checkout ====="
            git log --oneline -3 2>/dev/null || echo "(no git metadata)"
            git status --porcelain 2>/dev/null | head -30 || true

            echo "===== 3. push live code to backup/prod-code ====="
            rm -rf /tmp/prodbak && mkdir -p /tmp/prodbak
            cp -r backend/app /tmp/prodbak/backend-app
            cp -r backend/alembic /tmp/prodbak/backend-alembic 2>/dev/null || true
            cp -r frontend/src /tmp/prodbak/frontend-src 2>/dev/null || true
            cp -r frontend/package.json /tmp/prodbak/frontend-package.json 2>/dev/null || true
            cd /tmp/prodbak
            git init -q
            git config user.email ci@nuotao.local
            git config user.name nuotao-ci
            git add -A
            git commit -q -m "prod live code backup $STAMP"
            git branch -M backup/prod-code
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/fys2388/nuotao-outdoor.git"
            git push --force --quiet origin backup/prod-code
            echo "PUSHED -> backup/prod-code (stamp=$STAMP)"

            echo "===== 4. file sizes for sanity ====="
            wc -l /opt/nuotao/backend/app/api/v1/endpoints/products.py \
                  /opt/nuotao/backend/app/services/woocommerce_sync_service.py \
                  /opt/nuotao/frontend/src/pages/ProductPublish.tsx 2>/dev/null || true
            echo "DONE backup; server backup dir=$BK"
