name: Database Daily Backup

on:
  schedule:
    # 每天 UTC 时间 18:00 执行（北京时间 02:00）
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: '备份保留天数'
        required: false
        default: '7'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute database backup on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/nuotao
            
            # 创建备份目录
            mkdir -p /opt/nuotao/backups
            
            # 加载环境变量
            if [ -f /opt/nuotao/.env ]; then
                set -a
                source /opt/nuotao/.env
                set +a
            fi
            
            # 执行备份
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_FILE="/opt/nuotao/backups/nuotao_${TIMESTAMP}.sql.gz"
            
            echo "=== 数据库备份开始: $(date) ==="
            echo "备份文件: ${BACKUP_FILE}"
            
            # 使用 pg_dump 备份
            PGPASSWORD="${POSTGRES_PASSWORD:-nuotao}" pg_dump \
                -h "${POSTGRES_HOST:-localhost}" \
                -p "${POSTGRES_PORT:-5432}" \
                -U "${POSTGRES_USER:-nuotao}" \
                -d "${POSTGRES_DB:-nuotao}" \
                --format=plain \
                --no-owner \
                --no-acl \
                2>/tmp/pg_dump_error.log | gzip > "${BACKUP_FILE}"
            
            # 检查备份结果
            if [ $? -eq 0 ] && [ -f "${BACKUP_FILE}" ] && [ -s "${BACKUP_FILE}" ]; then
                BACKUP_SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                echo "备份成功: ${BACKUP_FILE} (${BACKUP_SIZE})"
            else
                echo "备份失败!"
                cat /tmp/pg_dump_error.log
                exit 1
            fi
            
            # 清理 7 天前的备份
            echo "清理 7 天前的备份..."
            find /opt/nuotao/backups -name "nuotao_*.sql.gz" -type f -mtime +7 -delete -print
            
            # 列出当前备份
            echo ""
            echo "=== 当前备份列表 ==="
            ls -lh /opt/nuotao/backups/nuotao_*.sql.gz 2>/dev/null || echo "无备份文件"
            
            echo ""
            echo "=== 数据库备份完成: $(date) ==="
