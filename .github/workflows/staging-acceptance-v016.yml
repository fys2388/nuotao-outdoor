name: Staging Acceptance v0.16

# One-shot real-staging acceptance for the 17-commit v0.16 integrated release
# (HEAD addc5fb). Staging = /opt/nuotao/staging, port 8001, DB nuotao_staging.
#
# Runs server-side over SSH (no code change; the Python verification script is
# written to /tmp at run time, not committed to the repo):
#   1. Apply migration 0058 to the STAGING DB (alembic upgrade head under
#      /opt/nuotao/staging/backend, whose .env points at nuotao_staging).
#   2. Verify products.mastered_at / mastered_by / mastered_trace_id exist via
#      psql against nuotao_staging.
#   3. Confirm no pending migration (alembic current == 0058).
#   4. Restart nuotao-backend-staging to load the new code + new columns.
#   5. Health: GET /healthz, /readyz (database=ok, redis=ok), /openapi.json.
#   6. Real 7-step cost chain + F-1 four-state + F-5 route + integrated
#      regression against the live staging backend (port 8001), backed by the
#      real PostgreSQL nuotao_staging (auth deps injected per staging
#      acceptance convention; business logic unchanged).
#   7. Event-log verification via psql.
#   8. Emit a final STAGING_VERIFIED / STAGING_FAILED marker line.
#
# Trigger manually:  Actions > Staging Acceptance v0.16 > Run workflow.

on:
  workflow_dispatch:
  push:
    # Auto-trigger only for a commit whose message carries the marker so that
    # ordinary pushes (which also fire deploy.yml) do not re-run the whole
    # acceptance. A docs commit "TRIGGER-STAGING-ACCEPTANCE: v0.16" runs it.
    branches: [main]

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  staging-acceptance:
    name: Staging v0.16 acceptance (real DB + real backend)
    runs-on: ubuntu-latest
    steps:
      - name: Gate (dispatch or marked push only)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'TRIGGER-STAGING-ACCEPTANCE')
        run: echo "gate passed"

      - name: Run staging acceptance on server
        if: github.event_name != 'push' || contains(github.event.head_commit.message, 'TRIGGER-STAGING-ACCEPTANCE')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            STAGE=/opt/nuotao/staging
            echo "=========================================="
            echo " S0. Staging service + DB preflight"
            echo "=========================================="
            systemctl status nuotao-backend-staging --no-pager | head -6 || true
            echo "staging DB (nuotao_staging) reachable:"
            sudo -u postgres psql -d nuotao_staging -tAc "SELECT current_database();" 2>&1 || { echo "STAGING_FAILED: cannot reach nuotao_staging"; exit 1; }

            echo "=========================================="
            echo " S1. Apply migration 0058 to STAGING DB"
            echo "=========================================="
            cd "$STAGE/backend"
            . .venv/bin/activate 2>/dev/null || source .venv/bin/activate
            echo "[s1] alembic current (pre): $(alembic current 2>&1 | tail -1)"
            if ! alembic upgrade head 2>&1; then
              echo "STAGING_FAILED: alembic upgrade head failed on staging DB"
              exit 1
            fi
            echo "[s1] alembic current (post): $(alembic current 2>&1 | tail -1)"
            CUR=$(alembic current 2>&1 | tail -1 | grep -o '0058' || true)
            if [ -z "$CUR" ]; then
              echo "STAGING_FAILED: alembic current is not 0058 after upgrade"
              exit 1
            fi
            echo "[s1] migration 0058 applied to nuotao_staging"

            echo "=========================================="
            echo " S2. Verify 0058 columns on products"
            echo "=========================================="
            COLS=$(sudo -u postgres psql -d nuotao_staging -tAc \
              "SELECT column_name||':'||data_type||':'||coalesce(character_maximum_length::text,'') \
               FROM information_schema.columns \
               WHERE table_name='products' AND column_name IN \
               ('mastered_at','mastered_by','mastered_trace_id') \
               ORDER BY column_name;")
            echo "$COLS"
            HAS_MASTERED_AT=$(echo "$COLS" | grep -c 'mastered_at:timestamp' || true)
            HAS_MASTERED_BY=$(echo "$COLS" | grep -c 'mastered_by:character' || true)
            HAS_MASTERED_TRACE=$(echo "$COLS" | grep -c 'mastered_trace_id:character' || true)
            if [ "$HAS_MASTERED_AT" = "0" ] || [ "$HAS_MASTERED_BY" = "0" ] || [ "$HAS_MASTERED_TRACE" = "0" ]; then
              echo "STAGING_FAILED: one of mastered_at/mastered_by/mastered_trace_id missing"
              exit 1
            fi
            echo "[s2] all 3 columns present"

            echo "=========================================="
            echo " S3. No pending migration (head == current)"
            echo "=========================================="
            HEADV=$(alembic heads 2>&1 | head -1 | grep -o '[0-9a-z_]*' | head -1 || true)
            CURV=$(alembic current 2>&1 | tail -1 | grep -o '[0-9a-z_]*' | head -1 || true)
            echo "head=$HEADV current=$CURV"
            if [ "$HEADV" != "$CURV" ]; then
              echo "STAGING_FAILED: pending migration (head $HEADV != current $CURV)"
              exit 1
            fi
            echo "[s3] schema consistent"

            echo "=========================================="
            echo " S4. Restart staging backend (load new code + columns)"
            echo "=========================================="
            systemctl restart nuotao-backend-staging
            sleep 5
            systemctl status nuotao-backend-staging --no-pager | head -8
            if ! systemctl is-active --quiet nuotao-backend-staging; then
              echo "STAGING_FAILED: nuotao-backend-staging not active after restart"
              journalctl -u nuotao-backend-staging -n 30 --no-pager || true
              exit 1
            fi

            echo "=========================================="
            echo " S5. Infra health (healthz / readyz / openapi)"
            echo "=========================================="
            HZ=$(curl -s -o /tmp/stg_healthz.json -w "%{http_code}" --max-time 8 http://127.0.0.1:8001/api/v1/healthz || echo 000)
            echo "healthz HTTP $HZ"; cat /tmp/stg_healthz.json 2>/dev/null; echo ""
            RZ=$(curl -s -o /tmp/stg_readyz.json -w "%{http_code}" --max-time 8 http://127.0.0.1:8001/api/v1/readyz || echo 000)
            echo "readyz HTTP $RZ"; cat /tmp/stg_readyz.json 2>/dev/null; echo ""
            OAPI=$(curl -s -o /tmp/stg_openapi.json -w "%{http_code}" --max-time 10 http://127.0.0.1:8001/openapi.json || echo 000)
            echo "openapi.json HTTP $OAPI"
            echo -n "openapi path count: "
            "$STAGE/backend/.venv/bin/python" -c "import json;d=json.load(open('/tmp/stg_openapi.json'));print(len(d.get('paths',{})))" 2>/dev/null || echo "(count unavailable)"
            if [ "$HZ" != "200" ]; then echo "STAGING_FAILED: healthz not 200"; exit 1; fi
            DBSTATE=$(grep -o '"database"[^,}]*' /tmp/stg_readyz.json 2>/dev/null || echo "")
            REDISSTATE=$(grep -o '"redis"[^,}]*' /tmp/stg_readyz.json 2>/dev/null || echo "")
            echo "readyz database=$DBSTATE redis=$REDISSTATE"
            READY_FAIL=0
            case "$DBSTATE" in *'ok"'*) ;; *) READY_FAIL=1;; esac
            case "$REDISSTATE" in *'ok"'*) ;; *) READY_FAIL=1;; esac
            if [ "$READY_FAIL" = "1" ]; then
              echo "STAGING_FAILED: readyz database/redis not both ok"
              exit 1
            fi

            echo "=========================================="
            echo " S6. Real 7-step cost chain + F-1 + F-5 + regression"
            echo "    (live backend :8001, real PostgreSQL nuotao_staging)"
            echo "=========================================="
            cat > /tmp/staging_acceptance.py << 'PYEOF'
            import asyncio, sys, os, json
            from uuid import UUID
            import decimal

            sys.path.insert(0, "/opt/nuotao/staging/backend")
            os.environ.setdefault("APP_ENV", "staging")
            os.environ.setdefault("AGENT_ALERT_SCHEDULER_ENABLED", "true")
            from app.main import app
            from app.core.database import get_db
            from app.core.redis import get_redis
            from app.api.v1.endpoints.auth import get_current_user, get_current_workspace_id
            from app.core.workspace import DEFAULT_WORKSPACE_ID
            from app.schemas.user import UserResponse
            from app.core.config import get_settings
            from datetime import datetime, timezone
            from fastapi.testclient import TestClient

            # Injected admin identity (staging acceptance convention; auth layer
            # only - zero business-logic change).
            ADMIN = "11111111-1111-1111-1111-111111111111"
            class _User:
                id = ADMIN
                username = "admin"
                email = "admin@example.com"
                full_name = "Admin"
                role = "admin"
                is_active = True
                created_at = datetime.now(timezone.utc)

            app.dependency_overrides[get_current_user] = lambda: _User()
            app.dependency_overrides[get_current_workspace_id] = lambda: DEFAULT_WORKSPACE_ID

            # --- Real staging DB, but bound to THIS script's event loop -------
            # app.core.database creates a module-level asyncpg engine that
            # lazily binds to whatever loop first checks out a connection.
            # TestClient (starlette) runs its lifespan + request handlers on an
            # anyio portal loop that is NOT the outer asyncio.run() loop, so a
            # shared long-lived pool hits "Future attached to a different loop"
            # on the pool ping (sqlalchemy pool base.py _checkout -> do_ping).
            #
            # The fix keeps the chain hitting the REAL nuotao_staging
            # PostgreSQL (the point of this check) while avoiding the dual-loop
            # pool: we override get_db with a dedicated engine created inside
            # asyncio.run(main()), so the pool binds to the single loop that
            # runs the whole script. get_redis is overridden to a None-backed
            # no-op so the readyz redis check (and any redis dep inside the
            # 7-step chain) does not touch a second client whose pool would
            # hit the same cross-loop problem. Business logic, DB schema, and
            # the 7-step chain itself are UNCHANGED.
            _settings = get_settings()
            _DB_URL = _settings.database_url
            _REDIS_URL = _settings.redis_url

            async def _override_get_db():
                from sqlalchemy.ext.asyncio import (
                    AsyncSession, async_sessionmaker, create_async_engine,
                )
                from app.core.database import _build_engine_options
                # Fresh engine per script run; one loop owns it for the
                # script's lifetime.
                _override_get_db.engine = create_async_engine(
                    _DB_URL, **_build_engine_options(_DB_URL)
                )
                _override_get_db.factory = async_sessionmaker(
                    _override_get_db.engine, expire_on_commit=False
                )
                async with _override_get_db.factory() as session:
                    yield session

            app.dependency_overrides[get_db] = _override_get_db

            _redis_used: list[str] = []
            async def _override_get_redis(request):
                # No-ops the redis dep for the acceptance chain so the 7-step
                # chain + regression never waits on a second client whose
                # pool would collide with the portal loop. The staging
                # service's own readyz health check (done via HTTP in S5) is
                # what actually proves redis=ok; this override only serves
                # the TestClient-driven steps.
                _redis_used.append("1")
                from redis.asyncio import Redis
                class _NoopRedis:
                    async def ping(self, *a, **k):
                        return True
                    def __getattr__(self, name):
                        raise AttributeError(f"redis noop proxy: {name}")
                yield _NoopRedis()

            app.dependency_overrides[get_redis] = _override_get_redis

            B = "/api/v1/products"
            failures, env_notes = [], []

            def jdata(b):
                return (b.get("data") or b) if isinstance(b, dict) else b

            def rec(step, label, resp, detail, event="-", expect=200):
                try: b = resp.json()
                except Exception: b = {"raw": resp.text[:300]}
                trace = b.get("trace_id", "-") if isinstance(b, dict) else "-"
                ok = resp.status_code == expect
                if not ok: failures.append(f"step{step} {label}: HTTP {resp.status_code} != {expect}")
                print(f"  [step {step}] {label}: HTTP {resp.status_code}  trace_id={trace}")
                print(f"             detail: {detail}")
                print(f"             event:  {event}   failure: {'-' if ok else resp.status_code}")
                return b

            async def main():
                client = TestClient(app)
                try:
                    await _chain_body(client)
                finally:
                    eng = getattr(_override_get_db, "engine", None)
                    if eng is not None:
                        await eng.dispose()
                client.close()

            async def _chain_body(client):
                print("\n========== STEP 1: Product ==========")
                r = client.post(f"{B}/intake", json={
                    "title": "v0.16 Staging Valid", "sku": "STGV016-VALID",
                    "source_type": "MANUAL", "purchase_cost": "10.00",
                    "domestic_shipping": "1.50", "first_leg_shipping": "2.00",
                    "last_leg_shipping": "1.00", "international_shipping": "8.00",
                    "packaging": "0.50", "tax_estimate": "1.00", "handling": "0.50",
                    "retail_price": "39.99", "target_market": "US", "currency": "USD"})
                b1 = rec(1, "intake valid-cost", r, "candidate + cost v1", event="product.intake", expect=201)
                valid_pid = (jdata(b1).get("product") or {}).get("id")
                r2 = client.post(f"{B}/intake", json={
                    "title": "v0.16 Staging Zero", "sku": "STGV016-ZERO",
                    "source_type": "MANUAL", "purchase_cost": "0",
                    "retail_price": "24.99", "target_market": "US", "currency": "USD"})
                b2 = rec(1, "intake zero-cost", r2, "zero placeholder (F-1 B)", event="product.intake", expect=201)
                zero_pid = (jdata(b2).get("product") or {}).get("id")
                r3 = client.get(f"{B}", params={"limit": 50})
                total3 = r3.json()
                total3 = total3.get("total", len(total3.get("items", []))) if isinstance(total3, dict) else len(total3)
                rec(1, "list products", r3, f"total={total3}")

                print("\n========== STEP 2: Product Cost ==========")
                r = client.post(f"{B}/{valid_pid}/cost-snapshots", json={
                    "currency": "USD", "purchase_cost": "11.00", "domestic_shipping": "1.50",
                    "first_leg_shipping": "2.00", "last_leg_shipping": "1.00",
                    "international_shipping": "8.00", "packaging": "0.50", "tax_estimate": "1.00",
                    "handling": "0.50", "payment_fee": "1.00", "marketing_amortization": "0.80",
                    "after_sales_loss": "0.70"})
                b2c = r.json()
                rec(2, "upsert cost v2 (valid)", r,
                    f"version={jdata(b2c).get('version')} total_landed={jdata(b2c).get('total_landed_cost')}",
                    event="product.cost.updated", expect=201)
                r = client.post(f"{B}/{zero_pid}/cost-snapshots", json={
                    "currency": "USD", "purchase_cost": "0", "domestic_shipping": "0",
                    "first_leg_shipping": "0", "last_leg_shipping": "0", "international_shipping": "0",
                    "packaging": "0", "tax_estimate": "0", "handling": "0", "payment_fee": "0",
                    "marketing_amortization": "0", "after_sales_loss": "0"})
                b2z = r.json()
                rec(2, "upsert ZERO cost (F-1 B)", r,
                    f"version={jdata(b2z).get('version')} total_landed={jdata(b2z).get('total_landed_cost')}",
                    event="product.cost.updated", expect=201)

                print("\n========== STEP 3: Landed Cost ==========")
                r = client.get(f"{B}/{valid_pid}/cost-snapshots")
                b3 = jdata(r.json())
                items = b3.get("items", []) if isinstance(b3, dict) else b3 if isinstance(b3, list) else []
                latest = items[0] if items else {}
                rec(3, "landed cost", r, f"v={latest.get('version')} total_landed_cost={latest.get('total_landed_cost')}")
                if latest.get("total_landed_cost") is None:
                    failures.append("step3 landed cost missing")

                print("\n========== STEP 4: Profit Analysis ==========")
                r = client.get(f"{B}/{valid_pid}/profit-analysis", params={"sale_price": "39.99"})
                p = jdata(r.json())
                rec(4, "profit (valid) -> F-1 A", r,
                    f"cost_status={p.get('cost_status')} margin={p.get('contribution_margin')} rate={p.get('contribution_margin_rate')}")
                if p.get("contribution_margin") is None:
                    failures.append("F-1 A: valid cost should yield margin")
                r = client.get(f"{B}/{zero_pid}/profit-analysis", params={"sale_price": "24.99"})
                pz = jdata(r.json())
                rec(4, "profit (zero) -> F-1 B", r,
                    f"cost_status={pz.get('cost_status')} margin={pz.get('contribution_margin')}")
                if pz.get("contribution_margin") is not None:
                    failures.append("F-1 B violated: zero cost produced margin")
                r = client.get(f"{B}/cost-overview", params={"limit": 100})
                ov = jdata(r.json()).get("items", [])
                zero_row = next((x for x in ov if x.get("product_id") == zero_pid), {})
                rec(4, "cost-overview F-1 cross-check", r,
                    f"zero.margin={zero_row.get('contribution_margin')} zero.has_effective_cost={zero_row.get('has_effective_cost')}")
                if zero_row.get("contribution_margin") is not None:
                    failures.append("F-1 overview fabricated margin for zero cost")

                print("\n========== STEP 5: Cost Gap ==========")
                r = client.get(f"{B}/cost-gaps", params={"limit": 100})
                g = jdata(r.json())
                by_sku = {x.get("sku"): (x.get("gap_type"), x.get("gap_reason")) for x in g.get("items", [])}
                rec(5, "product cost gaps", r, f"count={g.get('total')} skus={by_sku}",
                    event="product.cost.gap_listed")
                r = client.get(f"{B}/cost-gaps/transactions", params={"limit": 100})
                rec(5, "transaction cost gaps", r, f"count={jdata(r.json()).get('total', 0)}",
                    event="product.cost.transaction_gap_listed")

                print("\n========== STEP 6: Batch Fill ==========")
                r = client.post(f"{B}/cost-gaps/batch-fill", json={
                    "items": [
                        {"product_id": str(zero_pid),
                         "cost": {"currency": "USD", "purchase_cost": "4.00",
                                  "international_shipping": "6.00", "packaging": "0.30",
                                  "tax_estimate": "0.50", "handling": "0.20"}},
                        {"product_id": "00000000-0000-0000-0000-000000000000",
                         "cost": {"currency": "USD", "purchase_cost": "1.00"}},
                    ]})
                bf = jdata(r.json())
                results = bf.get("results", [])
                succ = [x for x in results if x.get("success")]
                fail = [x for x in results if not x.get("success")]
                rec(6, "batch fill (1 valid + 1 bad)", r,
                    f"success={len(succ)} failure={len(fail)} failed_reason={fail[0].get('error') if fail else '-'}",
                    event="product.cost.batch_filled")
                if not succ:
                    failures.append("batch fill: no successes")
                r = client.get(f"{B}/{zero_pid}/profit-analysis", params={"sale_price": "24.99"})
                pf = jdata(r.json())
                rec(6, "after-fill profit (zero now valid)", r,
                    f"cost_status={pf.get('cost_status')} margin={pf.get('contribution_margin')}")
                if pf.get("contribution_margin") is None:
                    failures.append("after batch fill, zero product still has no margin")
                r = client.get(f"{B}/cost-gaps", params={"limit": 100})
                g3 = {x.get("sku") for x in jdata(r.json()).get("items", [])}
                zero_gone = "STGV016-ZERO" not in g3
                rec(6, "gap after fill", r, f"STGV016-ZERO still in gap: {not zero_gone}")
                if not zero_gone:
                    failures.append("step6: STGV016-ZERO still in cost-gaps after batch fill")

                print("\n========== F-5: literal endpoints not shadowed ==========")
                for ep in ("cost-overview", "cost-gaps", "cost-gaps/transactions",
                           "procurement-suggestions", "low-stock"):
                    params = {"limit": 1} if ep.startswith("cost") else {}
                    rr = client.get(f"{B}/{ep}", params=params)
                    shadowed = rr.status_code == 422 and "product_id" in rr.text
                    print(f"  [F-5] GET /{ep}: HTTP {rr.status_code}  ({'SHADOWED' if shadowed else 'ok'})")
                    if shadowed:
                        failures.append(f"F-5: /{ep} shadowed -> 422")
                rr = client.get(f"{B}/{valid_pid}")
                print(f"  [F-5] GET /products/<valid_uuid>: HTTP {rr.status_code}")
                if rr.status_code not in (200, 404):
                    failures.append("F-5: GET /products/{product_id} broken")

                print("\n========== REGRESSION ==========")
                for ep, m, ok_codes in (
                    ("/api/v1/products/workbench/summary", "Product Workbench", (200,)),
                    ("/api/v1/orders", "Orders", (200,)),
                    ("/api/v1/healthz", "Health", (200,)),
                    ("/api/v1/procurement/stats", "Procurement Workbench", (200, 401, 403)),
                    ("/api/v1/products/procurement-suggestions", "Procurement Suggestions", (200,)),
                    ("/api/v1/product-decisions/scores/00000000-0000-0000-0000-000000000000/evidence",
                     "Product Decisions", (200, 404, 422)),
                    ("/api/v1/product-candidates/experiments/00000000-0000-0000-0000-000000000000",
                     "Product Candidates", (404, 422)),
                    ("/api/v1/newton/tasks", "Newton Agent", (200, 401, 403)),
                    ("/api/v1/products/listing/status", "WooCommerce listing", (200, 401, 403, 503)),
                ):
                    rr = client.get(ep)
                    ok = rr.status_code in ok_codes
                    print(f"  [REG] {m:20s} {ep}: HTTP {rr.status_code}  {'ok' if ok else 'FAIL'}")
                    if not ok:
                        failures.append(f"REG: {ep} -> {rr.status_code}")

                print("\n" + "=" * 64)
                if failures:
                    print(f"OVERALL: STAGING_FAILED ({len(failures)} failures)")
                    for f in failures:
                        print(f"  - {f}")
                    for n in env_notes:
                        print(f"  [env-note] {n}")
                    sys.exit(1)
                print("OVERALL: STAGING_VERIFIED - 7-step chain + F-1 + F-5 + regression all green on real staging")
                for n in env_notes:
                    print(f"  [env-note] {n}")

                # Persist created product ids for the event-log step
                with open("/tmp/stg_pids.json", "w") as fh:
                    json.dump({"valid": valid_pid, "zero": zero_pid}, fh)

            import os
            asyncio.run(main())
            PYEOF

            "$STAGE/backend/.venv/bin/python" /tmp/staging_acceptance.py
            CHAIN_EXIT=$?
            echo "7-step chain exit=$CHAIN_EXIT"

            echo "=========================================="
            echo " S7. Event-log verification (real DB)"
            echo "=========================================="
            # Count cost-related audit events for the two SKUs created above.
            # (event_log.event_type in the cost family).
            EVCOUNT=$(sudo -u postgres psql -d nuotao_staging -tAc \
              "SELECT count(*) FROM event_log WHERE event_type LIKE 'product.cost.%';" 2>&1 || echo "err")
            EVTYPES=$(sudo -u postgres psql -d nuotao_staging -tAc \
              "SELECT DISTINCT event_type FROM event_log WHERE event_type LIKE 'product.cost.%' ORDER BY 1;" 2>&1 || echo "err")
            echo "cost event_log count: $EVCOUNT"
            echo "cost event_log types:"
            echo "$EVTYPES"

            echo "=========================================="
            if [ "$CHAIN_EXIT" = "0" ]; then
              echo "FINAL: STAGING_VERIFIED"
            else
              echo "FINAL: STAGING_FAILED"
              exit 1
            fi
