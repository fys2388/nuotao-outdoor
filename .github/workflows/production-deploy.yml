name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to deploy'
        required: false
        default: '969ec499bf70005e3437b81c1af16ab57734d0a6'

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  REPO_URL: https://github.com/fys2388/nuotao-outdoor.git

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eo pipefail
            SHA="${{ inputs.sha }}"
            SHORT=$(echo "$SHA" | cut -c1-7)
            PROD=/opt/nuotao/backend
            REPO="${{ env.REPO_URL }}"
            echo "DEPLOY $SHORT $(date -u)"
            TMP=$(mktemp -d /tmp/nd-XXXXXX)
            echo "TMP=$TMP"
            git clone "$REPO" "$TMP/r" 2>&1
            cd "$TMP/r"
            git checkout "$SHA" 2>&1
            echo "SHA=$(git rev-parse HEAD)"
            echo "LOG=$(git log -1 --oneline)"
            echo "--- stopping backend ---"
            systemctl stop nuotao-backend 2>/dev/null || true
            echo "--- backup env ---"
            BAK="/opt/nuotao/backup/$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$BAK"
            [ -f "$PROD/.env" ] && cp "$PROD/.env" "$BAK/" || echo "no .env"
            echo "--- rsync ---"
            cd "$TMP/r/backend"
            rsync -a --exclude=.venv --exclude=.env --exclude=.git ./ "$PROD/"
            [ -f "$BAK/.env" ] && cp "$BAK/.env" "$PROD/.env" || true
            echo "$SHA" > "$PROD/.deploy_sha"
            echo "$SHORT" > "$PROD/version.txt"
            echo "--- migrate ---"
            cd "$PROD"
            source .venv/bin/activate
            alembic upgrade head 2>&1
            echo "MIGRATE_OK=$?"
            alembic current 2>&1
            echo "--- columns ---"
            sudo -u postgres psql -d nuotao -tAc "SELECT column_name FROM information_schema.columns WHERE table_name='products' AND column_name IN ('mastered_at','mastered_by','mastered_trace_id') ORDER BY column_name" 2>&1
            echo "--- restart ---"
            systemctl start nuotao-backend
            sleep 5
            systemctl is-active nuotao-backend
            echo "--- health ---"
            curl -s -w " HTTP=%{http_code}" http://localhost:8000/healthz 2>&1
            echo ""
            curl -s -w " HTTP=%{http_code}" http://localhost:8000/readyz 2>&1
            echo ""
            curl -s http://localhost:8000/openapi.json 2>&1 | head -c 100
            echo ""
            echo "--- nginx ---"
            systemctl is-active nginx
            echo "--- redis ---"
            RPWD=$(grep -oP 'REDIS_PASSWORD=\K.*' "$PROD/.env" 2>/dev/null || echo '')
            [ -n "$RPWD" ] && redis-cli -a "$RPWD" ping 2>&1 || echo "no redis pw"
            rm -rf "$TMP"
            echo "DONE $SHORT"
