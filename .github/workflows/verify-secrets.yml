name: M420 Verify WC creds from secrets (read-only)

# 只读验证 GitHub secrets 中的 WC 凭证是否有效。
# secrets 经 envs 注入远程脚本（GitHub 自动 mask，不写仓库、不打印值），
# 只输出 HTTP 状态码与命中产品数。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-secrets.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify WC creds from GitHub secrets
        uses: appleboy/ssh-action@v1.0.3
        env:
          WC_BASE: ${{ secrets.WOOCOMMERCE_BASE_URL }}
          WC_KEY: ${{ secrets.WOOCOMMERCE_CONSUMER_KEY }}
          WC_SEC: ${{ secrets.WOOCOMMERCE_CONSUMER_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: WC_BASE,WC_KEY,WC_SEC
          script: |
            set -e
            echo "===== SECRETS VERIFY BEGIN ====="
            echo "  base_len=${#WC_BASE} key_len=${#WC_KEY} sec_len=${#WC_SEC}"
            if echo "$WC_BASE" | grep -qE '[\${]' || echo "$WC_KEY" | grep -qE '[\${]'; then
              echo "  SKIP: secrets are placeholder/empty"
              exit 0
            fi
            OUT=$(curl -s -o /tmp/wcsec.json -w "%{http_code}" -u "$WC_KEY:$WC_SEC" "${WC_BASE%/}/wp-json/wc/v3/products?per_page=1")
            echo "  HTTP_STATUS=$OUT"
            if [ "$OUT" = "200" ]; then
              CNT=$(python3 -c "import json;print(len(json.load(open('/tmp/wcsec.json'))))" 2>/dev/null || echo "?")
              echo "  products_hit=$CNT"
            fi
            rm -f /tmp/wcsec.json
            echo "===== SECRETS VERIFY END ====="