name: SSH Harden S4 Independent Verification

# 独立验证S4执行结果（不修改任何配置，纯只读检查）
# Owner授权：D8-E P0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssh-harden-s4-verify.yml'
      - '.github/workflows/ssh-harden-s3-fail2ban.yml'

jobs:
  verify-s4:
    name: S4 Independent Verification
    runs-on: ubuntu-latest
    steps:
      - name: Verify SSH config (read-only, no changes)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 90s
          script: |
            set -e
            echo "=========================================="
            echo "SSH S4 独立验证报告 — $(date)"
            echo "服务器: ${{ secrets.SERVER_HOST }}"
            echo "=========================================="
            echo ""

            echo "【1】当前生效的 SSH 配置（sshd -T）"
            sudo sshd -T 2>/dev/null | grep -iE "^(passwordauthentication|permitrootlogin|pubkeyauthentication|challengeresponseauthentication|authenticationmethods)" || \
              sudo sshd -T 2>/dev/null | grep -iE "^(passwordauthentication|permitrootlogin|pubkeyauthentication)"
            echo ""

            echo "【2】sshd_config 文件内容（关键字段）"
            sudo grep -nE "^(PasswordAuthentication|PermitRootLogin|PubkeyAuthentication|ChallengeResponseAuthentication|AuthenticationMethods)" /etc/ssh/sshd_config || \
              echo "（未找到显式配置，使用默认值）"
            echo ""

            echo "【3】sshd_config.d 额外配置目录"
            ls -la /etc/ssh/sshd_config.d/ 2>/dev/null || echo "（无此目录）"
            cat /etc/ssh/sshd_config.d/*.conf 2>/dev/null || echo "（无额外配置）"
            echo ""

            echo "【4】fail2ban SSH jail 状态"
            sudo fail2ban-client status sshd 2>/dev/null || echo "fail2ban 未运行或无 sshd jail"
            echo ""

            echo "【5】fail2ban 当前封禁 IP 列表"
            sudo fail2ban-client get sshd banip 2>/dev/null || echo "（无法获取，可能无封禁）"
            echo ""

            echo "【6】Hetzner Console 应急通道状态检查"
            echo "  → 确认 console.hetzner.cloud 仍可访问（手动验证）"
            echo "  → 本机 IP $(curl -s --max-time 5 https://ifconfig.me 2>/dev/null || echo 'unknown')" >> /tmp/s4_verify_log.txt
            echo ""

            echo "【7】SSH 备份文件检查"
            ls -la /etc/ssh/sshd_config.bak.* 2>/dev/null | tail -3 || echo "（无备份文件！⚠️）"
            echo ""

            echo "【8】当前在线用户（确认管理员会话活跃）"
            who
            echo ""

            echo "【9】GitHub Actions Runner IP 白名单检查"
            curl -s --max-time 5 https://api.github.com/meta 2>/dev/null | python3 -c "
import sys,json
try:
    d=json.load(sys.stdin)
    gh_ips=d.get('hooks',[]) + d.get('git',[])
    print(f'GitHub IPs: {len(gh_ips)} 个')
    for ip in gh_ips[:5]: print(f'  - {ip}')
except: print('(无法解析GitHub meta API)')
" 2>/dev/null || echo "（无法获取GitHub IPs）"
            echo ""

            echo "=========================================="
            echo "✅ 验证完成"
            echo "=========================================="
