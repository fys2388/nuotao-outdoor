name: SSH Harden S4 - Disable Password Auth (Owner Approved)

# CRITICAL: This modifies production SSH config.
# Pre-condition: GitHub Actions SSH channel confirmed working (multiple successful runs).
# Rollback: Restore /etc/ssh/sshd_config.bak and `systemctl reload sshd`.
# Owner approved: Console emergency access VERIFIED via browser.

on:
  workflow_dispatch:

jobs:
  s4:
    name: S4 Disable SSH Password Authentication
    runs-on: ubuntu-latest
    steps:
      - name: Backup current sshd_config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 60s
          script: |
            set -e
            echo "=== BACKUP ==="
            sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak.$(date +%Y%m%dT%H%M%SZ)
            echo "Backup created"

      - name: Disable password authentication
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 60s
          script: |
            set -e
            echo "=== BEFORE ==="
            sudo grep -iE "^(PasswordAuthentication|PermitRootLogin|PubkeyAuthentication)" /etc/ssh/sshd_config || \
              sudo sshd -T 2>/dev/null | grep -iE "^(passwordauthentication|permitrootlogin|pubkeyauthentication)"
            echo ""
            echo "=== MODIFY ==="
            sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
            sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
            echo "Config modified"

      - name: Validate config before reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 60s
          script: |
            set -e
            echo "=== VALIDATE ==="
            sudo sshd -t 2>&1 && echo "CONFIG OK" || { echo "CONFIG INVALID"; exit 1; }

      - name: Reload SSH daemon
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 60s
          script: |
            set -e
            echo "=== RELOAD ==="
            sudo systemctl reload sshd
            sleep 2
            echo "SSH reloaded"

      - name: Verify final state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 60s
          script: |
            set -e
            echo "=== FINAL STATE ==="
            sudo sshd -T 2>/dev/null | grep -iE "^(passwordauthentication|permitrootlogin|pubkeyauthentication)"
            echo ""
            echo "=== FAIL2BAN STILL ACTIVE? ==="
            sudo systemctl is-active fail2ban || echo "fail2ban NOT active!"
            echo ""
            echo "=== CURRENT SESSION (must stay alive) ==="
            who
            echo "(if you see this, key auth works and you are not locked out)"

      - name: Rollback test (verify backup exists)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30s
          script: |
            echo "=== ROLLBACK CAPABILITY ==="
            ls -la /etc/ssh/sshd_config.bak.* | tail -1
            echo "To rollback: sudo cp /etc/ssh/sshd_config.bak.<timestamp> /etc/ssh/sshd_config && sudo systemctl reload sshd"
