name: SSH Harden S3 - Install fail2ban (Owner approved)

on:
  workflow_dispatch:

jobs:
  s3:
    name: S3 Install fail2ban + configure SSH jail + verify
    runs-on: ubuntu-latest
    steps:
      - name: Install and configure fail2ban
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 180s
          script: |
            set -e
            echo "=== 1. Install fail2ban ==="
            sudo apt-get update -qq 2>&1 | tail -2
            sudo apt-get install -y fail2ban 2>&1 | tail -5

            echo ""
            echo "=== 2. Configure SSH jail (conservative: no admin lockout) ==="
            sudo tee /etc/fail2ban/jail.local > /dev/null <<'EOF'
            [sshd]
            enabled = true
            port = ssh
            filter = sshd
            logpath = /var/log/auth.log
            backend = systemd
            maxretry = 6
            findtime = 10m
            bantime = 1h
            bantime.increment = true
            bantime.maxtime = 24h
            # 不封 Cloudflare/可信段可选；管理员用密钥成功登录不触发封禁
            ignoreip = 127.0.0.1/8 ::1
            EOF
            echo "jail.local written"

            echo ""
            echo "=== 3. Enable + restart fail2ban ==="
            sudo systemctl enable fail2ban 2>&1 | tail -1
            sudo systemctl restart fail2ban
            sleep 3
            sudo systemctl is-active fail2ban

            echo ""
            echo "=== 4. Verify fail2ban-client status sshd ==="
            sudo fail2ban-client status sshd 2>&1 || echo "status pending (jail starting)"

            echo ""
            echo "=== 5. Confirm my key login NOT banned (current connection alive) ==="
            who 2>/dev/null | head -3
            echo "(current session alive = admin not locked out)"

            echo ""
            echo "=== 6. fail2ban version + jail list ==="
            fail2ban-client version 2>/dev/null
            sudo fail2ban-client status 2>&1 | head -10
