name: Find Frontend Build Dir

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Find frontend build directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "=== 查找包含 index.html 的目录 ==="
            find /opt/nuotao -name "index.html" -type f 2>/dev/null | head -20
            
            echo ""
            echo "=== 查找包含 assets 目录的目录 ==="
            find /opt/nuotao -type d -name "assets" 2>/dev/null | head -10
            
            echo ""
            echo "=== 查找前端构建目录（包含 vite.svg 或 index.html） ==="
            find /opt/nuotao -name "vite.svg" -type f 2>/dev/null | head -10
            
            echo ""
            echo "=== 查看 /opt/nuotao 目录结构 ==="
            ls -la /opt/nuotao/
            
            echo ""
            echo "=== 查看 Nginx 配置中的 root 指令 ==="
            grep -r "root" /etc/nginx/sites-enabled/ 2>/dev/null
            
            echo ""
            echo "=== 查看 Nginx 配置中的 proxy_pass 指令 ==="
            grep -r "proxy_pass" /etc/nginx/sites-enabled/ 2>/dev/null
