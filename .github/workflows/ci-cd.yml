# ============================================
# Nuotao AI OS - GitHub Actions CI/CD
# ============================================
# 功能：
#   1. 代码质量检查（ruff lint + format check）
#   2. 类型检查（mypy）
#   3. 单元测试（pytest）
#   4. 前端构建验证
#   5. 安全扫描（pip-audit）
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql+asyncpg://nuotao:test_password@localhost:5432/nuotao_test"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  # ============================================
  # Job 1: 代码质量检查
  # ============================================
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pip-audit
          pip install -r requirements.txt

      - name: Ruff Lint Check
        working-directory: ./backend
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        working-directory: ./backend
        run: ruff format --check .

      - name: Mypy Type Check
        working-directory: ./backend
        run: mypy app/ --ignore-missing-imports --no-strict-optional || true

      - name: Security Scan (pip-audit)
        working-directory: ./backend
        run: pip-audit || true

  # ============================================
  # Job 2: 单元测试
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuotao
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: nuotao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run database migrations
        working-directory: ./backend
        run: |
          python -c "
          import asyncio
          from app.core.database import Base, _engine
          async def init():
              async with _engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
          asyncio.run(init())
          " || true

      - name: Run unit tests with coverage
        working-directory: ./backend
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # ============================================
  # Job 3: 前端构建验证
  # ============================================
  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit || true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================
  # Job 4: 部署（仅 main 分支）
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          echo "Deploying to production server..."
          echo "Deployment script would run here"
          # 示例：通过 SSH 部署
          # ssh user@server "cd /opt/nuotao-ai-os && git pull && ./deploy.sh"

      - name: Deployment notification
        run: |
          echo "::notice::Deployment to production completed successfully"
