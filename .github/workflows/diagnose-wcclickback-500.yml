name: Diagnose wc-clickback 500

on:
  workflow_dispatch:

jobs:
  diag:
    name: Trigger wc-clickback and capture traceback
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 500 and capture backend traceback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Trigger wc-clickback no-signature (reproduce 500) ==="
            curl -s -X POST "http://127.0.0.1:8000/api/v1/wc-clickback/webhook" \
              -H "Content-Type: application/json" \
              -d '{"product_id":"00000000-0000-0000-0000-000000000001","event_type":"click"}' \
              --max-time 8 -w "\nHTTP_CODE=%{http_code}\n" || echo "curl failed"

            echo ""
            echo "=== 2. Backend error log (last traceback) ==="
            sudo journalctl -u nuotao-backend --no-pager -n 80 2>/dev/null | grep -iE "traceback|error|exception|wc_clickback|clickback|line [0-9]+|File \"" | tail -40

            echo ""
            echo "=== 3. Full last 30 journal lines (context) ==="
            sudo journalctl -u nuotao-backend --no-pager -n 30 2>/dev/null | tail -30
