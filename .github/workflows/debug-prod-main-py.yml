name: Debug Prod Main Py

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug production main.py and routes
    runs-on: ubuntu-latest
    steps:
      - name: Debug production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/nuotao/backend

            echo "=== 1. Production main.py (full) ==="
            cat app/main.py

            echo ""
            echo "=== 2. Production app routes via import ==="
            cat > /tmp/check_prod_routes.py << 'PYEOF'
            import sys
            sys.path.insert(0, '/opt/nuotao/backend')
            from app.main import app
            routes = [r.path for r in app.routes if hasattr(r, 'path')]
            print(f'Total routes: {len(routes)}')
            health = [r for r in routes if 'health' in r or 'ready' in r]
            print(f'Health routes: {health}')
            for r in routes:
                print(f'  {r}')
            PYEOF
            .venv/bin/python /tmp/check_prod_routes.py 2>&1

            echo ""
            echo "=== 3. Production actual curl test ==="
            for path in /api/v1/readyz /api/v1/healthz /docs; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "http://127.0.0.1:8000$path" || echo "000")
                echo "  $path -> HTTP $CODE"
            done
