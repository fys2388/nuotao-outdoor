name: Docker Restore API

# Emergency recovery: restart the production `api` container with the real
# Postgres credentials from the running worker container. After
# docker-redeploy-api rebuilt the api image, the new container exited with
# "password authentication failed for user nuotao". Root cause: rsync
# --delete removed /opt/nuotao/.env, so docker-compose.yml's DATABASE_URL
# template interpolated the default password. The worker container holds the
# real DATABASE_URL / POSTGRES_* in its environment, so launch the api with
# that env directly (compose env interpolation bypassed for the recovery),
# then restore .env so docker compose manages the container afterwards.

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore api container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eo pipefail
            PROJ=/opt/nuotao
            cd "$PROJ"
            echo "=== .env presence ==="
            ls -la .env 2>&1 || echo ".env MISSING"
            echo "=== worker DATABASE_URL (masked) ==="
            WDB=$(docker inspect nuotao-ai-os-worker-1 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^DATABASE_URL=' | head -1)
            echo "${WDB:0:28}...(masked)"
            echo "=== rebuild .env from worker env (POSTGRES/DATABASE/REDIS) ==="
            if [ -f .env ]; then cp .env .env.bak.$(date +%s); fi
            docker inspect nuotao-ai-os-worker-1 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
              | grep -E '^(POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_DB|POSTGRES_HOST|DATABASE_URL|REDIS_URL|ENVIRONMENT|DEBUG|LOG_LEVEL|JWT_SECRET_KEY|SECRET_KEY)=' \
              > .env.tmp
            # also copy all non-trivial worker env so api has same config as worker
            docker inspect nuotao-ai-os-worker-1 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
              | grep -vE '^(PATH|HOSTNAME|HOME|PWD|SHLVL|_|TERM|PYTHON_|GIT_|GITHUB_)' >> .env.tmp
            mv .env.tmp .env
            echo "new .env lines: $(wc -l < .env)"
            echo "=== .env key vars (masked) ==="
            grep -E '^(POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_DB|DATABASE_URL|REDIS_URL)' .env | sed 's|\(:[^:@]*@\)|:***@|;s|\(PASSWORD=.*\)|PASSWORD=***|'
            echo "=== remove failed api container ==="
            docker rm -f nuotao-ai-os-api-1 2>/dev/null || echo "no api container"
            echo "=== recreate api via compose (uses .env now) ==="
            docker compose -f docker-compose.yml up -d --no-deps api 2>&1 || echo "(compose up failed)"
            echo "=== wait + check port ==="
            sleep 18
            if ss -tln | grep -q ':8000'; then
              echo "PORT 8000 UP via compose"
            else
              echo "PORT 8000 still down; fallback: docker run with worker env"
              docker rm -f nuotao-ai-os-api-1 2>/dev/null || true
              WENV=$(docker inspect nuotao-ai-os-worker-1 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -vE '^(PATH|HOSTNAME|HOME|PWD|SHLVL|_|TERM|PYTHON_|GIT_|GITHUB_)')
              ARGS=""
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                ARGS="$ARGS -e $line"
              done <<< "$WENV"
              docker run -d --name nuotao-ai-os-api-1 \
                --network nuotao-network --restart unless-stopped \
                $ARGS \
                nuotao-ai-os-api:latest \
                sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000" 2>&1 || echo "(docker run failed)"
              sleep 15
            fi
            echo "=== final status ==="
            docker compose -f docker-compose.yml ps api 2>&1 || true
            echo "=== api logs tail ==="
            docker logs --tail 30 nuotao-ai-os-api-1 2>&1 | tail -30
            echo "=== port 8000 ==="
            ss -tlnp | grep 8000 || echo "port 8000 not listening"
