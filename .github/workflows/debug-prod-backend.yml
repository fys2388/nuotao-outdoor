name: Debug Prod Backend

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug production backend service
    runs-on: ubuntu-latest
    steps:
      - name: Debug production backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Production backend service status ==="
            systemctl status nuotao-backend --no-pager | head -15

            echo ""
            echo "=== 2. Production backend logs (last 40) ==="
            journalctl -u nuotao-backend --no-pager -n 40

            echo ""
            echo "=== 3. Check port 8000 ==="
            ss -tlnp | grep ':8000' || echo "Port 8000 not listening"

            echo ""
            echo "=== 4. Check process ==="
            ps aux | grep uvicorn | grep -v grep || echo "No uvicorn process"

            echo ""
            echo "=== 5. Try restart ==="
            systemctl restart nuotao-backend
            sleep 5
            systemctl status nuotao-backend --no-pager | head -10

            echo ""
            echo "=== 6. Test after restart ==="
            curl -s -w "\nHTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8000/api/v1/readyz 2>&1
            curl -s -w "\nHTTP %{http_code}\n" --max-time 5 http://127.0.0.1:8000/docs 2>&1
