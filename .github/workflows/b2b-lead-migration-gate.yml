name: B2B Lead Migration Gate (M440)

# Owner 授权（APR-M440-DB-001）下的 B2B Lead 迁移门禁，三步分开执行：
#   phase=preflight  ：只读前置检查（绝不改动数据库）。
#   phase=migrate    ：执行 0085/0086 迁移（Owner 已批；前置检查须先通过）。
#   phase=postverify ：迁移后只读独立验证。
# 生产访问：PostgreSQL 在 docker 容器 nuotao-ai-os-postgres-1，
# 镜像用 POSTGRES_USER 覆盖了默认 postgres 角色 → 从容器 env 探测角色名。
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'preflight = 只读前置检查；migrate = 执行迁移；postverify = 只读迁移后验证'
        type: choice
        options:
          - preflight
          - migrate
          - postverify
        default: preflight

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  gate:
    name: ${{ inputs.phase }} gate
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run ${{ inputs.phase }}
        id: gate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 900s
          script: |
            set -uo pipefail
            PGC=nuotao-ai-os-postgres-1
            PGU=$(docker exec "$PGC" sh -c 'printenv POSTGRES_USER' 2>/dev/null | head -1)
            [ -z "${PGU:-}" ] && PGU=postgres
            echo "PG_CONTAINER=$PGC PG_USER=$PGU"
            PSQL="docker exec $PGC psql -U $PGU -d nuotao -tAc"
            PSQLT="docker exec $PGC psql -U $PGU -d nuotao -c"
            echo "=== M440 ${{ inputs.phase }} start: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

            echo "=== [0] 生产连通性 ==="
            $PSQL "SELECT 'db=' || current_database() || ' recovery=' || pg_is_in_recovery();" || echo "DB_CHECK_FAILED"

            echo "=== [1] Alembic revision ==="
            $PSQL "SELECT 'current_revision=' || version_num FROM alembic_version;" || echo "REVISION_READ_FAILED"

            if [ "${{ inputs.phase }}" = "preflight" ]; then
              echo "=== [2] 库大小 / 表数 ==="
              $PSQL "SELECT pg_size_pretty(pg_database_size(current_database()));"
              $PSQL "SELECT 'table_count=' || COUNT(*) FROM information_schema.tables WHERE table_schema='public';"

              echo "=== [3] b2b_leads 基线 ==="
              $PSQL "SELECT 'lead_total=' || COUNT(*) FROM b2b_leads;"
              $PSQL "SELECT 'lead_null_email=' || COUNT(*) FROM b2b_leads WHERE email IS NULL;"
              $PSQL "SELECT 'lead_null_status=' || COUNT(*) FROM b2b_leads WHERE status IS NULL;"
              $PSQL "SELECT 'lead_null_created_at=' || COUNT(*) FROM b2b_leads WHERE created_at IS NULL;"
              echo "--- 状态值分布 ---"
              $PSQLT "SELECT status, COUNT(*) FROM b2b_leads GROUP BY status ORDER BY status;"

              echo "=== [4] 状态约束兼容性检查（非空即存在非法状态，必须为空）==="
              $PSQLT "
              SELECT status, COUNT(*) AS n
              FROM b2b_leads
              WHERE status NOT IN (
                'new','assigned','contacted','qualified','quoting','quoted',
                'negotiating','converted','closed_won','closed_lost','spam'
              )
              GROUP BY status ORDER BY status;"

              echo "=== [5] 测试 Lead 存在性（APR-M440-DATA-001，必须恰好 2 条）==="
              $PSQL "
              SELECT reference_number || ' | id=' || id || ' | status=' || COALESCE(status,'NULL')
                     || ' | is_test_col_exists=' || (SELECT COUNT(*) FROM information_schema.columns
                        WHERE table_name='b2b_leads' AND column_name='is_test')
                     || ' | updated_at=' || COALESCE(updated_at::text,'NULL')
              FROM b2b_leads
              WHERE reference_number IN ('LD-20261117-6B43B6','LD-20261117-3ECF02');"
              $PSQL "SELECT 'matched_count=' || COUNT(*) FROM b2b_leads WHERE reference_number IN ('LD-20261117-6B43B6','LD-20261117-3ECF02');"

              echo "=== [6] 备份验证 ==="
              ls -lht /opt/nuotao/backups 2>/dev/null | head -8 || echo "no /opt/nuotao/backups"
              $PSQL "SELECT 'wal_lsn=' || pg_current_wal_lsn();"

              echo "=== [7] 迁移执行能力诊断（决定 migrate 阶段用哪条路径）==="
              echo "--- 宿主 venv alembic ---"
              ls -la /opt/nuotao/backend/.venv/bin/alembic 2>/dev/null || echo "venv alembic MISSING"
              echo "--- which alembic ---"
              command -v alembic 2>/dev/null || echo "no alembic on PATH"
              echo "--- 容器列表 ---"
              docker ps --format '{{.Names}} {{.Image}} {{.Status}}' 2>/dev/null | head -12
              echo "--- 容器内是否有 alembic ---"
              for c in nuotao-ai-os-scheduler-1 nuotao-ai-os-api-1 nuotao-ai-os-backend-1 nuotao-ai-os-app-1; do
                echo -n "$c: "
                docker exec "$c" sh -lc 'command -v alembic || ls /app/alembic.ini 2>/dev/null || echo none' 2>/dev/null || echo "container not found"
              done
            elif [ "${{ inputs.phase }}" = "migrate" ]; then
              set -e
              echo "=== 迁移前再次确认 revision 与 pending ==="
              CUR_BEFORE=$($PSQL "SELECT version_num FROM alembic_version;" | tr -d '[:space:]')
              echo "CURRENT_REVISION_BEFORE=$CUR_BEFORE"
              if [ "$CUR_BEFORE" != "0084" ] && [ "$CUR_BEFORE" != "0085" ]; then
                echo "PREFLIGHT_MISMATCH: expected 0084 or 0085 but got $CUR_BEFORE -> STOP"
                printf 'verdict=stopped\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$CUR_BEFORE" = "0085" ]; then
                echo "NOTE: 0085 已应用（上一轮 0086 失败回滚），本轮仅应用 0086。"
              fi

              echo "=== 迁移前置：生产代码（/opt/nuotao-ai-os）中的迁移文件核对 ==="
              CODE_ROOT=/opt/nuotao-ai-os
              ls -la "$CODE_ROOT/backend/alembic/versions/0085_b2b_lead_workflow.py" \
                     "$CODE_ROOT/backend/alembic/versions/0086_b2b_lead_quotes.py" 2>&1 \
                || { echo "MIGRATION_FILES_MISSING: 生产代码无 0085/0086 -> STOP"; printf 'verdict=stopped\n' >> "$GITHUB_OUTPUT"; exit 0; }
              echo "--- 生产代码 HEAD ---"
              git -C "$CODE_ROOT" log -1 --oneline 2>&1 || true

              # 连接串来源：优先 backend/.env，其次旧目录
              if [ -f "$CODE_ROOT/backend/.env" ] && grep -q '^DATABASE_URL=' "$CODE_ROOT/backend/.env"; then
                ENV_FILE="$CODE_ROOT/backend/.env"
              elif [ -f /opt/nuotao/backend/.env ] && grep -q '^DATABASE_URL=' /opt/nuotao/backend/.env; then
                ENV_FILE=/opt/nuotao/backend/.env
              else
                echo "DATABASE_URL_MISSING: 未找到含 DATABASE_URL 的 .env -> STOP"
                printf 'verdict=stopped\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "ENV_FILE=$ENV_FILE"
              DBU=$(grep '^DATABASE_URL=' "$ENV_FILE" | cut -d'=' -f2- \
                | sed 's/+asyncpg//; s|://localhost:|://postgres:|g; s|://127.0.0.1:|://postgres:|g')
              if [ -z "${DBU:-}" ]; then
                echo "DATABASE_URL_MISSING: $ENV_FILE 无 DATABASE_URL -> STOP"
                printf 'verdict=stopped\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "DATABASE_URL_USER_HOST_MASKED=$(echo "$DBU" | sed -E 's#(postgresql[^:]*://[^:/]+):[^@]+@#(\1):***@#')"

              echo "=== 容器内代码头版本（对照）==="
              docker exec nuotao-ai-os-scheduler-1 sh -lc 'ls alembic/versions/ | tail -4' 2>&1 || true

              echo "=== 迁移执行路径选择 ==="
              VENV_ALEMBIC="$CODE_ROOT/backend/.venv/bin/alembic"
              ls -la "$VENV_ALEMBIC" 2>&1 || echo "host venv alembic MISSING"
              # 宿主机后端 Python 环境用 psycopg，连接串为 localhost:5432（容器已做端口映射）；
              # scheduler 镜像只装了 asyncpg，缺 psycopg，故优先走宿主 venv。
              if [ -x "$VENV_ALEMBIC" ]; then
                echo "=== 执行迁移（宿主 venv alembic）==="
                cd "$CODE_ROOT/backend"
                "$VENV_ALEMBIC" heads 2>&1
                echo "--- upgrade ---"
                "$VENV_ALEMBIC" upgrade head 2>&1
                MIG_RC=$?
              else
                echo "=== 执行迁移（docker run：挂载生产代码 + 补装 psycopg）==="
                docker run --rm \
                  --network container:nuotao-ai-os-scheduler-1 \
                  -v "$CODE_ROOT/backend":/app -w /app \
                  -e "DATABASE_URL=$DBU" \
                  nuotao-ai-os-scheduler:latest \
                  sh -lc 'pip install --quiet "psycopg[binary]" >/dev/null 2>&1 || pip install --quiet psycopg >/dev/null 2>&1; alembic upgrade head' 2>&1
                MIG_RC=$?
              fi
              echo "MIGRATE_RC=$MIG_RC"
              if [ "$MIG_RC" != "0" ]; then
                echo "MIGRATION_FAILED: 保留证据，不手工改 revision、不 stamp -> STOP"
                printf 'verdict=failed\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi

              CUR_AFTER=$($PSQL "SELECT version_num FROM alembic_version;" | tr -d '[:space:]')
              echo "CURRENT_REVISION_AFTER=$CUR_AFTER"
              if [ "$CUR_AFTER" != "0086" ]; then
                echo "MIGRATION_MISMATCH: expected 0086 but got $CUR_AFTER -> 保留证据，人工介入"
              else
                echo "MIGRATION_OK: 0084 -> 0086"
              fi
            else
              echo "=== [6] postverify：迁移后结构验证 ==="
              $PSQL "SELECT 'current_revision=' || version_num FROM alembic_version;"
              echo "--- b2b_lead_quotes ---"
              $PSQL "SELECT 'quotes_table_exists=' || (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='b2b_lead_quotes');"
              $PSQL "SELECT 'quotes_rows=' || COUNT(*) FROM b2b_lead_quotes;"
              $PSQL "SELECT 'quote_index=' || indexname FROM pg_indexes WHERE tablename='b2b_lead_quotes' ORDER BY indexname;"
              echo "--- b2b_leads 新增列 ---"
              $PSQL "
              SELECT column_name || ':' || data_type
              FROM information_schema.columns
              WHERE table_schema='public' AND table_name='b2b_leads'
                AND column_name IN ('trace_id','is_test','notify_status','notify_attempts','notify_last_error','notified_at','closed_won_reason')
              ORDER BY column_name;"
              echo "--- 状态 CHECK 约束定义 ---"
              $PSQL "
              SELECT conname || ' => ' || pg_get_constraintdef(oid)
              FROM pg_constraint
              WHERE conrelid='b2b_leads'::regclass AND contype='c' ORDER BY conname;"
              echo "--- Lead 完整性复核（应仍为 2 条）---"
              $PSQL "SELECT 'lead_total=' || COUNT(*) FROM b2b_leads;"
              $PSQL "
              SELECT 'matched_count=' || COUNT(*) FROM b2b_leads
              WHERE reference_number IN ('LD-20261117-6B43B6','LD-20261117-3ECF02');"
              echo "--- 经营统计排除验证（排除 is_test 与 spam）---"
              $PSQL "
              SELECT 'valid_leads=' || COUNT(*) FROM b2b_leads
              WHERE is_test IS DISTINCT FROM true AND status <> 'spam';"
            fi

            echo "=== M440 gate end: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "GATE_PHASE=${{ inputs.phase }}"
            printf 'verdict=checked\n' >> "$GITHUB_OUTPUT"
            exit 0
