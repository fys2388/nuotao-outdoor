name: Debug Staging Openapi2

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug staging openapi and logs
    runs-on: ubuntu-latest
    steps:
      - name: Debug staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Staging logs (last 20) ==="
            journalctl -u nuotao-backend-staging --no-pager -n 20

            echo ""
            echo "=== 2. Openapi paths count ==="
            curl -s --max-time 5 http://127.0.0.1:8001/openapi.json | /opt/nuotao/staging/backend/.venv/bin/python -c "
            import sys, json
            try:
                d = json.load(sys.stdin)
                paths = list(d.get('paths', {}).keys())
                print(f'Total paths: {len(paths)}')
                health = [p for p in paths if 'health' in p.lower() or 'ready' in p.lower()]
                print(f'Health paths: {health}')
                print('First 10 paths:')
                for p in paths[:10]: print(f'  {p}')
            except Exception as e:
                print(f'Error: {e}')
            " 2>&1

            echo ""
            echo "=== 3. Check router.py health line ==="
            grep -n "health" /opt/nuotao/staging/backend/app/api/v1/router.py | head -5

            echo ""
            echo "=== 4. Check main.py include_router line ==="
            grep -n "include_router" /opt/nuotao/staging/backend/app/main.py

            echo ""
            echo "=== 5. Check FastAPI version ==="
            /opt/nuotao/staging/backend/.venv/bin/python -c "import fastapi; print(f'FastAPI: {fastapi.__version__}')"

            echo ""
            echo "=== 6. Direct import test on staging ==="
            cd /opt/nuotao/staging/backend
            .venv/bin/python -c "
            import sys
            sys.path.insert(0, '.')
            from app.main import app
            routes = [r.path for r in app.routes if hasattr(r, 'path')]
            print(f'Import routes: {len(routes)}')
            health = [r for r in routes if 'health' in r or 'ready' in r]
            print(f'Health routes: {health}')
            " 2>&1 | tail -5
