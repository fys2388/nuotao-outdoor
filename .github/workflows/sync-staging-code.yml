name: Sync Staging Code

on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync latest code to staging
    runs-on: ubuntu-latest
    steps:
      - name: Sync code to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Stop staging service ==="
            systemctl stop nuotao-backend-staging

            echo ""
            echo "=== 2. Sync code from production to staging ==="
            rsync -av --delete \
              --exclude '.venv' \
              --exclude '.env' \
              --exclude '__pycache__' \
              --exclude '*.pyc' \
              --exclude 'data' \
              --exclude 'logs' \
              /opt/nuotao/backend/ /opt/nuotao/staging/backend/

            echo ""
            echo "=== 3. Reinstall dependencies ==="
            cd /opt/nuotao/staging/backend
            .venv/bin/pip install -e . --quiet 2>&1 | tail -3

            echo ""
            echo "=== 4. FastAPI version ==="
            .venv/bin/python -c "import fastapi; print(f'FastAPI: {fastapi.__version__}')"

            echo ""
            echo "=== 5. Start staging service ==="
            systemctl start nuotao-backend-staging
            sleep 5
            systemctl status nuotao-backend-staging --no-pager | head -8

            echo ""
            echo "=== 6. Test staging endpoints ==="
            for path in /api/v1/readyz /api/v1/healthz /docs; do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:8001$path" || echo "000")
                echo "  $path -> HTTP $CODE"
            done

            echo ""
            echo "=== 7. Readyz response ==="
            curl -s --max-time 5 http://127.0.0.1:8001/api/v1/readyz
            echo ""
