# Secret scanning gate — added 2026-10-11 after the WooCommerce API key leak.
#
# Runs gitleaks (the same engine GitGuardian uses) on every push and PR.
# PRs are scanned against the base branch so only *new* secrets fail the build.
name: Secret Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Keep concurrency bounded; a stale scan of a superseded commit is useless.
concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "diff" = new lines only (fast, runs on PRs)
        # "full" = whole history (slow, runs on main)
        mode: [diff]
        include:
          - mode: diff
            extra-args: "--log-opts=--unified=0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK (trufflehog)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run gitleaks on new changes
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
        with:
          target: diff

      # ------------------------------------------------------------------
      # Second detector: trufflehog. Gitleaks and trufflehog use different
      # detection strategies, so running both catches what either misses.
      # ------------------------------------------------------------------
      - name: Run trufflehog on new changes
        run: |
          go install github.com/trufflesecurity/trufflehog/v3@latest
          ~/go/bin/trufflehog git file://. --since-commit ${{ github.event.before }} \
            --only-verified --json --fail
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true

      # ------------------------------------------------------------------
      # Full-history scan on the default branch. This is what would have
      # caught the 2026-10-11 leak; it runs nightly in the schedule job below.
      # ------------------------------------------------------------------
  history:
    name: Full history scan (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks over all history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
        with:
          target: full
