name: P1 Business Validation

on:
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Business Validation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== P1 BUSINESS VALIDATION ==="
            echo "Timestamp: $(date -u)"
            echo ""
            
            # Use peer authentication (verified working in earlier workflows)
            PSQL="sudo -u postgres psql -d nuotao -tAc"
            
            echo "--- 1. Total Products ---"
            $PSQL "SELECT COUNT(*) FROM products"
            echo ""
            
            echo "--- 2. Cost Coverage ---"
            $PSQL "SELECT COUNT(DISTINCT product_id) FROM product_cost"
            echo ""
            
            echo "--- 3. Cost Status Distribution ---"
            $PSQL "
            SELECT 
                CASE 
                    WHEN EXISTS (SELECT 1 FROM product_cost pc WHERE pc.product_id = p.id) 
                    THEN 'HAS_COST'
                    ELSE 'NO_COST'
                END as status,
                COUNT(*) as count
            FROM products p
            GROUP BY status
            ORDER BY count DESC
            "
            echo ""
            
            echo "--- 4. Cost Gap Analysis ---"
            $PSQL "
            SELECT 
                CASE 
                    WHEN total_landed_cost = 0 OR total_landed_cost IS NULL THEN 'ZERO_OR_NULL'
                    WHEN total_landed_cost > 0 THEN 'HAS_COST'
                    ELSE 'UNKNOWN'
                END as gap_type,
                COUNT(*) as count
            FROM product_cost
            GROUP BY gap_type
            ORDER BY count DESC
            "
            echo ""
            
            echo "--- 5. Batch Fill Activity ---"
            $PSQL "
            SELECT 
                COUNT(*) as total_batch_fills,
                MAX(created_at) as last_fill
            FROM event_log
            WHERE event_type = 'product.cost.batch_filled'
            "
            echo ""
            
            echo "--- 6. Cost Update Activity ---"
            $PSQL "
            SELECT 
                COUNT(*) as total_updates,
                MAX(created_at) as last_update
            FROM event_log
            WHERE event_type = 'product.cost.updated'
            "
            echo ""
            
            echo "--- 7. Products Missing Cost (Need Batch Fill) ---"
            $PSQL "
            SELECT COUNT(*) 
            FROM products p
            LEFT JOIN product_cost pc ON pc.product_id = p.id
            WHERE pc.total_landed_cost = 0 OR pc.total_landed_cost IS NULL OR pc.id IS NULL
            "
            echo ""
            
            echo "--- 8. Top 10 Products Missing Cost ---"
            $PSQL "
            SELECT 
                p.sku,
                LEFT(p.name, 50) as name,
                p.created_at
            FROM products p
            LEFT JOIN product_cost pc ON pc.product_id = p.id
            WHERE pc.total_landed_cost = 0 OR pc.total_landed_cost IS NULL OR pc.id IS NULL
            ORDER BY p.created_at DESC
            LIMIT 10
            "
            echo ""
            
            echo "--- 9. Category Cost Coverage ---"
            $PSQL "
            SELECT 
                COALESCE(p.category_name, 'NONE') as category,
                COUNT(*) as total_products,
                COUNT(CASE WHEN pc.total_landed_cost > 0 THEN 1 END) as with_cost,
                ROUND(COUNT(CASE WHEN pc.total_landed_cost > 0 THEN 1 END) * 100.0 / COUNT(*), 2) as coverage_pct
            FROM products p
            LEFT JOIN product_cost pc ON pc.product_id = p.id
            GROUP BY p.category_name
            ORDER BY total_products DESC
            LIMIT 15
            "
            echo ""
            
            echo "--- 10. Profit Analysis Coverage ---"
            $PSQL "
            SELECT 
                COUNT(DISTINCT product_id) as products_with_valid_cost
            FROM product_cost
            WHERE total_landed_cost > 0
            "
            echo ""
            
            echo "=== BUSINESS VALIDATION COMPLETE ==="
