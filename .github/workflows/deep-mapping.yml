name: M420 Deep mapping audit (read-only)

# 只读：彻查 12 款 WC 已上架产品（2549-2864）在 nuotao 系统的映射/记录情况。
# 1) product_mappings 全表（nuotao_product_id <-> woocommerce_id）
# 2) products 表 woocommerce_id IN (WC 12) 的所有行（含 deleted）
# 3) products 表 sku IN (WC 12 sku) 的所有行（含 deleted）
# 4) products 表 name 含 WC 关键词的行（含 deleted）
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deep-mapping.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Deep mapping audit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            source .venv/bin/activate
            cat > /tmp/deep_mapping.py << 'PYEOF'
            import asyncio
            from sqlalchemy import text
            from sqlalchemy.ext.asyncio import create_async_engine
            from app.core.config import get_settings

            s = get_settings()
            WC_IDS = "'2864','2838','2818','2785','2763','2743','2698','2687','2669','2593','2565','2549'"
            WC_SKUS = "'NT-964465929482','NT-1069165833761','NT-799401169116','NT-818076845448'," \
                      "'NT-746435358585','NT-986492089515','NT-1054599709111','NT-972602197791'," \
                      "'NT-NUOTAO-OUTDOO-844058953087','NT-NUOTAO-LIGHTW-1043302973575'," \
                      "'NT-NUOTAO-MINI-6036357257500','NT-NUOTAO-WATERP-6127048821365'"
            # 名称关键词（WC 产品名子串）
            NAME_KW = ["MH1","Snow Gaiter","Sleeping Pad","Water Filter","Moon Chair","Backpack",
                       "Work Light","Dry Bag","Titanium","Storage Bag","Crampon","Sleeping Bag Liner"]

            async def main():
                engine = create_async_engine(s.database_url)
                async with engine.connect() as conn:
                    print("===== DEEP BEGIN =====")
                    # 1) product_mappings 全表
                    rows = (await conn.execute(text(
                        "SELECT nuotao_product_id, woocommerce_id, created_at FROM product_mappings ORDER BY created_at"
                    ))).fetchall()
                    print(f"[mappings] count={len(rows)}")
                    for r in rows:
                        print(f"  nuotao={r[0]} wc={r[1]} at={r[2]}")
                    # 2) products woocommerce_id IN (含 deleted)
                    rows2 = (await conn.execute(text(
                        f"SELECT id, sku, name, deleted_at IS NOT NULL AS del, "
                        f"COALESCE(meta->>'woocommerce_id','') AS wcid "
                        f"FROM products WHERE COALESCE(meta->>'woocommerce_id','') IN ({WC_IDS}) ORDER BY wcid"
                    ))).fetchall()
                    print(f"[products_by_wcid] count={len(rows2)}")
                    for r in rows2:
                        print(f"  id={r[0]} wc={r[4]} del={r[3]} sku={r[1]} name={r[2][:40]}")
                    # 3) products sku IN (含 deleted)
                    rows3 = (await conn.execute(text(
                        f"SELECT id, sku, name, deleted_at IS NOT NULL AS del, "
                        f"COALESCE(meta->>'woocommerce_id','') AS wcid "
                        f"FROM products WHERE sku IN ({WC_SKUS}) ORDER BY sku"
                    ))).fetchall()
                    print(f"[products_by_sku] count={len(rows3)}")
                    for r in rows3:
                        print(f"  id={r[0]} wc={r[4]} del={r[3]} sku={r[1]} name={r[2][:40]}")
                    # 4) name 关键词匹配
                    for kw in NAME_KW:
                        rows4 = (await conn.execute(text(
                            "SELECT id, sku, deleted_at IS NOT NULL AS del, "
                            "COALESCE(meta->>'woocommerce_id','') AS wcid, name "
                            "FROM products WHERE name ILIKE :kw ORDER BY name LIMIT 3"
                        ), {"kw": f"%{kw}%"})).fetchall()
                        if rows4:
                            print(f"[name_kw={kw}] count={len(rows4)}")
                            for r in rows4:
                                print(f"  id={r[0]} wc={r[3]} del={r[2]} sku={r[1]} name={r[4][:40]}")
                await engine.dispose()

            asyncio.run(main())
            PYEOF
            python3 /tmp/deep_mapping.py 2>&1 | grep -E "DEEP BEGIN|\[mappings\]|\[products_by_|\[name_kw=|id=|nuotao="
            rm -f /tmp/deep_mapping.py