name: Debug Nginx Locations

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Nginx locations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "=== 所有 location 行 ==="
            grep -n "location" /etc/nginx/sites-available/nuotao
            
            echo ""
            echo "=== 所有 server 行 ==="
            grep -n "server" /etc/nginx/sites-available/nuotao
            
            echo ""
            echo "=== 所有 listen 行 ==="
            grep -n "listen" /etc/nginx/sites-available/nuotao
            
            echo ""
            echo "=== 所有 root 行 ==="
            grep -n "root" /etc/nginx/sites-available/nuotao
            
            echo ""
            echo "=== 所有 proxy_pass 行 ==="
            grep -n "proxy_pass" /etc/nginx/sites-available/nuotao
            
            echo ""
            echo "=== 所有 try_files 行 ==="
            grep -n "try_files" /etc/nginx/sites-available/nuotao
            
            echo ""
            echo "=== 文件总行数 ==="
            wc -l /etc/nginx/sites-available/nuotao
