name: M420 Dump showcase product rows (read-only)

# 只读：导出 12 款启用产品的完整定位字段（不含凭证、不含敏感），
# 提取 meta/attributes 中疑似 WC 关联键，用于确定与 WC 产品的映射。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dump-showcase.yml"

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump showcase products
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            source .venv/bin/activate
            cat > /tmp/dump_showcase.py << 'PYEOF'
            import asyncio, json, re
            from sqlalchemy import text
            from sqlalchemy.ext.asyncio import create_async_engine
            from app.core.config import get_settings

            s = get_settings()

            def meta_keys(d):
                if not isinstance(d, dict): return []
                return list(d.keys())

            def find_wc_hints(d):
                hints = []
                if isinstance(d, dict):
                    for k, v in d.items():
                        kl = k.lower()
                        if any(t in kl for t in ("wc", "woo", "source", "external", "platform", "sync")):
                            hints.append((k, (str(v)[:60] if not isinstance(v, (dict, list)) else type(v).__name__)))
                return hints

            async def main():
                engine = create_async_engine(s.database_url)
                async with engine.connect() as conn:
                    rows = (await conn.execute(text(
                        "SELECT id, sku, name, source_offer_id, source_url, category, "
                        "meta::text, attributes::text "
                        "FROM products WHERE b2b_showcase_enabled = true AND deleted_at IS NULL "
                        "ORDER BY id"
                    ))).fetchall()
                    print("===== DUMP BEGIN =====")
                    print("count=", len(rows))
                    for r in rows:
                        pid, sku, name, offer, s_url, cat, meta_txt, attr_txt = r
                        meta = json.loads(meta_txt) if meta_txt else {}
                        attr = json.loads(attr_txt) if attr_txt else {}
                        wc_hints = find_wc_hints(meta) + find_wc_hints(attr)
                        print(f"--- id={pid} sku={sku}")
                        print(f"    name={name}")
                        print(f"    offer_id={offer} source_url={s_url} cat={cat}")
                        print(f"    meta_keys={meta_keys(meta)}")
                        print(f"    wc_hints={wc_hints}")
                await engine.dispose()

            asyncio.run(main())
            PYEOF
            python3 /tmp/dump_showcase.py 2>&1 | grep -E "count=|^---|name=|offer_id=|meta_keys=|wc_hints="
            rm -f /tmp/dump_showcase.py