name: Fix Nginx Final

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Run fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cp /etc/nginx/sites-available/nuotao /etc/nginx/sites-available/nuotao.bak4
            python3 -c "
import re
p = '/etc/nginx/sites-available/nuotao'
c = open(p).read()
c = re.sub(r'\n?\s*#.*[Oo]ps.*[Dd]ashboard.*?\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}', '', c, flags=re.DOTALL)
c = re.sub(r'\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}', '', c, flags=re.DOTALL)
new = '\n    location ^~ /ops-dashboard/ {\n        alias /opt/nuotao/ops-dashboard/;\n        index index.html;\n        try_files \$uri \$uri/ /ops-dashboard/index.html;\n    }\n'
m = re.search(r'server\s*\{', c)
if m:
    pos = c.find('\n', m.end()) + 1
    c = c[:pos] + new + c[pos:]
open(p, 'w').write(c)
print('done')
"
            nginx -t && systemctl reload nginx
            sleep 3
            curl -s -o /tmp/t.html -w "HTTP:%{http_code} SIZE:%{size_download}\n" http://localhost:80/ops-dashboard/
            grep -c "运营监控中心" /tmp/t.html && echo "SUCCESS" || echo "FAIL"
