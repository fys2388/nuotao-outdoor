name: Debug Staging Uvicorn

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug staging uvicorn version and startup
    runs-on: ubuntu-latest
    steps:
      - name: Debug staging uvicorn
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 1. Uvicorn version comparison ==="
            echo "Production:"
            /opt/nuotao/backend/.venv/bin/uvicorn --version
            echo "Staging:"
            /opt/nuotao/staging/backend/.venv/bin/uvicorn --version

            echo ""
            echo "=== 2. FastAPI version comparison ==="
            echo "Production:"
            /opt/nuotao/backend/.venv/bin/python -c "import fastapi; print(fastapi.__version__)"
            echo "Staging:"
            /opt/nuotao/staging/backend/.venv/bin/python -c "import fastapi; print(fastapi.__version__)"

            echo ""
            echo "=== 3. Staging uvicorn full startup log ==="
            journalctl -u nuotao-backend-staging --no-pager -n 50 --no-hostname

            echo ""
            echo "=== 4. Test uvicorn with explicit app path ==="
            cd /opt/nuotao/staging/backend
            timeout 8 .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8003 --workers 1 --log-level debug 2>&1 &
            sleep 5
            curl -s --max-time 3 http://127.0.0.1:8003/openapi.json | .venv/bin/python -c "
            import sys, json
            try:
                d = json.load(sys.stdin)
                paths = list(d.get('paths', {}).keys())
                print(f'Port 8003 paths: {len(paths)}')
            except Exception as e:
                print(f'Error: {e}')
            " 2>&1
            kill %1 2>/dev/null || true

            echo ""
            echo "=== 5. Check if there is a different app module ==="
            find /opt/nuotao/staging -name "main.py" -type f 2>/dev/null
            find /opt/nuotao/staging -name "*.pth" -type f 2>/dev/null
            cat /opt/nuotao/staging/backend/.venv/lib/python3.14/site-packages/*.pth 2>/dev/null | head -10

            echo ""
            echo "=== 6. Check editable install ==="
            /opt/nuotao/staging/backend/.venv/bin/pip show nuotao-ai-os-backend 2>&1 | head -10
