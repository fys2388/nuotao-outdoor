name: M420 Verify WC creds from backup (read-only)

# 只读验证：读取 20261106 备份 env 的 WC 凭证（仅内存使用，不输出值），
# 调用 WC API 确认是否有效。只输出 HTTP 状态码与命中产品数。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-wc-creds.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify WC creds from backup env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "===== VERIFY BEGIN ====="
            BK=/opt/nuotao-ai-os/backups/pre_deploy_20261106_050503/backend.env
            if [ ! -f "$BK" ]; then echo "  MISSING backup: $BK"; exit 0; fi
            # 在内存中读取凭证，不输出
            WCBASE=$(grep -E "^WOOCOMMERCE_BASE_URL=" "$BK" | head -1 | cut -d= -f2-)
            WCKEY=$(grep -E "^WOOCOMMERCE_CONSUMER_KEY=" "$BK" | head -1 | cut -d= -f2-)
            WCSEC=$(grep -E "^WOOCOMMERCE_CONSUMER_SECRET=" "$BK" | head -1 | cut -d= -f2-)
            # 占位符检测（只报 bool）
            if echo "$WCBASE" | grep -qE '[\${]'; then PH_BASE=True; else PH_BASE=False; fi
            if echo "$WCKEY" | grep -qE '[\${]'; then PH_KEY=True; else PH_KEY=False; fi
            echo "  backup_exists=True base_placeholder=${PH_BASE} key_placeholder=${PH_KEY} base_len=${#WCBASE}"
            if [ "$PH_BASE" = "True" ] || [ "$PH_KEY" = "True" ] || [ -z "$WCBASE" ] || [ -z "$WCKEY" ]; then
              echo "  SKIP: backup contains placeholder/empty creds"
              exit 0
            fi
            # 调 WC API（只输出状态码 + 命中数）
            OUT=$(curl -s -o /tmp/wcresp.json -w "%{http_code}" -u "$WCKEY:$WCSEC" "${WCBASE%/}/wp-json/wc/v3/products?per_page=1")
            echo "  HTTP_STATUS=$OUT"
            if [ "$OUT" = "200" ]; then
              CNT=$(python3 -c "import json;print(len(json.load(open('/tmp/wcresp.json'))))" 2>/dev/null || echo "?")
              echo "  products_hit=$CNT"
            fi
            rm -f /tmp/wcresp.json
            echo "===== VERIFY END ====="