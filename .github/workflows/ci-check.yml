name: CI Pre-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend · syntax + imports + smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q app
      - name: App internal import integrity
        run: python scripts/check_app_imports.py
      - name: FastAPI app smoke
        run: python -c "import app.main as m; assert m.app is not None; assert m.settings is not None; print('SMOKE OK')"
      - name: Ruff lint
        run: ruff check app tests
      - name: Unit tests (SQLite in-memory, no external deps)
        run: pytest tests/ --ignore=tests/integration -q --no-header -p no:warnings
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit -q
          pip-audit --desc on || true

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: npm audit (high+ critical)
        run: npm audit --audit-level=high || true
