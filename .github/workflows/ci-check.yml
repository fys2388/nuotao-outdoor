name: CI Pre-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend · syntax + imports + smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # CI runner 无 .env；app.core.security 在 import 时即读取 JWT_SECRET_KEY，
    # 缺它会抛 RuntimeError 导致 check_app_imports 全模块失败。
    # 这里提供 CI 专用测试值（不连真实生产，仅让导入完整性检查可运行）。
    env:
      JWT_SECRET_KEY: ${{ secrets.CI_TEST_JWT_KEY }}
      PII_HMAC_KEY: ${{ secrets.CI_TEST_PII_HMAC_KEY }}
      PII_ENCRYPTION_KEY: ${{ secrets.CI_TEST_PII_ENC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q app
      - name: App internal import integrity
        run: python scripts/check_app_imports.py
      - name: FastAPI app smoke
        run: python -c "import app.main as m; assert m.app is not None; assert m.settings is not None; print('SMOKE OK')"
      - name: Ruff lint
        run: |
          ruff check app tests --select F821,F811,E9  # critical: undefined name, redefinition, syntax error
          ruff check app tests --exit-zero  # full report (non-blocking)
      - name: Unit tests (SQLite in-memory, no external deps)
        run: pytest tests/ --ignore=tests/integration -q --no-header -p no:warnings
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit -q
          pip-audit --desc on || true

  postgres-concurrency:
    name: Backend · PostgreSQL dual-connection concurrency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # M4.2.0-R3.5: the SQLite job above CANNOT exercise a physical dual-connection
    # row-lock race (in-memory SQLite has no second writer). This dedicated job
    # provisions a real PostgreSQL service and runs the concurrency approval tests
    # against it, so the single-winner guarantee is verified under a genuine race,
    # not just the application-level invariant. The concurrency test skips unless
    # TEST_DATABASE_URL points at Postgres, so this job is where it actually runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuotao
          POSTGRES_PASSWORD: nuotao
          POSTGRES_DB: nuotao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuotao"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET_KEY: ${{ secrets.CI_TEST_JWT_KEY }}
      PII_HMAC_KEY: ${{ secrets.CI_TEST_PII_HMAC_KEY }}
      PII_ENCRYPTION_KEY: ${{ secrets.CI_TEST_PII_ENC_KEY }}
      TEST_DATABASE_URL: postgresql+asyncpg://nuotao:nuotao@localhost:5432/nuotao_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U nuotao; then echo "postgres ready"; break; fi
            sleep 2
          done
      - name: Dual-connection concurrent approval tests (real row locks)
        run: pytest tests/test_concurrency_approval_postgres.py -q --no-header -p no:warnings
      # M4.2.0 P0-2: the SQLite job cannot validate real migrations either. Run the
      # full Alembic upgrade/downgrade round-trip for 0090/0091 against this same
      # real PostgreSQL service. The test skips unless TEST_DATABASE_URL points at
      # Postgres, so (like the concurrency test above) it only truly runs here.
      - name: Alembic migration upgrade/downgrade round-trip (real PostgreSQL)
        run: pytest tests/test_m420_t05_pg_migration.py -q --no-header -p no:warnings

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: npm audit (high+ critical)
        run: npm audit --audit-level=high || true
