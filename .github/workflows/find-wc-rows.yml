name: M420 Find WC product rows (read-only)

# 只读：查 products 表中是否已有 WC 12 款 publish 产品（2549-2864）的记录。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/find-wc-rows.yml"

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Find WC product rows
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            source .venv/bin/activate
            cat > /tmp/find_wc_rows.py << 'PYEOF'
            import asyncio
            from sqlalchemy import text
            from sqlalchemy.ext.asyncio import create_async_engine
            from app.core.config import get_settings

            s = get_settings()
            WC_IDS = "'2864','2838','2818','2785','2763','2743','2698','2687','2669','2593','2565','2549'"
            WC_SKUS = "'NT-964465929482','NT-1069165833761','NT-799401169116','NT-818076845448'," \
                      "'NT-746435358585','NT-986492089515','NT-1054599709111','NT-972602197791'," \
                      "'NT-NUOTAO-OUTDOO-844058953087','NT-NUOTAO-LIGHTW-1043302973575'," \
                      "'NT-NUOTAO-MINI-6036357257500','NT-NUOTAO-WATERP-6127048821365'"

            async def main():
                engine = create_async_engine(s.database_url)
                async with engine.connect() as conn:
                    print("===== FIND BEGIN =====")
                    rows = (await conn.execute(text(
                        f"SELECT id, sku, name, "
                        f"CASE WHEN b2b_showcase_enabled THEN 'enabled' ELSE 'disabled' END AS st, "
                        f"COALESCE(meta->>'woocommerce_id','') AS wcid "
                        f"FROM products WHERE deleted_at IS NULL AND "
                        f"COALESCE(meta->>'woocommerce_id','') IN ({WC_IDS}) ORDER BY wcid"
                    ))).fetchall()
                    print(f"[by_meta_woocommerce_id] count={len(rows)}")
                    for r in rows:
                        print(f"  id={r[0]} sku={r[1]} wc={r[4]} st={r[3]} name={r[2]}")
                    rows2 = (await conn.execute(text(
                        f"SELECT id, sku, name, "
                        f"CASE WHEN b2b_showcase_enabled THEN 'enabled' ELSE 'disabled' END AS st, "
                        f"COALESCE(meta->>'woocommerce_id','') AS wcid "
                        f"FROM products WHERE deleted_at IS NULL AND sku IN ({WC_SKUS}) ORDER BY sku"
                    ))).fetchall()
                    print(f"[by_sku] count={len(rows2)}")
                    for r in rows2:
                        print(f"  id={r[0]} sku={r[1]} wc={r[4]} st={r[3]} name={r[2]}")
                await engine.dispose()

            asyncio.run(main())
            PYEOF
            python3 /tmp/find_wc_rows.py 2>&1 | grep -E "FIND BEGIN|\[by_|count=|  id="
            rm -f /tmp/find_wc_rows.py