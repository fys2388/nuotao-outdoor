name: Hotdeploy Nuotao Score V3.0 P2 Intelligence (one-off)

# P2 of the V3.0 selection alignment (docs/nuotao_product_score_v3.0.md):
#  - migration 0050: upgrade Product Analyst prompts to v3 (both logical names)
#  - AI signal normalizer closes V1/V2/V3/V5 vetoes (deterministic first)
#  - canonical 11-dimension operational score config + coverage
#  - pure V3 sourcing report + collection service + GET .../report
#  - analyst schema nuotao_assessment; candidates drawer report card
# NOTE: packages an explicit runtime file allow-list; tests and the local
# work-in-progress api router are intentionally NOT shipped.
on:
  workflow_dispatch:
  push:
    branches: [hotfix/product-soft-delete]
    paths:
      - '.github/workflows/hotdeploy-nuotao-score-v3-p2.yml'

jobs:
  hotdeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package files
        run: |
          tar -czf v3p2.tgz \
            backend/alembic/versions/0050_analyst_prompt_v3.py \
            backend/app/agents/product_analyst_prompt.py \
            backend/app/agents/agent_seed.py \
            backend/app/schemas/product_analyst.py \
            backend/app/services/nuotao_ai_signals.py \
            backend/app/services/nuotao_report.py \
            backend/app/services/operational_score_v2.py \
            backend/app/services/nuotao_veto.py \
            backend/app/services/nuotao_selection_service.py \
            backend/app/api/v1/endpoints/nuotao_selection.py \
            frontend/src/api/client.ts \
            frontend/src/pages/ProductCandidatesPage.tsx
          tar -tzf v3p2.tgz

      - name: Upload package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: v3p2.tgz
          target: /tmp

      - name: Apply, migrate, restart, build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            set -eo pipefail
            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            BK=/opt/nuotao/backups/v3p2-$STAMP
            mkdir -p "$BK"
            cd /opt/nuotao
            tar -czf "$BK/before.tgz" \
              backend/app/services/nuotao_selection_service.py \
              backend/app/services/nuotao_veto.py \
              backend/app/schemas/product_analyst.py \
              frontend/src/api/client.ts \
              frontend/src/pages/ProductCandidatesPage.tsx 2>/dev/null || true
            tar -xzf /tmp/v3p2.tgz -C /opt/nuotao
            rm -f /tmp/v3p2.tgz

            echo "=== backend compile ==="
            cd /opt/nuotao/backend
            .venv/bin/python -m compileall -q app alembic/versions/0050_analyst_prompt_v3.py && echo compile-ok

            echo "=== migration: before ==="
            .venv/bin/alembic current || true
            echo "=== migration: upgrade head ==="
            .venv/bin/alembic upgrade head
            echo "=== migration: after ==="
            .venv/bin/alembic current

            echo "=== verify prompt v3, rules, routes ==="
            .venv/bin/python - <<'PY'
            import asyncio
            from sqlalchemy import text
            from app.core.database import _engine
            from app.main import app
            async def main():
                async with _engine.connect() as c:
                    n = (await c.execute(text("select count(*) from rules where category='PROD-VETO'"))).scalar()
                    print("PROD-VETO rules:", n); assert n == 12, n
                    p = (await c.execute(text("select count(*) from prompts where name in ('PRODUCT_ANALYST','AGENT_PRODUCT_ANALYST') and version='v3' and status='active'"))).scalar()
                    print("active v3 prompts:", p); assert p == 2, p
                    a = (await c.execute(text("select prompt_version from agents where agent_id='product_analyst' order by workspace_id limit 1"))).scalar()
                    print("agent prompt_version:", a); assert a == 'v3', a
                paths = {r.path for r in app.routes}
                need = [
                    "/api/v1/selection/nuotao/evaluate",
                    "/api/v1/selection/nuotao/evaluate-batch",
                    "/api/v1/selection/nuotao/latest-batch",
                    "/api/v1/selection/nuotao/{product_id}/report",
                ]
                for x in need:
                    assert x in paths, f"missing route {x}"
                print("nuotao routes ok:", len(need))
            asyncio.run(main())
            PY

            echo "=== restart backend ==="
            systemctl restart nuotao-backend
            ready=000
            for i in $(seq 1 25); do
              ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/readyz || true)
              echo "attempt $i readyz=$ready"
              [ "$ready" = "200" ] && break
              sleep 3
            done
            systemctl is-active nuotao-backend
            [ "$ready" = "200" ] || { journalctl -u nuotao-backend -n 40 --no-pager || true; exit 1; }

            echo "=== frontend build + deploy ==="
            cd /opt/nuotao/frontend
            npm install --no-audit --no-fund 2>&1 | tail -3
            set +e; npm run build > /tmp/fe-v3p2.log 2>&1; BRC=$?; set -e
            tail -8 /tmp/fe-v3p2.log
            [ "$BRC" -eq 0 ] || { grep -nE "Could not resolve|error TS|Error" /tmp/fe-v3p2.log | head -40; exit 1; }
            rm -rf /var/www/nuotao && mkdir -p /var/www/nuotao
            cp -a dist/. /var/www/nuotao/
            chown -R www-data:www-data /var/www/nuotao

            bcode=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/readyz || true)
            ccode=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            echo "backend=$bcode console=$ccode backup=$BK"
            [ "$bcode" = "200" ] && [ "$ccode" = "200" ] || exit 1
            echo DONE
