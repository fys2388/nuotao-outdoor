name: Deploy Ops Dashboard

on:
  push:
    paths:
      - 'ops-dashboard/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy ops-dashboard to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "=== 创建 ops-dashboard 目录 ==="
            mkdir -p /opt/nuotao/ops-dashboard
            echo "=== 查找 Nginx 配置文件 ==="
            grep -rl "admin.nuotaooutdoor.com" /etc/nginx/ 2>/dev/null || echo "未找到配置文件"

      - name: Upload index.html via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "ops-dashboard/index.html"
          target: "/opt/nuotao/ops-dashboard/"
          strip_components: 1

      - name: Configure Nginx for ops-dashboard (FORCE REWRITE)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            echo "=== 1. 验证文件已上传 ==="
            ls -la /opt/nuotao/ops-dashboard/
            wc -c /opt/nuotao/ops-dashboard/index.html
            
            echo "=== 2. 查找 Nginx 配置文件 ==="
            NGINX_CONF=$(grep -rl "admin.nuotaooutdoor.com" /etc/nginx/ 2>/dev/null | head -1)
            if [ -z "$NGINX_CONF" ]; then
                NGINX_CONF=$(ls /etc/nginx/sites-enabled/* 2>/dev/null | head -1)
            fi
            echo "使用配置文件: $NGINX_CONF"
            
            echo "=== 调试: 输出 Nginx 配置文件结构 ==="
            echo "--- 所有 server 行 ---"
            grep -n "server" "$NGINX_CONF" | head -20
            echo "--- 所有 location 行 ---"
            grep -n "location" "$NGINX_CONF" | head -30
            echo "--- 所有 listen 行 ---"
            grep -n "listen" "$NGINX_CONF" | head -10
            echo "--- 所有 root 行 ---"
            grep -n "root" "$NGINX_CONF" | head -10
            echo "--- 所有 proxy_pass 行 ---"
            grep -n "proxy_pass" "$NGINX_CONF" | head -10
            echo "--- 所有 try_files 行 ---"
            grep -n "try_files" "$NGINX_CONF" | head -10
            echo "--- 文件总行数 ---"
            wc -l "$NGINX_CONF"
            
            echo "=== 3. 备份配置 ==="
            cp "$NGINX_CONF" "${NGINX_CONF}.bak.$(date +%Y%m%d%H%M%S)"
            
            echo "=== 4. 用 Python 强制重写 ops-dashboard 配置 ==="
            python3 << 'PYEOF'
            import re
            conf_path = "/etc/nginx/sites-available/nuotao"
            with open(conf_path, 'r') as f:
                content = f.read()
            
            # 删除所有旧的 ops-dashboard 相关块（注释 + location）
            pattern = r'\n?\s*#.*[Oo]ps.*[Dd]ashboard.*?\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}'
            content = re.sub(pattern, '', content, flags=re.DOTALL)
            
            # 也删除单独的 location 块
            pattern2 = r'\n\s*location\s*\^?~?\s*/ops-dashboard/.*?\n\s*\}'
            content = re.sub(pattern2, '', content, flags=re.DOTALL)
            
            # 新配置（放在 server 块最开头，优先匹配）
            new_config = "\n    # ============================================\n    # Ops Dashboard 静态文件（优先匹配）\n    # ============================================\n    location ^~ /ops-dashboard/ {\n        alias /opt/nuotao/ops-dashboard/;\n        index index.html;\n        try_files $uri $uri/ /ops-dashboard/index.html;\n    }\n"
            
            # 在所有 server { 之后插入 ops-dashboard 配置
            # 确保无论哪个 server 块处理请求都能匹配到
            count = content.count("server {")
            if count > 0:
                content = content.replace("server {", "server {" + new_config)
                print(f"✅ 已在 {count} 个 server 块中插入 ops-dashboard 配置")
            else:
                print("❌ 未找到 server {")
            
            with open(conf_path, 'w') as f:
                f.write(content)
            print("✅ 配置文件已写入")
            PYEOF
            
            echo ""
            echo "=== 5. 验证配置 ==="
            grep -n -A 6 "ops-dashboard" "$NGINX_CONF" | head -20
            
            echo ""
            echo "=== 6. 测试 Nginx ==="
            nginx -t
            
            echo ""
            echo "=== 7. 重载 Nginx ==="
            systemctl reload nginx
            
            echo ""
            echo "=== 8. 测试访问 ==="
            sleep 3
            curl -s -o /tmp/test_dash.html -w "HTTP: %{http_code}, Size: %{size_download}\n" http://localhost:80/ops-dashboard/
            echo "前3行:"
            head -3 /tmp/test_dash.html
            if grep -q "运营监控中心" /tmp/test_dash.html; then
                echo "✅✅✅ 成功! 返回 ops-dashboard 页面!"
            else
                echo "❌ 失败: 返回的不是 ops-dashboard 页面"
                echo "完整内容:"
                cat /tmp/test_dash.html
            fi
            
            echo ""
            echo "=== 9. 查找前端构建目录并复制 ops-dashboard 文件 ==="
            # 查找包含 index.html 和 assets 目录的前端构建目录
            FRONTEND_DIR=""
            for dir in /opt/nuotao/frontend/dist /opt/nuotao/frontend/build /opt/nuotao/admin/dist /opt/nuotao/admin/build /opt/nuotao/web/dist /opt/nuotao/web/build; do
                if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then
                    FRONTEND_DIR="$dir"
                    echo "找到前端构建目录: $FRONTEND_DIR"
                    break
                fi
            done
            
            # 如果没找到，用 find 命令查找
            if [ -z "$FRONTEND_DIR" ]; then
                echo "用 find 命令查找前端构建目录..."
                FRONTEND_DIR=$(find /opt/nuotao -name "index.html" -path "*/dist/*" -o -name "index.html" -path "*/build/*" 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
                echo "find 找到的目录: $FRONTEND_DIR"
            fi
            
            if [ -n "$FRONTEND_DIR" ] && [ -d "$FRONTEND_DIR" ]; then
                echo "前端构建目录: $FRONTEND_DIR"
                # 直接复制为 ops-dashboard.html（.html 文件不会被 SPA 路由拦截）
                cp /opt/nuotao/ops-dashboard/index.html "$FRONTEND_DIR/ops-dashboard.html"
                echo "✅ 已复制 ops-dashboard 文件到 $FRONTEND_DIR/ops-dashboard.html"
                
                # 同时也创建子目录方式
                mkdir -p "$FRONTEND_DIR/ops-dashboard"
                cp /opt/nuotao/ops-dashboard/index.html "$FRONTEND_DIR/ops-dashboard/index.html"
                
                # 测试访问 .html 方式
                sleep 2
                curl -s -o /tmp/test_dash2.html -w "HTTP: %{http_code}, Size: %{size_download}\n" http://localhost:80/ops-dashboard.html
                if grep -q "运营监控中心" /tmp/test_dash2.html; then
                    echo "✅✅✅ 成功! 通过 ops-dashboard.html 访问页面!"
                else
                    echo "❌ 通过 ops-dashboard.html 访问失败"
                    head -3 /tmp/test_dash2.html
                fi
            else
                echo "❌ 未找到前端构建目录"
            fi
            
            echo ""
            echo "=== 部署完成 ==="
