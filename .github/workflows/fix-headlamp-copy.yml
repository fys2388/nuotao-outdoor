name: Finalize headlamp copy

# One-off (M420-05): clear the wrongly-touched LED description and confirm the MH1
# English copy. Deleted after verification.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  finalize:
    name: Finalize headlamp copy (SSH)
    runs-on: ubuntu-latest
    steps:
      - name: Finalize headlamp copy (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            . .venv/bin/activate 2>/dev/null || source .venv/bin/activate
            echo '' | base64 -d > /tmp/fix_hl.py
            python /tmp/fix_hl.py 2>&1 | tail -20
            rm -f /tmp/fix_hl.py
