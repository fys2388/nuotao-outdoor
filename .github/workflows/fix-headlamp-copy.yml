name: Inspect LED headlamp record

# One-off diagnostic (M420-05): inspect the wrongly-touched LED headlamp row to
# recover its original description from meta / source_snapshot. Deleted after use.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  inspect:
    name: Inspect LED headlamp (SSH)
    runs-on: ubuntu-latest
    steps:
      - name: Inspect LED headlamp (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            . .venv/bin/activate 2>/dev/null || source .venv/bin/activate
            echo '' | base64 -d > /tmp/inspect_led.py
            python /tmp/inspect_led.py 2>&1 | tail -20
            rm -f /tmp/inspect_led.py
