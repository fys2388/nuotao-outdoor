name: Fix headlamp English copy

# One-off (M420-05, user-approved): translate the MH1 headlamp (WC 2565) showcase
# title/description from Chinese to English in the nuotao products table.
# B2B display layer only - the WooCommerce source listing is NOT touched.
# Deleted after verification (M420-06 cleanup policy).
#
# Python is inlined as base64: YAML block scalars need every line inside
# "script: |" indented; top-level Python lines there break workflow parsing.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  fix_copy:
    name: Fix headlamp copy (SSH)
    runs-on: ubuntu-latest
    steps:
      - name: Fix headlamp copy (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/nuotao-ai-os/backend
            . .venv/bin/activate 2>/dev/null || source .venv/bin/activate
            echo '' | base64 -d > /tmp/fix_hl.py
            python /tmp/fix_hl.py 2>&1 | tail -25
            rm -f /tmp/fix_hl.py
