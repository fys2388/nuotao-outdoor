name: Hotfix - Listing Publish Gate (V3.0)

# Fixes the keyword-listing publish path end-to-end without overwriting any
# existing production file.
#
# Bug chain fixed:
#   1. price fracture  - pipeline writes meta.sale_price only; the WooCommerce
#                        payload therefore carried a sale price with no regular
#                        price, which WooCommerce rejects.
#   2. swallowed error - push failures returned {"success": false} with HTTP 200,
#                        and the frontend only checked the HTTP status, so the UI
#                        reported "已推送" while nothing was created.
#   3. no gate         - the page advertises a V3.0 selection gate that did not
#                        exist; any draft product with no price could be pushed.
#   4. wrong copy      - the payload used the raw Chinese source text instead of
#                        the approved English localization.
#   5. field mismatch  - the frontend read `copy.bullets` while the backend stores
#                        `bullet_points`, so approved selling points never rendered.
#
# Strategy: ADD modules (listing_gate.py, listing_publish.py), then anchor-assert
# two surgical edits (router registration, frontend field name). Everything is
# backed up to /opt/nuotao/backups/ first. Nothing is rsync'd with --delete.
#
# Trigger: push to branch hotfix/listing-gate

on:
  workflow_dispatch:
  push:
    branches: [hotfix/listing-gate]

jobs:
  hotfix:
    name: Patch gate on production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package patch
        run: |
          tar -czf listing-gate.tgz hotfix-listing-gate
          echo "--- package contents ---"
          tar -tzf listing-gate.tgz

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: listing-gate.tgz
          target: /tmp/listing-gate-patch.tgz

      - name: Apply patch, restart backend, rebuild frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -euo pipefail
            export PYTHONIOENCODING=utf-8
            export LANG=C.UTF-8
            BACKEND=/opt/nuotao/backend
            FRONTEND=/opt/nuotao/frontend
            PY="$BACKEND/.venv/bin/python"
            cd /opt/nuotao

            echo "===== 0. unpack patch package ====="
            rm -rf /tmp/listing-gate-patch && mkdir -p /tmp/listing-gate-patch
            tar -xzf /tmp/listing-gate-patch.tgz -C /tmp/listing-gate-patch
            find /tmp/listing-gate-patch -type f | sort
            test -x "$PY" || test -f "$PY" || { echo "ERROR: $PY missing"; exit 1; }

            echo "===== 1. DRY RUN (preflight + anchor assertions) ====="
            "$PY" /tmp/listing-gate-patch/hotfix-listing-gate/scripts/apply_patch.py \
              --patch-dir /tmp/listing-gate-patch/hotfix-listing-gate \
              --backend "$BACKEND" --frontend "$FRONTEND" --dry-run

            echo "===== 2. APPLY ====="
            "$PY" /tmp/listing-gate-patch/hotfix-listing-gate/scripts/apply_patch.py \
              --patch-dir /tmp/listing-gate-patch/hotfix-listing-gate \
              --backend "$BACKEND" --frontend "$FRONTEND"

            echo "===== 3. confirm router registration ====="
            grep -n "listing_publish\|listing-gate hotfix" "$BACKEND/app/api/v1/router.py" | head -8

            echo "===== 4. restart backend and wait for ready ====="
            systemctl restart nuotao-backend
            ready=000
            for i in $(seq 1 25); do
              ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/readyz || true)
              echo "attempt $i readyz=$ready"
              [ "$ready" = "200" ] && break
              sleep 3
            done
            systemctl is-active nuotao-backend
            if [ "$ready" != "200" ]; then
              echo "ERROR: backend not ready after restart"
              journalctl -u nuotao-backend -n 60 --no-pager || true
              exit 1
            fi

            echo "===== 5. gate self-check (must NOT return 200 for an unpriced draft) ====="
            echo "-- openapi route present:"
            curl -s http://127.0.0.1:8000/openapi.json 2>/dev/null \
              | grep -o 'push-woocommerce' | sort | uniq -c || echo "(openapi.json not served - ok)"
            ID=$(curl -s "http://127.0.0.1:8000/api/v1/products?limit=200&offset=0" \
                 | "$PY" -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'] if isinstance(d,list) and d else '')")
            echo "probe product id=$ID"
            if [ -n "$ID" ]; then
              CODE=$(curl -s -o /tmp/probe.json -w '%{http_code}' -X POST "http://127.0.0.1:8000/api/v1/products/$ID/push-woocommerce" || true)
              echo "probe status=$CODE"
              cat /tmp/probe.json | head -c 800; echo
            fi

            echo "===== 6. build frontend ====="
            cd "$FRONTEND"
            npm install --no-audit --no-fund 2>&1 | tail -5
            set +e
            npm run build > /tmp/fe-listing-gate.log 2>&1
            BRC=$?
            set -e
            tail -15 /tmp/fe-listing-gate.log
            if [ "$BRC" -ne 0 ]; then
              echo "WARN: frontend build failed - backend gate is live, old UI assets remain"
              grep -n -E "Could not resolve|is not exported|failed to load|SyntaxError|error" /tmp/fe-listing-gate.log | head -20 || true
            else
              echo "===== 7. deploy frontend static ====="
              rm -rf /var/www/nuotao/*
              cp -r dist/* /var/www/nuotao/
              chown -R www-data:www-data /var/www/nuotao
              ls /var/www/nuotao | head
            fi

            echo "===== 8. final health ====="
            B=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/readyz || true)
            C=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            echo "backend=$B console=$C"
            [ "$B" = "200" ] || { echo "ERROR backend health=$B"; journalctl -u nuotao-backend -n 40 --no-pager || true; exit 1; }
            echo "DONE listing-gate hotfix applied"
