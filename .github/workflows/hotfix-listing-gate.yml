name: Hotfix - Listing Publish Gate (V3.0)

# Fixes the keyword-listing publish path end-to-end without overwriting any
# existing production file.
#
# Bug chain fixed:
#   1. price fracture  - pipeline writes meta.sale_price only; the WooCommerce
#                        payload therefore carried a sale price with no regular
#                        price, which WooCommerce rejects.
#   2. swallowed error - the old endpoint raised HTTP 400 only when
#                        push_product_to_woocommerce reported failure, and the
#                        frontend still treated a rejected push as a soft error
#                        instead of a gated decision.
#   3. no gate         - the page advertises a V3.0 selection gate that did not
#                        exist; any draft product with no price could be pushed.
#   4. wrong copy      - the payload used the raw Chinese source text instead of
#                        the approved English localization.
#   5. field mismatch  - the frontend read copy.bullets while the backend stores
#                        bullet_points, so approved selling points never rendered.
#
# Strategy: ADD modules (listing_gate.py, listing_publish.py), then anchor-assert
# two surgical edits (router registration, frontend field name). Everything is
# backed up to /opt/nuotao/backups/ first. Nothing is rsync'd with --delete and
# nothing is `git reset --hard`'d.
#
# Deliberately does NOT use appleboy/scp-action: deploy.yml (the workflow that
# actually ships production) transfers files with rsync/tar over the ssh-action
# session only. This one fetches the patch by cloning the public branch on the
# server, so no file transfer step can fail.
#
# Diagnostics: script output is mirrored to
# /var/www/nuotao/assets/deploy-listing-gate.log ->
# https://admin.nuotaooutdoor.com/assets/deploy-listing-gate.log
# (/assets is the only nginx location that serves real files; every other path
# falls through to the SPA index.html, and /openapi.json is Cloudflare-cached.)
#
# Trigger: push to branch hotfix/listing-gate

on:
  workflow_dispatch:
  push:
    branches: [hotfix/listing-gate]

# Mirrors deploy.yml exactly: secrets are lifted into workflow-level env and the
# ssh-action reads ${{ env.* }}, not ${{ secrets.* }}.
env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

# A later push supersedes an earlier run of this one-off hotfix.
concurrency:
  group: listing-gate-hotfix
  cancel-in-progress: true

jobs:
  hotfix:
    name: Patch gate on production
    runs-on: ubuntu-latest
    steps:
      - name: Deployment info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run: #${GITHUB_RUN_NUMBER}"
          echo "Deploying to: ${{ env.SERVER_HOST }}"
          # An empty host means the server secrets are not visible to this
          # branch; fail loudly instead of letting ssh-action die silently.
          if [ -z "${env.SERVER_HOST}" ] || [ -z "${env.SSH_PRIVATE_KEY}" ]; then
            echo "::error::SERVER_HOST/SSH_PRIVATE_KEY secrets are not available on branch ${{ github.ref_name }}"
            exit 1
          fi

      - name: Apply patch, restart backend, rebuild frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # NOTE: no `set -o pipefail` - dash 0.5.11 (Ubuntu 22.04) rejects it
            # with "Illegal option" and the whole script dies on line 1.
            set -eu
            export PYTHONIOENCODING=utf-8
            export LANG=C.UTF-8
            BACKEND=/opt/nuotao/backend
            FRONTEND=/opt/nuotao/frontend
            PY="$BACKEND/.venv/bin/python"
            REPO=https://github.com/fys2388/nuotao-outdoor.git
            BRANCH=hotfix/listing-gate
            TMPLOG=/tmp/deploy-listing-gate.log
            LOG=/var/www/nuotao/assets/deploy-listing-gate.log
            # Prove writability before stdout is redirected away: if this line
            # never lands, the ssh step itself did not execute.
            mkdir -p "$(dirname "$LOG")" 2>/dev/null || true
            printf 'listing-gate hotfix reached the server at %s\nshell=%s user=%s\n' \
              "$(date -u +%FT%TZ)" "$0" "$(id -un)" > "$LOG" 2>/dev/null || true
            chown www-data:www-data "$LOG" 2>/dev/null || true
            : > "$TMPLOG"
            exec > "$TMPLOG" 2>&1
            mirror() {
              cp -f "$TMPLOG" "$LOG" 2>/dev/null || true
              chown www-data:www-data "$LOG" 2>/dev/null || true
            }

            echo "########## listing-gate hotfix started $(date -u +%FT%TZ) ##########"
            echo "shell=$0 user=$(id -un) cwd=$(cd /opt/nuotao && pwd)"
            cd /opt/nuotao
            mirror

            echo "===== 0. fetch patch by cloning the public branch ====="
            rm -rf /tmp/nuotao-hotfix
            git clone --depth 1 --branch "$BRANCH" "$REPO" /tmp/nuotao-hotfix
            find /tmp/nuotao-hotfix/hotfix-listing-gate -type f | sort
            PATCHDIR=/tmp/nuotao-hotfix/hotfix-listing-gate
            APPLY="$PATCHDIR/scripts/apply_patch.py"
            test -f "$PY" || { echo "ERROR: $PY missing"; mirror; exit 1; }
            test -f "$APPLY" || { echo "ERROR: apply script missing: $APPLY"; mirror; exit 1; }
            echo "python: $($PY --version 2>&1)"
            mirror

            echo "===== 0b. production layout probe ====="
            echo "backend files:"
            ls -la "$BACKEND/app/api/v1/router.py" "$BACKEND/app/services/woocommerce_sync_service.py" 2>&1
            echo "frontend page candidates:"
            find "$FRONTEND/src" -maxdepth 3 -iname "*ProductPublish*" 2>/dev/null || echo "  (none)"
            mirror

            echo "===== 1. DRY RUN (preflight + anchor assertions) ====="
            if "$PY" "$APPLY" --patch-dir "$PATCHDIR" \
                 --backend "$BACKEND" --frontend "$FRONTEND" --dry-run; then
              echo "DRY RUN OK"
            else
              echo "ERROR: dry run failed - nothing was changed"
              mirror
              exit 1
            fi
            mirror

            echo "===== 2. APPLY ====="
            if "$PY" "$APPLY" --patch-dir "$PATCHDIR" \
                 --backend "$BACKEND" --frontend "$FRONTEND"; then
              echo "APPLY OK"
            else
              echo "ERROR: apply failed - restore from the backup dir printed above"
              mirror
              exit 1
            fi
            mirror

            echo "===== 3. confirm router registration ====="
            grep -n "listing_publish" "$BACKEND/app/api/v1/router.py" | head -8
            test -f "$BACKEND/app/services/listing_gate.py" && echo "listing_gate.py present"
            test -f "$BACKEND/app/api/v1/endpoints/listing_publish.py" && echo "listing_publish.py present"
            cd "$BACKEND"
            "$PY" -m compileall -q app && echo "compile-ok"
            cd /opt/nuotao
            mirror

            echo "===== 4. restart backend and wait for ready ====="
            systemctl restart nuotao-backend
            ready=000
            for i in $(seq 1 25); do
              ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/readyz || true)
              echo "attempt $i readyz=$ready"
              [ "$ready" = "200" ] && break
              sleep 3
            done
            systemctl is-active nuotao-backend || true
            if [ "$ready" != "200" ]; then
              echo "ERROR: backend not ready after restart"
              journalctl -u nuotao-backend -n 60 --no-pager || true
              mirror
              exit 1
            fi
            mirror

            echo "===== 5. gate self-check ====="
            NEWPATH=$(curl -s http://127.0.0.1:8000/openapi.json \
              | grep -o '/api/v1/products/{product_id}/push-woocommerce' | head -1)
            echo "openapi push-woocommerce path: $NEWPATH"
            curl -s http://127.0.0.1:8000/openapi.json | grep -c 'listing_publish' || true
            ID=$(curl -s "http://127.0.0.1:8000/api/v1/products?limit=200&offset=0" \
                 | "$PY" -c "import json,sys; d=json.load(sys.stdin); print(d[0].get('id','') if isinstance(d,list) and d else '')" 2>/dev/null || true)
            echo "probe product id=$ID"
            if [ -n "$ID" ]; then
              CODE=$(curl -s -o /tmp/probe.json -w '%{http_code}' \
                -X POST "http://127.0.0.1:8000/api/v1/products/$ID/push-woocommerce" || true)
              echo "probe POST push-woocommerce status=$CODE"
              head -c 800 /tmp/probe.json; echo
            fi
            mirror

            echo "===== 6. build frontend ====="
            cd "$FRONTEND"
            npm install --no-audit --no-fund 2>&1 | tail -5
            set +e
            npm run build > /tmp/fe-listing-gate.log 2>&1
            BRC=$?
            set -e
            tail -15 /tmp/fe-listing-gate.log
            if [ "$BRC" -ne 0 ]; then
              echo "WARN: frontend build failed - backend gate is live, old UI assets remain"
              grep -n -E "Could not resolve|is not exported|failed to load|SyntaxError" /tmp/fe-listing-gate.log | head -20 || true
            else
              echo "===== 7. deploy frontend static ====="
              rm -rf /var/www/nuotao/*
              cp -r dist/* /var/www/nuotao/
              chown -R www-data:www-data /var/www/nuotao
              ls /var/www/nuotao | head
            fi

            echo "===== 8. final health ====="
            B=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/readyz || true)
            C=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            echo "backend=$B console=$C"
            [ "$B" = "200" ] || { echo "ERROR backend health=$B"; journalctl -u nuotao-backend -n 40 --no-pager || true; mirror; exit 1; }
            echo "########## DONE $(date -u +%FT%TZ) ##########"
            mirror
